<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://arnrlepjuqdmvbipswci.supabase.co; img-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>设置新密码 · Hermes To Do</title>
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#10131b;color:#f1eadb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,#2b3042 0,transparent 58%),linear-gradient(#121622,#0c0e16);display:grid;place-items:center;padding:28px 15px}
    .sheet{width:min(100%,490px);border:1px solid #6e6250;background:#151b27;box-shadow:0 25px 80px #0009;padding:clamp(23px,5vw,46px);position:relative}
    .sheet:before,.sheet:after{content:"✦";position:absolute;color:#ab9261;font-size:18px}
    .sheet:before{top:12px;left:16px}.sheet:after{right:16px;bottom:12px}
    .symbol{font-family:Georgia,serif;text-align:center;color:#c7a776;letter-spacing:.5em;font-size:20px;margin-bottom:15px}
    h1{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:30px;letter-spacing:.08em;text-align:center;margin:0 0 8px}
    .sub{font-size:12px;letter-spacing:.16em;color:#a7aebc;text-align:center;margin:0 0 27px}
    .description{font-size:14px;line-height:1.8;color:#c8c9ce;margin:0 0 16px}
    .account{font-size:13px;color:#d9be91;overflow-wrap:anywhere;line-height:1.6}
    .state{font-size:13px;line-height:1.6;border-left:2px solid #a78c61;padding:11px 13px;margin:17px 0;background:#222b38}
    .state[data-kind=error]{border-color:#d27f7f;color:#ffd4d4;background:#38252a}
    label{display:block;font-size:13px;color:#d9cfbd;margin:19px 0 7px}
    input{display:block;width:100%;color:#f5f0e7;background:#0c111a;border:1px solid #596070;border-radius:3px;padding:12px 13px;font:inherit;min-height:45px}
    input:focus{outline:2px solid #b59868;outline-offset:2px}
    button{display:block;width:100%;min-height:47px;font:600 14px system-ui,-apple-system,sans-serif;letter-spacing:.05em;cursor:pointer;border:1px solid #d8bd8f;background:#bda274;color:#141820;margin:22px 0 12px}
    button:disabled{opacity:.55;cursor:wait}
    button.secondary{background:transparent;border-color:#7d7366;color:#dbc6a4;margin:10px 0 0}
    .hint{color:#9ca5b4;font-size:12px;line-height:1.65}
    a{color:#d7bf97;text-underline-offset:3px}
    .back{border-top:1px solid #343948;margin:27px 0 0;padding-top:20px;text-align:center;font-size:13px}
    .steps{font-size:13px;color:#c1c5d0;line-height:1.85;padding-left:22px}
    .steps li{margin:4px 0}
    .footnote{text-align:center;font-size:11px;color:#9097a3;margin-top:25px;line-height:1.6}
  </style>
</head>
<body>
  <main class="sheet">
    <div class="symbol" aria-hidden="true">⚜</div>
    <h1>设置新密码</h1>
    <p class="sub">HERMES TO DO · ACCOUNT SECURITY</p>
    <p class="description">保留原账户、清单及任务数据，仅更新今后的登录密码。</p>
    <p class="account" id="account">正在核验账户身份…</p>
    <div id="status" class="state" role="status" aria-live="polite">正在检查邮件登录状态…</div>

    <form id="password-form" hidden>
      <label for="new-password">新密码</label>
      <input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <p class="hint">建议至少 12 位，使用密码管理器生成并保存，不要复用其他网站的密码。</p>
      <label for="confirm-password">确认新密码</label>
      <input id="confirm-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <div id="nonce-area" hidden>
        <label for="nonce">邮箱安全验证码（仅在系统要求时填写）</label>
        <input id="nonce" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
        <button type="button" class="secondary" id="send-nonce">发送邮箱验证码</button>
      </div>
      <button id="submit-password" type="submit">确认设置新密码</button>
    </form>

    <div class="back">
      <a href="./">返回 Hermes To Do</a>
    </div>
    <ol class="steps">
      <li>尚未登录？返回首页，点击「首次登录 / 忘记密码？用邮件登录一次」。</li>
      <li>通过绑定邮箱的邮件链接登录，然后回到本页面。</li>
      <li>输入新密码两次，点击「确认设置新密码」。</li>
    </ol>
    <p class="footnote">密码直接发送给 Supabase 身份验证服务，不会提交到聊天或 GitHub。</p>
  </main>
  <script defer src="./password-reset.js"></script>
</body>
</html>
