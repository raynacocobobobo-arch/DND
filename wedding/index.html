":"korean","name":"韩式","en":"KOREAN","subtitle":"象牙白 · 纯净仪式感","tags":["韩式","白色","简约"],"cover":"/images/korean.jpg","hero":"/images/korean.jpg","images":["/images/korean.jpg"],"desc":"通透白色花艺与垂幔构成简洁、纯净的韩式婚礼空间。"}]};const PHOTO={"/images/traditional_chinese.jpg":"images/traditional_chinese.jpg","/images/coffee_drapery.jpg":"images/coffee_drapery.jpg","/images/pink_drapery.jpg":"images/pink_drapery.jpg","/images/new_chinese.jpg":"images/new_chinese.jpg","/images/forest.jpg":"images/forest.jpg","/images/european.jpg":"images/european.jpg","/images/french_garden.jpg":"images/french_garden.jpg","/images/old_money.jpg":"images/old_money.jpg","/images/korean.jpg":"images/korean.jpg"};const STYLES=D.styles;
let filterId='all',hero=0,favorites=[];
try{favorites=JSON.parse(localStorage.getItem('wedding_favs')||'[]')}catch(e){}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(p){return PHOTO[p]||''}function style(id){return STYLES.find(x=>x.id===id)||STYLES[0]}
function route(){return(location.hash.replace(/^#/,'')||'home').split('/')}
function go(page,id,idx){const next='#'+page+(id?'/'+id:'')+(idx!==undefined?'/'+idx:'');if(location.hash===next)render(true);else location.hash=next}
function back(){const [page]=route();go(page==='product'?'gallery':'home')}
function setNav(page){$('#back').style.display=page==='home'?'none':'inline-flex';$('#works-nav').classList.toggle('active',page==='gallery'||page==='product');$('#mine').classList.toggle('active',page==='mine');$('.footer').style.display=page==='inquiry'?'none':'flex'}
function labels(){const onHome=location.hash===''||location.hash==='#home';return `<div class="filter-scroll ${onHome?'home-filter':''}"><div class="filter-row"><button class="filter ${filterId==='all'?'active':''}" onclick="changeFilter('all')">全部标签</button>${STYLES.map(s=>`<button class="filter ${filterId===s.id?'active':''}" onclick="changeFilter('${s.id}')">${s.name}</button>`).join('')}</div></div>`}
function cards(max){let arr=STYLES.filter(x=>filterId==='all'||filterId===x.id);if(max)arr=arr.slice(0,max);return `<div class="grid">${arr.map(s=>`<button class="tile" onclick="go('product','${s.id}',0)" aria-label="查看${esc(s.name)}作品"><img class="tile-image" src="${img(s.cover)}" alt="${esc(s.name)}" loading="lazy" decoding="async"><div class="tile-caption"><strong>${esc(s.name)}</strong><span>${esc(s.subtitle)}</span></div></button>`).join('')}</div>`}
function changeFilter(id){filterId=id;render(false)}
function shiftHero(delta){hero=(hero+delta+STYLES.length)%STYLES.length;render(false)}
const svg=(name)=>({phone:'<svg viewBox="0 0 24 24"><path d="M6 3 3 6c0 8 7 15 15 15l3-3-5-4-3 3c-3-1-5-3-6-6l3-3z" fill="#111" stroke="none"/></svg>',wechat:'<svg viewBox="0 0 24 24"><ellipse cx="10" cy="10" rx="8" ry="7" fill="#111" stroke="none"/><ellipse cx="17.5" cy="17" rx="5.5" ry="4.5" fill="#111" stroke="white" stroke-width="1"/><circle cx="7" cy="8" r=".8" fill="white"/><circle cx="13" cy="8" r=".8" fill="white"/></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M12 22s-7-8-7-13a7 7 0 1 1 14 0c0 5-7 13-7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M6 18 18 6M10 6h8v8"/></svg>'})[name];
function home(){const s=STYLES[hero];return `<section class="hero"><img src="${img(s.hero)}" alt="${esc(s.name)}婚礼场景" fetchpriority="high"><div class="hero-shade"></div><div class="hero-content"><span class="eyebrow">WEDDING COLLECTION</span><h1>婚礼精选</h1><p>${esc(s.name)} · ${esc(s.subtitle)}</p><button class="hero-link" onclick="go('product','${s.id}')">查看这组作品 →</button></div><div class="hero-controls"><button onclick="shiftHero(-1)" aria-label="上一张作品">‹</button><span>${hero+1} / ${STYLES.length}</span><button onclick="shiftHero(1)" aria-label="下一张作品">›</button></div></section><section class="home-intro"><div><span class="eyebrow">CURATED MOMENTS</span><h2>九种婚礼灵感</h2><p>从东方典雅到纯白浪漫，寻找属于你们的仪式感。</p></div><button class="intro-all" onclick="go('gallery')">全部作品 →</button></section><section class="collection">${labels()}${cards()}</section><section class="home-contact"><span class="eyebrow">LET'S BEGIN</span><h2>你的婚礼，从一个喜欢的画面开始</h2><p>选好喜欢的风格，告诉我们日期、地点和想法。</p><button onclick="go('inquiry')">咨询婚礼方案 →</button></section>`}
function gallery(){return `<section class="gallery-page"><div class="gallery-heading"><span class="eyebrow">THE COLLECTION</span><h1>婚礼作品</h1><p>九种婚礼场景风格，点击图片查看风格详情。</p></div>${labels()}${cards()}</section>`}
function product(id){const s=style(id);return `<section class="product-page"><div class="detail-top"><img onclick="openFull('${s.id}',0)" src="${img(s.cover)}" alt="${esc(s.name)}婚礼主视觉" fetchpriority="high"><button class="detail-expand" onclick="openFull('${s.id}',0)">查看大图 ⤢</button></div><div class="detail-info"><span class="detail-en">${esc(s.en)}</span><h1>${esc(s.name)}</h1><p>${esc(s.desc)}</p><div class="detail-tags">${s.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="detail-actions"><button onclick="fav('${s.id}')">${favorites.includes(s.id)?'♥ 已收藏':'♡ 收藏风格'}</button><button onclick="go('inquiry','${s.id}')">咨询这种风格 →</button></div><button class="back-works" onclick="go('gallery')">← 查看其他婚礼作品</button></div></section>`}
function openFull(id,index){const s=style(id);const p=s.images[index]||s.cover;$('#lightbox-image').src=img(p);$('#lightbox-image').alt=s.name;$('#lightbox').hidden=false;document.body.style.overflow='hidden'}
function closeFull(){$('#lightbox').hidden=true;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#lightbox').hidden)closeFull()})
function fav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):favorites.concat(id);try{localStorage.setItem('wedding_favs',JSON.stringify(favorites))}catch(e){}render(false)}
function mine(){const a=STYLES.filter(s=>favorites.includes(s.id));return `<div class="page-head"><h1>我的</h1><p>收藏的婚礼作品</p></div>${a.length?`<div class="gallery-page"><div class="grid">${a.map(s=>`<div class="tile" onclick="go('product','${s.id}')"><img class="tile-image" src="${img(s.cover)}"><p class="tile-caption">${s.name}</p></div>`).join('')}</div></div>`:`<div class="empty">还没有收藏的作品<br><button onclick="go('gallery')">去看看作品　›</button></div>`}`}
function inquiry(id){let s=STYLES.find(x=>x.id===id);return `<div class="page-head"><h1>婚礼咨询</h1><p>留下联系方式，方便沟通你的婚礼需求。</p></div><form class="form" onsubmit="submitInquiry(event)"><label>称呼<input name="name" required placeholder="怎么称呼您"></label><label>联系方式<input name="phone" required placeholder="联系电话" type="tel"></label><label>婚礼日期<input name="date" type="date"></label><label>婚礼地点<input name="city" placeholder="城市 / 酒店"></label><label>喜欢的作品<select name="style"><option value="">暂未确定</option>${STYLES.map(x=>`<option ${s?.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><label>其他需求<textarea name="remark" placeholder="选填"></textarea></label><button class="submit" type="submit">复制咨询信息</button><p class="form-hint">当前为交互预览，未配置商家信息接收。</p></form>`}
function submitInquiry(e){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);const text='【婚礼咨询】\n'+Object.entries(v).map(([k,x])=>k+'：'+x).join('\n');navigator.clipboard?.writeText(text).then(()=>showToast('已复制咨询内容，未自动发送')).catch(()=>showToast('请长按复制表单内容'))}
function showToast(msg){let old=$('.toast');if(old)old.remove();let div=document.createElement('div');div.className='toast';div.innerText=msg;document.body.appendChild(div);setTimeout(()=>div.remove(),2400)}
function phone(){showToast('手机号尚未配置')}function wechat(){showToast('微信号尚未配置')}function locationInfo(){showToast('承接不同地点的婚礼，具体场地请咨询')}
function share(){const url=location.href;const title='婚礼精选｜婚礼作品';if(navigator.share)navigator.share({title,url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>showToast('已复制页面链接')).catch(()=>showToast('可复制当前页面地址分享'))}
function render(top){const [page,id,idx]=route();if(top)window.scrollTo({top:0,behavior:'instant'});setNav(page);$('#app').innerHTML=({home:()=>home(),gallery:()=>gallery(),product:()=>product(id,idx),inquiry:()=>inquiry(id),mine:()=>mine()}[page]||(()=>home()))();}
window.addEventListener('hashchange',()=>render(true));render(true);
</script></body></html>
