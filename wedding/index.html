const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(p){return PHOTO[p]||''}function style(id){return STYLES.find(x=>x.id===id)||STYLES[0]}function tier(id){return TIERS.find(x=>x.id===id)||TIERS[0]}
function route(){return(location.hash.replace(/^#/,'')||'home').split('/')};function go(page,id,idx){location.hash='#'+page+(id?'/'+id:'')+(idx!==undefined?'/'+idx:'');render(true)}function back(){history.length>1?history.back():go('home')}
function setNav(page){const t={home:'',gallery:'展示案例',product: '婚礼作品',inquiry:'婚礼咨询',mine:'我的'};$('#nav-title').textContent=t[page]||'';$('#back').style.display=page==='home'?'none':'block';$('#mine').style.display=['home','gallery'].includes(page)?'flex':'none'}
function labels(){const onHome=location.hash===''||location.hash==='#home';return `<div class="filter-scroll ${onHome?'home-filter':''}"><div class="filter-row"><button class="filter ${filterId==='all'?'active':''}" onclick="changeFilter('all')">全部标签</button>${STYLES.map(s=>`<button class="filter ${filterId===s.id?'active':''}" onclick="changeFilter('${s.id}')">${s.name}</button>`).join('')}</div></div>`}
function cards(max){let arr=STYLES.filter(x=>filterId==='all'||filterId===x.id);if(max)arr=arr.slice(0,max);return `<div class="grid ${grid3?'three':''}">${arr.map(s=>`<article class="tile" onclick="go('product','${s.id}',0)"><div class="tile-visual"><img class="tile-image" src="${img(s.cover)}" alt="${esc(s.name)}"></div><div class="tile-caption">${esc(s.name)}｜${esc(s.subtitle)}</div></article>`).join('')}</div>`}
function changeFilter(id){filterId=id;render(false)}function toggleGrid(){grid3=!grid3;render(false)}
const svg=(name)=>({phone:'<svg viewBox="0 0 24 24"><path d="M6 3 3 6c0 8 7 15 15 15l3-3-5-4-3 3c-3-1-5-3-6-6l3-3z" fill="#111" stroke="none"/></svg>',wechat:'<svg viewBox="0 0 24 24"><ellipse cx="10" cy="10" rx="8" ry="7" fill="#111" stroke="none"/><ellipse cx="17.5" cy="17" rx="5.5" ry="4.5" fill="#111" stroke="white" stroke-width="1"/><circle cx="7" cy="8" r=".8" fill="white"/><circle cx="13" cy="8" r=".8" fill="white"/></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M12 22s-7-8-7-13a7 7 0 1 1 14 0c0 5-7 13-7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M6 18 18 6M10 6h8v8"/></svg>'})[name];
function home(){let s=STYLES[hero];return `<div class="hero"><img onclick="go('product','${s.id}')" src="${img(s.hero)}"><button class="expand" onclick="go('product','${s.id}')">⛶</button><div class="hero-dots">${STYLES.map((x,i)=>`<button class="${i===hero?'selected':''}" onclick="hero=${i};render(false)">◆</button>`).join('')}</div><button class="mute" onclick="showToast('当前是静态图片，暂无视频音轨')">◀̸</button></div><section class="brand-intro"><h1>婚礼精选</h1><div class="quick">${[['phone','电话','phone()'],['wechat','微信','wechat()'],['pin','位置','locationInfo()'],['share','分享','share()']].map(([ico,text,fn])=>`<div class="quick-item" onclick="${fn}"><span class="quick-btn">${svg(ico)}</span><span>${text}</span></div>`).join('')}</div></section><div class="split"></div><section class="collection"><h2 class="collection-head" onclick="go('gallery')">作品 ›</h2>${labels()}${cards()}</section><div class="split"></div>`}
function gallery(){return `<div class="gallery-page">${labels()}<button class="gallery-toggle" title="切换图列" onclick="toggleGrid()">▦</button>${cards()}</div>`}
function product(id,idx){let s=style(id);detailIdx=Number.isInteger(+idx)&&idx!==undefined?Math.min(Math.max(+idx,0),s.images.length-1):detailIdx;let src=s.images[detailIdx]||s.images[0];return `<div class="detail-top"><img onclick="openFull('${s.id}',${detailIdx})" src="${img(src)}"><button class="detail-left" onclick="slide(-1)">‹</button><button class="detail-right" onclick="slide(1)">›</button><span class="detail-index">${detailIdx+1} / ${s.images.length}</span></div><div class="detail-info"><h1>${s.name}</h1><p>${esc(s.subtitle)}</p><div class="detail-tags">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div><button class="favorite" onclick="fav('${s.id}')">${favorites.includes(s.id)?'♥ 已收藏':'♡ 收藏这个作品'}</button><h2 class="detail-subhead">作品图集 · ${s.images.length} 张</h2></div><div class="detail-grid"><div class="grid">${s.images.map((p,i)=>`<article class="tile" onclick="go('product','${s.id}',${i})"><div class="tile-visual"><img class="tile-image" src="${img(p)}"></div></article>`).join('')}</div></div>`}
function slide(delta){const [,id]=route(),s=style(id);detailIdx=(detailIdx+delta+s.images.length)%s.images.length;render(false)}function openFull(id,index){const s=style(id);window.open(img(s.images[index]),'_blank')}
function fav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):favorites.concat(id);try{localStorage.setItem('wedding_favs',JSON.stringify(favorites))}catch(e){}render(false)}
function packages(){return `<div class="page-head"><h1>婚礼套餐</h1><p>不同预算，自由选择你喜欢的婚礼作品风格。</p></div><div class="plans">${TIERS.map(t=>`<div class="plan" onclick="go('plan','${t.id}')"><div class="plan-meta">${t.tag}</div><h2>${t.name}</h2><div class="plan-price">${t.numeric?'¥':''}${t.price}</div><div class="plan-meta">${t.status}</div></div>`).join('')}</div>`}
function plan(id){let t=tier(id);return `<div class="page-head"><h1>${t.name}</h1><p class="plan-price">${t.numeric?'¥':''}${t.price}</p><p>${t.status}</p></div>${t.ready?`<div class="switch"><button class="${mode==='short'?'active':''}" onclick="mode='short';render(false)">精简介绍</button><button class="${mode==='detailed'?'active':''}" onclick="mode='detailed';render(false)">完整服务明细</button></div>${(mode==='short'?D.shortGroups:D.detailedGroups).map(g=>`<div class="group"><h2>${g.title}</h2><ul>${g.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}<div class="note">两份文档属于同一个 ¥19,800 套餐，仅表达详略不同；具体执行方案以双方确认的内容为准。</div>`:`<div class="empty">该档位具体服务内容尚未确定，欢迎咨询。</div>`}<div class="detail-actions"><button onclick="go('gallery')">查看作品</button><button onclick="go('inquiry','${t.id}')">咨询套餐 ›</button></div>`}
function mine(){const a=STYLES.filter(s=>favorites.includes(s.id));return `<div class="page-head"><h1>我的</h1><p>收藏的婚礼作品</p></div>${a.length?`<div class="gallery-page"><div class="grid">${a.map(s=>`<div class="tile" onclick="go('product','${s.id}')"><img class="tile-image" src="${img(s.cover)}"><p class="tile-caption">${s.name}</p></div>`).join('')}</div></div>`:`<div class="empty">还没有收藏的作品<br><button onclick="go('gallery')">去看看作品　›</button></div>`}`}
function inquiry(id){let s=STYLES.find(x=>x.id===id);return `<div class="page-head"><h1>婚礼咨询</h1><p>留下联系方式，方便沟通你的婚礼需求。</p></div><form class="form" onsubmit="submitInquiry(event)"><label>称呼<input name="name" required placeholder="怎么称呼您"></label><label>联系方式<input name="phone" required placeholder="联系电话" type="tel"></label><label>婚礼日期<input name="date" type="date"></label><label>婚礼地点<input name="city" placeholder="城市 / 酒店"></label><label>喜欢的作品<select name="style"><option value="">暂未确定</option>${STYLES.map(x=>`<option ${s?.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><label>其他需求<textarea name="remark" placeholder="选填"></textarea></label><button class="submit" type="submit">复制咨询信息</button><p class="form-hint">当前为交互预览，未配置商家信息接收。</p></form>`}
function submitInquiry(e){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);const text='【婚礼咨询】\n'+Object.entries(v).map(([k,x])=>k+'：'+x).join('\n');navigator.clipboard?.writeText(text).then(()=>showToast('已复制咨询内容，未自动发送')).catch(()=>showToast('请长按复制表单内容'))}
function showToast(msg){let old=$('.toast');if(old)old.remove();let div=document.createElement('div');div.className='toast';div.innerText=msg;document.body.appendChild(div);setTimeout(()=>div.remove(),2400)}
function phone(){showToast('手机号尚未配置')}function wechat(){showToast('微信号尚未配置')}function locationInfo(){showToast('承接不同地点的婚礼，具体场地请咨询')}
function share(){const url=location.href;const title='婚礼精选｜婚礼作品';if(navigator.share)navigator.share({title,url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>showToast('已复制页面链接')).catch(()=>showToast('可复制当前页面地址分享'))}
function render(top){const [page,id,idx]=route();if(top)window.scrollTo({top:0,behavior:'instant'});setNav(page);$('#app').innerHTML=({home:()=>home(),gallery:()=>gallery(),product:()=>product(id,idx),inquiry:()=>inquiry(id),mine:()=>mine()}[page]||(()=>home()))();}
window.addEventListener('hashchange',()=>render(true));render(true);
</script></body></html>
