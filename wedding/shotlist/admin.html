<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src https://arnrlepjuqdmvbipswci.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><title>恩万 · 动作卡管理后台</title><link rel="stylesheet" href="admin.css?v=6.9"><script defer src="data.js?v=6.7"></script><script defer src="admin.js?v=6.9"></script></head><body><header><div><small>ENWAN / GITHUB EDITOR</small><h1>婚礼手册管理后台</h1><p>照片管理 · 直接操作 · 自动保存</p></div><a href="./">返回公开手册</a></header><main><div class="quick-status"><p id="status" role="status" aria-live="polite">正在加载正式网站照片…</p><button id="connect-retry" type="button" hidden>重试连接</button><button id="quick-undo" type="button" hidden>撤销最近删除</button></div><details id="auth" class="panel auth"><summary>备用登录方式</summary><p>使用专用管理链接即可直接操作照片，无需填写表单。</p><label for="admin-email">管理员邮箱</label><input id="admin-email" type="email" autocomplete="username" placeholder="管理员邮箱"><label for="admin-password">密码</label><input id="admin-password" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="login" class="primary" type="button">登录并开始编辑</button><p><button id="email-link" type="button">发送邮箱登录链接</button></p></details><div class="panel bar sticky" id="writebar" hidden><div><strong id="counts"></strong><p id="dirty"></p></div><div class="row"><button id="reload">重新读取</button><button id="logout">退出登录</button><button id="publish" class="primary" disabled hidden>重试保存</button><a id="actions" href="https://github.com/raynacocobobobo-arch/DND/actions" target="_blank" rel="noopener noreferrer" hidden>部署状态</a></div></div><nav class="library-tabs" aria-label="照片管理"><button id="tab-live" class="active" type="button" aria-pressed="true">照片库</button><button id="tab-trash" type="button" aria-pressed="false">回收站</button></nav><section id="visual" class="panel visual"><div class="visual-head"><div><h2>照片管理</h2><p id="visual-summary">正在加载…</p><p class="quick-help">勾选照片右上角方框，底部可批量删除或移动。添加照片后立即预览。</p></div><button id="visual-new" class="primary">＋ 新建动作卡</button></div><div class="row filters"><select id="visual-cat" aria-label="一级分类"><option value="">全部分类</option></select><input id="visual-search" type="search" placeholder="搜索动作卡、照片编号" aria-label="搜索"><label class="check"><input id="visual-filled" type="checkbox">只看有图卡片</label></div><div class="select-line"><button id="select-live" type="button">全选当前筛选结果</button></div><div id="visual-cards"></div></section><details id="task-admin" class="panel secondary-panel"><summary>高级设置 · 拍摄清单管理</summary><div class="visual-head"><div><h2>拍摄清单管理</h2><p>独立管理拍摄清单。原版61组按原始编号归组；新增任务进入补充模块。</p></div><button id="task-new" type="button">＋ 新建补充任务</button></div><div class="row filters"><input id="task-search" type="search" placeholder="搜索拍摄点或 ID"><select id="task-select" aria-label="选择拍摄任务"></select></div><div id="task-form" class="task-editor"><label>名称<input id="ttitle"></label><div class="row"><label>阶段<select id="tphase"></select></label><label>类型<select id="tpriority"><option>必拍</option><option>选拍</option></select></label><label>分工<select id="tside"><option value="all">全部</option><option value="bride">女方</option><option value="groom">男方</option></select></label></div><label>详细拍摄点所属主任务<select id="tparent"></select></label><div class="row"><button id="task-save" class="primary" type="button">保存任务修改</button><button id="task-up" type="button">上移</button><button id="task-down" type="button">下移</button><button id="task-delete" class="danger" type="button">删除任务</button></div><small id="task-info"></small></div></details><section id="editor" hidden><section id="trash-panel" class="panel archive" hidden><h2>回收站</h2><p>勾选照片后可批量恢复、移动至新动作卡或彻底删除。彻底删除后无法从后台恢复。</p><div class="row"><input id="search" type="search" placeholder="编号、描述、理由或卡片"><select id="filter"><option value="removed">回收站（可恢复原图）</option><option value="approved">已采用</option><option value="all">所有审查记录</option><option value="excluded">已排除</option><option value="pending">待发布</option></select><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><div class="select-line"><button id="select-trash-page" type="button">全选本页</button><button id="select-trash-all" type="button">全选筛选结果</button></div><div id="images" class="gallery"></div></section><section class="panel" hidden><h2>新增参考图</h2><label>原图文件<input id="upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label>唯一动作卡<select id="upload-card"></select></label><label>实际画面描述<textarea id="description"></textarea></label><label>采用理由<textarea id="reason"></textarea></label><button id="add-image">校验原图并暂存</button></section><dialog id="card-dialog"><section class="panel card-editor"><div class="row visual-head"><h2>动作卡编辑</h2><button id="close-card">关闭</button></div><div class="row" hidden><select id="card-select"></select><button id="new-card">新增动作卡</button></div><div id="card-form"><p id="card-id"></p><p id="card-images"></p><label>名称<input id="ctitle"></label><label>一级分类<select id="ccat"></select></label><label>动作级别<select id="clevel"></select></label><label>适用时机<textarea id="cwhen"></textarea></label><label>现场口令<textarea id="cprompt"></textarea></label><label>摄影机位<textarea id="ccamera"></textarea></label><label>交付检查<textarea id="ccheck"></textarea></label><div class="row"><button id="save-card" class="primary">保存卡片</button><button id="delete-card" class="danger">删除卡片</button></div></div></section></dialog></section><aside id="bulk-bar" class="bulk-bar" hidden aria-label="批量照片操作"><div class="bulk-summary"><strong id="bulk-count">已选 0 张</strong><button id="bulk-clear" type="button">取消选择</button></div><div class="bulk-controls"><select id="bulk-target" aria-label="目标动作卡"></select><button id="bulk-move" class="primary" type="button">移动到此</button><button id="bulk-restore" class="primary" type="button" hidden>恢复</button><button id="bulk-purge" class="danger" type="button" hidden>彻底删除</button><button id="bulk-delete" class="danger" type="button">批量删除</button></div></aside></main></body></html>
