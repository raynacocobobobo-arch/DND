<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><title>恩万 · 动作卡管理后台</title><link rel="stylesheet" href="admin.css"><script defer src="admin.js"></script></head><body><header><div><small>ENWAN / GITHUB EDITOR</small><h1>婚礼手册管理后台</h1><p>直接管理正式网站 · 唯一数据源 GitHub</p></div><a href="./">返回公开手册</a></header><main><p id="status" role="status" aria-live="polite">请使用 GitHub 授权进入编辑。</p><section id="auth" class="panel"><h2>GitHub 写入授权</h2><p>创建仅授权 DND 仓库、Contents: Read and write 的短期 Fine-grained token。令牌仅保存在本页内存，不写入仓库、浏览器存储或日志；关闭页面即失效于本页。不要发给任何人。</p><p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">前往 GitHub 创建令牌</a></p><label for="token">GitHub Token</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"><button id="login">连接正式仓库</button></section><section id="editor" hidden><div class="panel bar"><div><strong id="counts"></strong><p id="dirty"></p></div><div class="row"><button id="reload">重新读取</button><button id="logout">退出授权</button><button id="publish" class="primary" disabled>提交并发布</button><a id="actions" href="https://github.com/raynacocobobobo-arch/DND/actions" target="_blank" rel="noopener noreferrer" hidden>部署状态</a></div></div><section class="panel"><h2>参考图管理</h2><p>从网站移除不会破坏原始审查记录；已保存文件可恢复。通过筛选或编号搜索定位原图。</p><div class="row"><input id="search" type="search" placeholder="编号、描述、理由或卡片"><select id="filter"><option value="approved">已采用</option><option value="all">所有审查记录</option><option value="excluded">已排除</option><option value="pending">待发布</option></select><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><div id="images" class="gallery"></div></section><section class="panel"><h2>新增参考图</h2><label>原图文件<input id="upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label>唯一动作卡<select id="upload-card"></select></label><label>实际画面描述<textarea id="description"></textarea></label><label>采用理由<textarea id="reason"></textarea></label><button id="add-image">校验原图并暂存</button></section><section class="panel"><h2>动作卡管理</h2><div class="row"><select id="card-select"></select><button id="new-card">新增动作卡</button></div><div id="card-form"><p id="card-id"></p><p id="card-images"></p><label>名称<input id="ctitle"></label><label>一级分类<select id="ccat"></select></label><label>动作级别<select id="clevel"></select></label><label>适用时机<textarea id="cwhen"></textarea></label><label>现场口令<textarea id="cprompt"></textarea></label><label>摄影机位<textarea id="ccamera"></textarea></label><label>交付检查<textarea id="ccheck"></textarea></label><div class="row"><button id="save-card">暂存卡片修改</button><button id="delete-card">删除卡片</button></div></div></section></section></main></body></html>
