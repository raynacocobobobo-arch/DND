name: Lighthouse V25 detailed permanent fishman QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v25-*.js'
      - 'lighthouse/v25-preview.html'
      - '.github/workflows/lighthouse-v25-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v25
          npm --prefix /tmp/lighthouse-v25 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v25/node_modules/.bin/playwright install chromium
      - name: Validate full size model scaled down, closeups, and both modes
        env:
          NODE_PATH: /tmp/lighthouse-v25/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/v25-server.log 2>&1 &
          mkdir -p lighthouse/v25-qa-output
          cat >/tmp/lighthouse-v25/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v25-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const api=()=>page.evaluate(()=>window.__lighthouseNightEvents.getVisitor());
           const night=await api();
           await page.screenshot({path:'lighthouse/v25-qa-output/fishman-night-scene.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.focusVisitorForTest());
           await page.waitForTimeout(450);
           await page.screenshot({path:'lighthouse/v25-qa-output/fishman-night-close.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.resetCameraForTest());
           await page.locator('#mode-day').click();
           await page.waitForTimeout(3200);
           const day=await api();
           await page.screenshot({path:'lighthouse/v25-qa-output/fishman-day-scene.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.focusVisitorForTest());
           await page.waitForTimeout(450);
           await page.screenshot({path:'lighthouse/v25-qa-output/fishman-day-close.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.resetCameraForTest());
           await page.locator('#mode-night').click();
           await page.waitForTimeout(3200);
           const afterNight=await api();
           const data=await page.evaluate(()=>({
            version:document.body.dataset.version,geometry:document.body.dataset.geometryAudit,
            vectorSea:document.body.dataset.vectorSea,sideWalls:document.body.dataset.waterSidewallCount,
            topview:!!document.querySelector('#topview'),
            type:document.body.dataset.visitorType,
            gulls:window.__lighthouseNightEvents.getGulls(),
            events:window.__lighthouseNightEvents.getState()
           }));
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const launched=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
           const ship=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const combo=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1));
           await page.screenshot({path:'lighthouse/v25-qa-output/fishman-night-events.png'});
           const good=data.version==='v25a'&&data.geometry==='pass'&&
            data.type==='permanent-fishman'&&data.vectorSea==='true'&&data.sideWalls==='4'&&!data.topview&&
            [night,day,afterNight].every(s=>s.form==='fishman'&&s.permanent&&!s.morphing&&
             s.belowDoor&&s.fishEyes===2&&s.tailVisible&&s.outfit.scarf&&
             s.sourceModelHeight>3&&s.scaleFactor<.25&&s.meshCount>80&&s.vertices>2300)&&
            night.height>.63&&night.height<.72&&
            day.position.x===night.position.x&&day.position.z===night.position.z&&
            night.doorDistance>1&&night.doorDistance<2.1&&
            night.fireDistance>1.5&&night.fireDistance<2.3&&
            data.gulls.gullScaleFactor===.7&&data.events.positions.length===8&&
            launched&&arms.activeCount===5&&ship&&combo.concurrent&&errors.length===0;
           console.log('V25_QA_RESULT',JSON.stringify({night,day,afterNight,good,errors}));
           await browser.close();
           if(!good)throw Error('V25 detailed fishman QA failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v25/test.cjs
      - name: Upload actual scene captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v25-fishman-qa
          path: lighthouse/v25-qa-output/
          if-no-files-found: warn
