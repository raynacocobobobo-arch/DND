name: Lighthouse V13 layout and simultaneous night events QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v13-*.js'
      - 'lighthouse/v13-preview.html'
      - '.github/workflows/lighthouse-v13-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          mkdir -p /tmp/lighthouse-v13
          npm --prefix /tmp/lighthouse-v13 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v13/node_modules/.bin/playwright install chromium
      - name: Check geometry and actual WebGL animation
        env:
          NODE_PATH: /tmp/lighthouse-v13/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/v13-server.log 2>&1 &
          mkdir -p lighthouse/v13-qa-output
          cat >/tmp/lighthouse-v13/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
            await page.goto('http://127.0.0.1:8765/lighthouse/v13-preview.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:45000});
            const base=await page.evaluate(()=>({
              version:document.body.dataset.version,
              meshCount:Number(document.body.dataset.meshCount||0),
              waterFactor:Number(document.body.dataset.waterAreaFactor||0),
              waterCenter:document.body.dataset.waterCenter,
              geometryAudit:document.body.dataset.geometryAudit,
              tyreCount:Number(document.body.dataset.tyreCount||0),
              event:window.__lighthouseNightEvents?.getState()
            }));
            await page.screenshot({path:'lighthouse/v13-qa-output/night-base.png'});
            await page.locator('#mode-day').click();
            const day=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
            await page.screenshot({path:'lighthouse/v13-qa-output/day-base.png'});
            await page.locator('#topview').click();await page.waitForTimeout(500);
            await page.screenshot({path:'lighthouse/v13-qa-output/top-no-offshore-rocks.png'});
            await page.locator('#reset').click();
            await page.locator('#mode-night').click();
            const started=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',3,[0,1,2]));
            const arms=await page.evaluate(()=>{window.__lighthouseNightEvents.pauseForTest(true);return window.__lighthouseNightEvents.advanceForTest(2.5);});
            await page.screenshot({path:'lighthouse/v13-qa-output/three-tentacle-shapes.png'});
            const shipStarted=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
            const concurrent=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1.2));
            await page.screenshot({path:'lighthouse/v13-qa-output/ship-with-tentacles.png'});
            const variantFour=await page.evaluate(()=>{
              window.__lighthouseNightEvents.forceEvent('tentacles',1,[3]);
              return window.__lighthouseNightEvents.advanceForTest(2.5);
            });
            await page.screenshot({path:'lighthouse/v13-qa-output/fourth-tentacle-shape.png'});
            await page.locator('#mode-day').click();
            const clear=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
            const result={base,day,started,arms,shipStarted,concurrent,variantFour,clear,errors};
            console.log('V13_QA_RESULT',JSON.stringify(result));
            await browser.close();
            const selected=(s)=>s.arms.filter(a=>s.selected.includes(a.index));
            const shapes=selected(arms).map(a=>a.variant).sort((a,b)=>a-b);
            const s4=selected(variantFour)[0];
            if(base.version!=='v13a'||base.meshCount<250||
               Math.abs(base.waterFactor-2.8)>.00015||base.waterCenter!=='-0.2,0.25'||
               base.geometryAudit!=='pass'||base.tyreCount!==6||
               base.event.positions.length!==5||base.event.variants.length!==4||
               !base.event.corridorClear||Math.min(...base.event.siteClearances)<1||
               day.night!==false||day.ship.visible||
               !started||arms.activeCount!==3||shapes.join(',')!=='0,1,2'||
               selected(arms).some(a=>a.growth<.95||!a.visible||a.suckers!==24)||
               !shipStarted||concurrent.ship.active!==true||concurrent.ship.sailAxis!=='transverse-Z'||
               concurrent.activeCount!==3||!concurrent.concurrent||concurrent.ship.sails!==4||
               s4?.variant!==3||s4.growth<.95||
               clear.night!==false||clear.ship.visible||clear.activeCount!==0||errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v13/test.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v13-qa-screenshots
          path: lighthouse/v13-qa-output/
          if-no-files-found: warn
