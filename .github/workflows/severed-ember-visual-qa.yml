name: Severed Ember browser and mobile QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'severed-ember/**'
      - '.github/workflows/severed-ember-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          npm --prefix /tmp/ember-qa install --no-audit --no-fund playwright@1.56.1
          /tmp/ember-qa/node_modules/.bin/playwright install chromium
      - name: Verify all nine views, 10 chapters, image loads and viewport overflow
        env:
          NODE_PATH: /tmp/ember-qa/node_modules
        run: |
          python3 -m http.server 8765 --directory severed-ember >/tmp/ember-server.log 2>&1 &
          node severed-ember/qa/browser-qa.cjs
      - name: Save browser QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: severed-ember-browser-qa
          path: severed-ember/qa/output/
          retention-days: 7
