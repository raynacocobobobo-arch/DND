name: Publish Approved Wands Ace Artwork
on:
  push:
    branches: [main]
    paths: [".github/workflows/wands-ace-art-transfer-once.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wands-approved-art
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout live site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - name: Install image tools
        run: python -m pip install --quiet Pillow
      - name: Fetch and validate the approved original image
        env:
          SOURCE_URL: "https://docs.google.com/docs-images-rt/ALKuztZ7XTnkmMrmufpZb8SzlcbYEkA2bUjWrFELIV-OjEnrsRyo3I7XBgXQfq56ZtRR6rt6FhOv0AoWZjt6ytqIffURdFlqw7eriaxlJlQUlDP2T9cK9i8oBNmfQ1fbTYlgg8WsL9t-WWJ44rUcL-BIFGnFoHTz4R7an1C8xLwWHjxPNy4y=s2048?key=6pnZDRoeswUbyq05QaQfaA"
        run: |
          curl -fLsS --retry 3 --max-time 90 "$SOURCE_URL" -o /tmp/wands-ace-source
          python - <<'PY'
          import os,hashlib
          from PIL import Image
          source='/tmp/wands-ace-source'
          with Image.open(source) as img:
              img.load()
              original=img.convert('RGB')
          assert original.size==(941,1672),original.size
          path='minor-arcana/wands/final/ace-of-wands-v1.webp'
          thumbpath='minor-arcana/wands/thumbs/ace-of-wands.webp'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          os.makedirs(os.path.dirname(thumbpath),exist_ok=True)
          original.save(path,'WEBP',lossless=True,method=6)
          with Image.open(path) as check:
              check.load()
              assert check.size==original.size and check.format=='WEBP'
              assert check.convert('RGB').tobytes()==original.tobytes(),'pixel mismatch'
          thumb=original.copy()
          thumb.thumbnail((360,640),Image.Resampling.LANCZOS)
          thumb.save(thumbpath,'WEBP',quality=91,method=6)
          print('WANDS_ACE_ART_PIXEL_IDENTITY_VERIFIED',original.size,os.path.getsize(path),hashlib.sha256(open(path,'rb').read()).hexdigest(),flush=True)
          PY
      - name: Publish on gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minor-arcana/wands
          git diff --cached --stat
          if git diff --cached --quiet; then echo "Image already published"; exit 0; fi
          git commit -m "art(wands): publish user-approved Ace of Wands original image"
          git push origin HEAD:gh-pages
