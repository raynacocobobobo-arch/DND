name: Lighthouse V4 editor and isolated game QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse-editor/**'
      - 'lighthouse/shared-map.js'
      - 'lighthouse/v35-scene.js'
      - 'lighthouse/index.html'
      - '.github/workflows/lighthouse-editor-game-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lhv4
          npm --prefix /tmp/lhv4 install --no-audit --no-fund playwright@1.56.1
          /tmp/lhv4/node_modules/.bin/playwright install chromium
      - name: Verify scene hierarchy, locked objects, persistence and game isolation
        env:
          NODE_PATH: /tmp/lhv4/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lhv4-server.log 2>&1 &
          mkdir -p lighthouse-editor/qa-v4
          cat >/tmp/lhv4/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              '--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const failures=[];
            const watch=p=>{
              p.on('pageerror',e=>failures.push('JS '+e.message));
              p.on('console',m=>{if(m.type()==='error')failures.push('CONSOLE '+m.text());});
              p.on('requestfailed',r=>failures.push('REQUEST '+r.url()));
            };
            const editor=await context.newPage();watch(editor);
            await editor.goto('http://127.0.0.1:8765/lighthouse-editor/',{waitUntil:'domcontentloaded'});
            await editor.waitForFunction(()=>document.body.dataset.editorReady==='true',{timeout:60000});
            const initial=await editor.evaluate(()=>{
              const e=window.__lighthouseEditor;
              return {state:e.getState(),sceneRows:document.querySelectorAll('.scene-row').length};
            });
            const edited=await editor.evaluate(()=>{
              const api=window.__lighthouseEditor;
              api.placeAt('pine',8,9);
              const map=api.exportMap(),id=map.objects.at(-1).id;
              api.selectObject(id);
              api.setObjectFlags(id,{hidden:true,locked:true});
              api.setObjectFlags('native:lighthouse',{hidden:true,locked:true});
              api.setTransformMode('translate');
              const saved=api.exportMap(),state=api.getState();
              return {id,saved,state,
                rows:document.querySelectorAll('.scene-row').length,
                hasHierarchy:!!document.querySelector('#scene-list'),
                hasTransform:!!document.querySelector('#gizmo-move')};
            });
            await editor.screenshot({path:'lighthouse-editor/qa-v4/editor-objects.png'});
            const reload=await context.newPage();watch(reload);
            await reload.goto('http://127.0.0.1:8765/lighthouse-editor/',{waitUntil:'domcontentloaded'});
            await reload.waitForFunction(()=>document.body.dataset.editorReady==='true',{timeout:60000});
            const persisted=await reload.evaluate(()=>window.__lighthouseEditor.exportMap());
            const game=await context.newPage();watch(game);
            await game.goto('http://127.0.0.1:8765/lighthouse/?map=editor',{waitUntil:'domcontentloaded'});
            await game.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
            const fixed=await game.evaluate(()=>({
              source:document.body.dataset.worldMapSource,
              mapObjects:document.body.dataset.mapObjects,
              linked:document.body.dataset.mapLinked,
              gameMap:window.__lighthouseNightEvents.getWorldMap().objects.length,
              editorLink:!!document.querySelector('a[href*="lighthouse-editor"]')
            }));
            const item=edited.saved.objects.find(o=>o.id===edited.id);
            const kept=persisted.objects.find(o=>o.id===edited.id);
            const ok=initial.state.realGameAssets&&
              initial.sceneRows>10&&initial.state.prefabTypes.length>=80&&
              edited.hasHierarchy&&edited.hasTransform&&edited.rows>initial.sceneRows&&
              edited.state.selected===edited.id&&
              item.hidden&&item.locked&&kept.hidden&&kept.locked&&
              edited.saved.baseEdits.lighthouse.hidden&&edited.saved.baseEdits.lighthouse.locked&&
              persisted.baseEdits.lighthouse.hidden&&persisted.baseEdits.lighthouse.locked&&
              fixed.source==='original-fixed'&&fixed.gameMap===0&&
              +fixed.mapObjects===0&&!fixed.editorLink&&failures.length===0;
            console.log('V4_QA',JSON.stringify({ok,initial:initial.state,
              selected:edited.state.selected,flags:item,persisted:kept,fixed,failures}));
            await browser.close();
            if(!ok)throw Error('V4 editor/game isolation smoke test failed');
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node /tmp/lhv4/test.cjs
      - name: Upload V4 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v4-editor-qa
          path: lighthouse-editor/qa-v4/
          if-no-files-found: warn
