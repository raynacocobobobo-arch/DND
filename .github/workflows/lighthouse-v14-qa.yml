name: Lighthouse V14 8-site Kraken, retreat and dense fog QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v14-*.js'
      - 'lighthouse/v14-preview.html'
      - '.github/workflows/lighthouse-v14-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v14
          npm --prefix /tmp/lighthouse-v14 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v14/node_modules/.bin/playwright install chromium
      - name: Check actual WebGL, 8 spawn points, 5 Kraken arms, and graceful day exit
        env:
          NODE_PATH: /tmp/lighthouse-v14/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/v14-server.log 2>&1 &
          mkdir -p lighthouse/v14-qa-output
          cat >/tmp/lighthouse-v14/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
            await page.goto('http://127.0.0.1:8765/lighthouse/v14-preview.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:45000});
            const base=await page.evaluate(()=>({
              version:document.body.dataset.version,
              meshCount:Number(document.body.dataset.meshCount||0),
              waterFactor:Number(document.body.dataset.waterAreaFactor||0),
              waterCenter:document.body.dataset.waterCenter,
              fogMeshCount:Number(document.body.dataset.fogMeshCount||0),
              geometryAudit:document.body.dataset.geometryAudit,
              tyreCount:Number(document.body.dataset.tyreCount||0),
              fog:window.__lighthouseNightEvents.getFog(),
              event:window.__lighthouseNightEvents.getState()
            }));
            await page.screenshot({path:'lighthouse/v14-qa-output/night-fog.png'});
            await page.locator('#topview').click();
            await page.screenshot({path:'lighthouse/v14-qa-output/overhead-fog-and-water.png'});
            await page.locator('#reset').click();
            await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
            const launched=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
            const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
            await page.screenshot({path:'lighthouse/v14-qa-output/five-tentacles.png'});
            const shipLaunch=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
            const combined=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1.2));
            await page.screenshot({path:'lighthouse/v14-qa-output/pirate-and-five-tentacles.png'});
            await page.locator('#mode-day').click();
            const dayInstant=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
            const dayLightStart=await page.evaluate(()=>window.__lighthouseNightEvents.getLight());
            const dayOne=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1.0));
            await page.screenshot({path:'lighthouse/v14-qa-output/retreating-at-dawn.png'});
            const dayDone=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(5.0));
            const shipStill=dayDone.ship.active;
            const shipExit=await page.evaluate(()=>{
              window.__lighthouseNightEvents.advanceForTest(26);
              return window.__lighthouseNightEvents.getState();
            });
            await page.screenshot({path:'lighthouse/v14-qa-output/day-after-exit.png'});
            const result={base,launched,arms,shipLaunch,combined,dayInstant,dayLightStart,dayOne,dayDone,shipStill,shipExit,errors};
            console.log('V14_QA_RESULT',JSON.stringify(result));
            await browser.close();
            const visible=(s)=>s.arms.filter(a=>s.selected.includes(a.index));
            const variants=visible(arms).map(a=>a.variant);
            if(base.version!=='v14a'||base.meshCount<350||Math.abs(base.waterFactor-5.6)>.0002||
               base.waterCenter!=='-0.2,0.25'||base.geometryAudit!=='pass'||base.tyreCount!==6||
               base.fogMeshCount!==7||base.fog.veilCount!==7||base.fog.curtainCount!==0||
               base.event.positions.length!==8||!base.event.corridorClear||
               base.event.siteClearances.some(x=>x<1.0)||
               !launched||arms.activeCount!==5||variants.sort((a,b)=>a-b).join(',')!=='0,0,1,2,3'||
               visible(arms).some(a=>a.growth<.95||a.suckers!==24)||!shipLaunch||
               !combined.concurrent||!combined.ship.active||combined.activeCount!==5||
               dayInstant.night!==false||dayInstant.activeCount!==5||
               !dayInstant.ship.active||dayInstant.phase!=='retracting'||
               dayOne.activeCount!==5||!dayOne.ship.active||
               dayOne.arms.filter(a=>dayOne.selected.includes(a.index)).some(a=>a.growth>=.99)||
               dayDone.activeCount!==0||dayDone.phase!=='day'||
               !shipStill||shipExit.ship.active||shipExit.ship.visible||errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v14/test.cjs
      - name: Upload proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v14-qa-screenshots
          path: lighthouse/v14-qa-output/
          if-no-files-found: warn
