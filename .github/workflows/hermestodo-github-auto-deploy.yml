name: HermesTodo GitHub auto deploy to Tencent Cloud

on:
  push:
    branches:
      - feature/hermestodo-dashboard-subtasks-20261025
    paths:
      - "HermesTodo/**"
      - ".github/workflows/hermestodo-github-auto-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermestodo-tencent-runner-production
  cancel-in-progress: true

jobs:
  verify:
    name: Test full-stack production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'feature/hermestodo-dashboard-subtasks-20261025' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: HermesTodo/package-lock.json
      - name: Install
        working-directory: HermesTodo
        run: npm ci
      - name: Test
        working-directory: HermesTodo
        run: npm test
      - name: Typecheck
        working-directory: HermesTodo
        run: npm run typecheck
      - name: Build production React and Express
        working-directory: HermesTodo
        env:
          VITE_STATIC_PREVIEW: "false"
          HERMESTODO_PREVIEW: "false"
        run: |
          npm run build
          test -s dist/server/index.js
          test -s dist/client/index.html
          if grep -R -l 'hermestodo-public-preview-v1' dist/client/assets; then
            echo "::error::Refusing to deploy a browser-local preview as production."
            exit 1
          fi

  deploy:
    name: Deploy on Tencent Cloud runner (no inbound SSH)
    needs: verify
    if: github.repository == 'raynacocobobobo-arch/DND'
    runs-on: [self-hosted, linux, x64, hermestodo-prod]
    timeout-minutes: 45
    steps:
      - name: Checkout verified application revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'feature/hermestodo-dashboard-subtasks-20261025' }}
          persist-credentials: false
      - name: Run guarded on-server update
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "Deploying approved HermesTodo revision: $revision"
          HERMESTODO_COMMIT="$revision" bash HermesTodo/deploy/update-from-github.sh
      - name: Verify actual production API
        shell: bash
        run: |
          curl --insecure --fail --silent --show-error --max-time 15 \
            https://82.156.85.52:8443/api/health | grep -q '"status":"ok"'
          echo "Real HermesTodo API is healthy."
