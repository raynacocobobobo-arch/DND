name: Lighthouse V23 flat sea no z-fighting sidewalls QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v23-*.js'
      - 'lighthouse/v23-preview.html'
      - '.github/workflows/lighthouse-v23-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v23
          npm --prefix /tmp/lighthouse-v23 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v23/node_modules/.bin/playwright install chromium
      - name: Verify full opacity at oblique and overhead angles, 10-second drift and original night events
        env:
          NODE_PATH: /tmp/lighthouse-v23/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/v23-server.log 2>&1 &
          mkdir -p lighthouse/v23-qa-output
          cat >/tmp/lighthouse-v23/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v23-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const data=await page.evaluate(()=>({
             version:document.body.dataset.version,
             geometry:document.body.dataset.geometryAudit,
             waterFactor:+document.body.dataset.waterAreaFactor,
             clouds:window.__lighthouseNightEvents.getClouds(),
             gulls:window.__lighthouseNightEvents.getGulls(),
             events:window.__lighthouseNightEvents.getState(),
             opaqueFlag:document.body.dataset.cloudOpaque,
             fogCount:+document.body.dataset.fogMeshCount
           }));
           await page.screenshot({path:'lighthouse/v23-qa-output/night-perspective.png'});
           // User removed the overhead viewpoint and its button.
           const overheadRemoved=await page.evaluate(()=>!document.getElementById('topview'));
           const waterNight=await page.evaluate(()=>{
            const sea=window.__lighthouseSea;
            return {flat:document.body.dataset.vectorSea,
              triangles:+document.body.dataset.seaTriangles,
              surfaceLevel:+document.body.dataset.seaHeight,
              color:sea?.material.color.getHexString(),
              meshType:sea?.geometry.type,
              opaque:sea?.material.transparent===false&&sea?.material.depthWrite===true,
              vertices:sea?.geometry.attributes.position.count};
           });
           await page.locator('#mode-day').click();
           await page.waitForTimeout(3100);
           await page.locator('#reset').click();
           await page.screenshot({path:'lighthouse/v23-qa-output/day-perspective.png'});
           const waterDay=await page.evaluate(()=>window.__lighthouseSea?.material.color.getHexString());
           // Verify the flash-causing top cap is gone: exactly four vertical
           // mesh side walls, no horizontal competing surface below the sea.
           const noTopCap=await page.evaluate(()=>{
             return document.body.dataset.waterTopCapRemoved==='true'&&
               document.body.dataset.waterSidewallCount==='4'&&
               window.__lighthouseSea?.userData.underwaterTopCapRemoved===true;
           });
           // Vary the view by a few pixels: the old gap of .0015 caused
           // bars to pop in and out with camera motion and depth precision.
           await page.mouse.move(700,500);
           await page.mouse.down();
           await page.mouse.move(742,520,{steps:7});
           await page.mouse.up();
           await page.waitForTimeout(450);
           await page.screenshot({path:'lighthouse/v23-qa-output/day-angle-a.png'});
           await page.mouse.move(742,520);
           await page.mouse.down();
           await page.mouse.move(670,492,{steps:7});
           await page.mouse.up();
           await page.waitForTimeout(450);
           await page.screenshot({path:'lighthouse/v23-qa-output/day-angle-b.png'});
           await page.locator('#reset').click();
           const travel=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             const start=api.getClouds();
             const q1=api.advanceCloudsForTest(5);
             const half=api.advanceCloudsForTest(5);
             const q3=api.advanceCloudsForTest(5);
             const end=api.advanceCloudsForTest(5);
             return {start,q1,half,q3,end};
           });
           await page.screenshot({path:'lighthouse/v23-qa-output/day-after-40s.png'});
           await page.locator('#mode-night').click();
           await page.waitForTimeout(3050);
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const shipStart=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             api.forceEvent('ship');
             return api.getState().ship;
           });
           const shipEntry=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(3));
           await page.screenshot({path:'lighthouse/v23-qa-output/pirate-entering-north.png'});
           const shipMiddle=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(9));
           await page.screenshot({path:'lighthouse/v23-qa-output/pirate-mid-diagonal.png'});
           const shipExit=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(8));
           await page.screenshot({path:'lighthouse/v23-qa-output/pirate-exiting-east.png'});
           const shipGoneAtEdge=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(8));
           const launched=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
           const shipLaunched=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const combo=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1.0));
           await page.screenshot({path:'lighthouse/v23-qa-output/night-kraken-ship.png'});
           await page.locator('#mode-day').click();
           const instant=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
           const retreat=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(5));
           const exit=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(26));
           const samples=[travel.start,travel.q1,travel.half,travel.q3,travel.end];
           const allOpaque=samples.every(v=>
             v.opaque&&v.activeCount===3&&v.fixedCount===3&&
             v.clouds.every(c=>!c.transparent&&c.opacity===1&&c.visible));
           // Four samples at 10-second intervals cover the entire sway cycle,
           // regardless of the animation phase when the browser test starts.
           const moved=travel.start.clouds.every((c,i)=>{
             const xs=samples.map(s=>s.clouds[i].x);
             return Math.max(...xs)-Math.min(...xs)>.42;
           });
           const returned=travel.start.clouds.every((c,i)=>
             Math.abs(c.x-travel.end.clouds[i].x)<.02);
           const route=shipStart.route;
           const edge=route.boundingSea;
           const shipClipping=shipStart.clipped&&
             route.angleDegrees===45&&route.entryEdge==='north'&&route.exitEdge==='east'&&
             Math.abs(route.entry.z-edge.north)<.001&&
             Math.abs(route.exit.x-edge.east)<.001&&
             Math.abs((route.exit.z-route.entry.z)-(route.exit.x-route.entry.x))<.001&&
             shipStart.visibleFraction<.03&&
             shipEntry.ship.visibleFraction>.03&&shipEntry.ship.visibleFraction<.98&&
             shipMiddle.ship.visibleFraction>.95&&
             shipExit.ship.visibleFraction<.98&&
             !shipGoneAtEdge.ship.active&&
             shipMiddle.ship.distanceToDockBoat>9;
           const angles=new Set(data.clouds.clouds.map(c=>c.rotationY)).size===3;
           const crossSection=await page.evaluate(()=>document.body.dataset.waterVolumeCount==='1' &&
             document.body.dataset.shipClippingEnabled==='true');
           const gullsScaled=data.gulls.gullScaleFactor===.70&&
             data.gulls.gullScales.length===3&&
             Math.abs(data.gulls.gullScales[0]-.301)<.002&&
             Math.abs(data.gulls.gullScales[1]-.266)<.002&&
             Math.abs(data.gulls.gullScales[2]-.245)<.002;
           const vectorSea=waterNight.flat==='true'&&waterNight.triangles===2&&
             waterNight.vertices===4&&waterNight.opaque&&
             waterNight.meshType==='PlaneGeometry'&&
             Math.abs(waterNight.surfaceLevel-.1815)<.0001&&
             waterNight.color!==waterDay;
           const passed=data.version==='v23a'&&data.geometry==='pass'&&vectorSea&&noTopCap&&
             overheadRemoved&&gullsScaled&&
             shipClipping&&angles&&crossSection&&
             data.gulls.residentOrbit.radiusX<6&&
             data.gulls.transitSpawnMargin[1]<1.2&&
             Math.abs(data.waterFactor-5.6)<.0002&&data.fogCount===0&&
             data.clouds.style==='permanent-open-sea'&&
             data.clouds.activeCount===3&&data.clouds.fixedCount===3&&
             data.clouds.driftSecondsEachDirection===10&&
             !data.clouds.randomSpawns&&!data.clouds.fadeTransitions&&
             data.opaqueFlag==='true'&&allOpaque&&moved&&returned&&
             data.gulls.residentCount===1&&data.gulls.transientCapacity===2&&
             data.events.positions.length===8&&data.events.corridorClear&&
             launched&&arms.activeCount===5&&shipLaunched&&combo.concurrent&&
             instant.activeCount===5&&instant.ship.active&&
             retreat.activeCount===0&&!exit.ship.active&&errors.length===0;
           console.log('V23_QA_RESULT',JSON.stringify({
             version:data.version,clouds:data.clouds,travel,
             allOpaque,moved,returned,vectorSea,noTopCap,waterNight,waterDay,passed,
             shipAndKraken:combo.concurrent,retreat:retreat.activeCount,
             shipExit:!exit.ship.active,errors}));
           await browser.close();
           if(!passed)throw Error('V23 QA failed: '+JSON.stringify({
             allOpaque,moved,returned,vectorSea,noTopCap,waterNight,waterDay,shipClipping,angles,crossSection,
             shipStart,shipEntry:shipEntry.ship,shipMiddle:shipMiddle.ship,shipExit:shipExit.ship,shipGoneAtEdge:shipGoneAtEdge.ship,overheadRemoved,gullsScaled,errors}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v23/test.cjs
      - name: Upload proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v23-qa-screenshots
          path: lighthouse/v23-qa-output/
          if-no-files-found: warn
