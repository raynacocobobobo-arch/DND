name: Lighthouse V31 day startup and safe tap to sail QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v31-*.js'
      - 'lighthouse/v31-preview.html'
      - '.github/workflows/lighthouse-v31-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v31
          npm --prefix /tmp/lighthouse-v31 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v31/node_modules/.bin/playwright install chromium
      - name: Confirm desktop click, touch tap, sailing and permanent collision reservations
        env:
          NODE_PATH: /tmp/lighthouse-v31/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v31.log 2>&1 &
          mkdir -p lighthouse/v31-qa-output
          cat >/tmp/lighthouse-v31/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
            const errors=[];
            const options={viewport:{width:1440,height:1050},deviceScaleFactor:1};
            const page=await browser.newPage(options);
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
            await page.goto('http://127.0.0.1:8765/lighthouse/v31-preview.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
            const api=()=>page.evaluate(()=>{
              const x=window.__lighthouseNightEvents;
              return {version:document.body.dataset.version,
                startup:document.body.dataset.defaultMode,mode:document.body.dataset.mode,
                boat:x.getBoat(),events:x.getState(),
                dayPressed:document.querySelector('#mode-day').getAttribute('aria-pressed'),
                nightPressed:document.querySelector('#mode-night').getAttribute('aria-pressed'),
                reef:x.getReefs()};
            });
            const initial=await api();
            await page.screenshot({path:'lighthouse/v31-qa-output/initial-day.png'});
            // Rock center, Kraken spawn, pirate corridor, island center must never be occupiable.
            const blocked=await page.evaluate(()=>{
              const x=window.__lighthouseNightEvents;
              return {
                island:!x.testBoatSafe(0,0),
                reef:!x.testBoatSafe(9,7),
                kraken:!x.testBoatSafe(-12.2,3.4),
                pirate:!x.testBoatSafe(12,-11.685),
                outside:!x.testBoatSafe(99,99),
                movingIntoReef:x.routeBoatTo(9,7)
              };
            });
            const scripted=await page.evaluate(()=>window.__lighthouseNightEvents.routeBoatTo(-4.75,8.1));
            const afterRoute=await page.evaluate(()=>window.__lighthouseNightEvents.advanceBoatForTest(5));
            await page.screenshot({path:'lighthouse/v31-qa-output/day-boat-moving.png'});
            // Real desktop mouse click on a valid ocean coordinate.
            // Ensure camera projection remains inside the viewport.
            const point=await page.evaluate(()=>{
              const p=window.__lighthouseNightEvents;
              const el=document.querySelector('canvas');
              const rect=el.getBoundingClientRect();
              for(let y=rect.top+rect.height*.22;y<rect.bottom*.80;y+=38)
                for(let x=rect.left+rect.width*.15;x<rect.right*.85;x+=38){
                  const w=p.boatWorldAtClient(x,y);
                  if(w&&p.testBoatSafe(w.x,w.z)&&Math.hypot(w.x+4.75,w.z-8.1)>2)
                    return {x,y,w};
                }
              return null;
            });
            let clickOK=false;
            if(point){
              const before=(await api()).boat.tapCount;
              await page.mouse.click(point.x,point.y);
              await page.waitForTimeout(180);
              clickOK=(await api()).boat.tapCount===before+1;
            }
            await page.locator('#mode-night').click();
            await page.waitForTimeout(3100);
            const night=await api();
            await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
            const kraken=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
            const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
            const pirate=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
            const both=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1.0));
            const during=await page.evaluate(()=>window.__lighthouseNightEvents.advanceBoatForTest(8));
            await page.screenshot({path:'lighthouse/v31-qa-output/night-ship-kraken-sailing.png'});
            const mobile=await browser.newPage({viewport:{width:390,height:844},
              deviceScaleFactor:1,isMobile:true,hasTouch:true});
            mobile.on('pageerror',e=>errors.push('MOBILE '+e.message));
            await mobile.goto('http://127.0.0.1:8765/lighthouse/v31-preview.html',{waitUntil:'domcontentloaded'});
            await mobile.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
            const mobilePoint=await mobile.evaluate(()=>{
              const api=window.__lighthouseNightEvents;
              const rect=document.querySelector('canvas').getBoundingClientRect();
              for(let y=rect.top+rect.height*.16;y<rect.bottom*.77;y+=28)
               for(let x=rect.left+rect.width*.13;x<rect.right*.87;x+=25){
                const w=api.boatWorldAtClient(x,y);
                if(w&&api.testBoatSafe(w.x,w.z)&&Math.hypot(w.x+2.55,w.z-5.1)>1.5)return {x,y,w};
               }
              return null;
            });
            let touchOK=false;
            if(mobilePoint){
              await mobile.touchscreen.tap(mobilePoint.x,mobilePoint.y);
              await mobile.waitForTimeout(220);
              const state=await mobile.evaluate(()=>window.__lighthouseNightEvents.getBoat());
              touchOK=state.tapCount>=1&&state.accepted>=1&&state.safe;
            }
            await mobile.screenshot({path:'lighthouse/v31-qa-output/mobile-tap.png'});
            const ok=initial.version==='v31a'&&initial.startup==='day'&&
              initial.mode==='day'&&initial.dayPressed==='true'&&initial.nightPressed==='false'&&
              initial.boat.safe&&initial.boat.shoreStoneCount>=20&&
              initial.boat.reefCount===3&&initial.boat.krakenReserveCount===8&&
              initial.boat.pirateLaneReserved&&
              Object.keys(blocked).filter(k=>k!=='movingIntoReef').every(k=>blocked[k])&&
              blocked.movingIntoReef===false&&scripted&&afterRoute.travelled>1&&afterRoute.safe&&
              clickOK&&night.mode==='night'&&kraken&&arms.activeCount===5&&pirate&&
              both.concurrent&&during.safe&&touchOK&&errors.length===0;
            console.log('V31_QA_RESULT',JSON.stringify({ok,initial:{mode:initial.mode,boat:initial.boat},
              blocked,scripted,afterRoute,clickOK,point,nightMode:night.mode,kraken,
              pirate,concurrent:both.concurrent,during,touchOK,mobilePoint,errors}));
            await browser.close();
            if(!ok)throw Error('V31 daylight and navigation acceptance tests failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v31/test.cjs
      - name: Upload screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v31-navigation-qa
          path: lighthouse/v31-qa-output/
          if-no-files-found: warn
