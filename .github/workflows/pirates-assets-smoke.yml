name: Pirate asset visibility smoke test
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse-editor/assets/pirates/**'
      - 'lighthouse-editor/pirates-prefabs.js'
      - 'lighthouse-editor/editor.js'
      - '.github/workflows/pirates-assets-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pirate catalog in real browser
        run: |
          mkdir -p /tmp/pirates-check
          npm --prefix /tmp/pirates-check install --no-fund --no-audit playwright@1.56.1
          /tmp/pirates-check/node_modules/.bin/playwright install chromium >/dev/null
          python3 -m http.server 8765 >/tmp/pirates-check-http.log 2>&1 &
          cat >/tmp/pirates-check/check.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:950}});
            const errors=[];
            page.on('pageerror',e=>errors.push('JS '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()));
            await page.goto('http://127.0.0.1:8765/lighthouse-editor/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__LIGHTHOUSE_PIRATES_STATUS__!==undefined,{timeout:60000});
            const status=await page.evaluate(()=>window.__LIGHTHOUSE_PIRATES_STATUS__);
            console.log('PIRATES_STATUS',JSON.stringify(status));
            console.log('PIRATES_PAGE_ERRORS',JSON.stringify(errors.slice(0,50)));
            await browser.close();
            if(status.total!==51||status.loaded!==51||status.errors?.length||errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/pirates-check/check.cjs
