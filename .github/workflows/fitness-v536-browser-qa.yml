name: Fitness V5.36 real browser QA
on:
  push:
    branches: [feature/fitness-two-videos-timeline-20261122]
    paths: [.github/workflows/fitness-v536-browser-qa.yml, fitness-tracker/app.js, fitness-tracker/v536-follow-video.css]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Check both videos, timestamp seeking and wake lock lifecycle
        run: |
          mkdir -p fitness-tracker/qa
          cat > /tmp/qa.py <<'PY'
          import json,threading,http.server,socketserver,os,re
          from playwright.sync_api import sync_playwright
          class Handler(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
              def send_head(self):
                  self._partial=None
                  path=self.translate_path(self.path)
                  requested=self.headers.get('Range','')
                  if os.path.isfile(path) and requested.startswith('bytes='):
                      match=re.match(r'bytes=(\d+)-(\d*)',requested)
                      if match:
                          size=os.path.getsize(path)
                          start=int(match.group(1))
                          end=min(size-1,int(match.group(2)) if match.group(2) else size-1)
                          if 0<=start<=end:
                              f=open(path,'rb');f.seek(start)
                              self._partial=end-start+1
                              self.send_response(206)
                              self.send_header('Content-Type',self.guess_type(path))
                              self.send_header('Accept-Ranges','bytes')
                              self.send_header('Content-Range',f'bytes {start}-{end}/{size}')
                              self.send_header('Content-Length',str(self._partial))
                              self.end_headers()
                              return f
                  return super().send_head()
              def copyfile(self,source,output):
                  if self._partial is None:return super().copyfile(source,output)
                  remaining=self._partial
                  while remaining>0:
                      data=source.read(min(65536,remaining))
                      if not data:break
                      output.write(data);remaining-=len(data)
          server=socketserver.ThreadingTCPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          addr='http://127.0.0.1:%s/fitness-tracker/' % server.server_address[1]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--autoplay-policy=no-user-gesture-required'])
              ctx=browser.new_context(viewport={'width':390,'height':844},device_scale_factor=2,
                   is_mobile=True,has_touch=True,locale='zh-CN',service_workers='block')
              page=ctx.new_page();errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.add_init_script("""(() => {
                window.__wakeEvents=[];
                Object.defineProperty(navigator,'wakeLock',{configurable:true,value:{
                  request: async (kind) => {
                    window.__wakeEvents.push('request:'+kind);
                    return {released:false,release(){this.released=true;window.__wakeEvents.push('release');return Promise.resolve();},addEventListener(){}};
                  }
                }});
              })();""")
              page.goto(addr,wait_until='networkidle',timeout=90000)
              page.locator('#mobileNav [data-view="followalong"]').click()
              page.locator('.fa-chapter').first.wait_for(state='visible')
              assert page.locator('.fa-chapter').count()==12
              assert page.locator('[data-follow-jump="329"]').count()==1
              page.wait_for_function("""() => {
                const a=document.getElementById('fa-video-1'),b=document.getElementById('fa-video-2');
                return a && b && a.readyState>=1 && b.readyState>=1;
              }""",timeout=45000)
              dims=page.evaluate("""() => ({
                title:document.title,chapters:[...document.querySelectorAll('.fa-chapter')].map(b=>b.textContent.trim()),
                duration1:document.querySelector('#fa-video-1').duration,
                duration2:document.querySelector('#fa-video-2').duration,
                source1:document.querySelector('#fa-video-1').currentSrc,
                source2:document.querySelector('#fa-video-2').currentSrc,
                writingMode:getComputedStyle(document.querySelector('.fa-chapter-title')).writingMode,
                glyphPositions:[...document.querySelectorAll('.fa-chapter:first-child .fa-chapter-glyph')].map(e=>Math.round(e.getBoundingClientRect().top))
              })""")
              assert abs(dims['duration1']-373.4)<2,dims
              assert abs(dims['duration2']-188.383)<2,dims
              assert '1.mp4' in dims['source1'] and '2.mp4' in dims['source2'],dims
              assert dims['writingMode']=='horizontal-tb',dims
              assert len(dims['glyphPositions'])==4 and dims['glyphPositions']==sorted(set(dims['glyphPositions'])),dims
              styles=page.evaluate("""() => {
                const inspect=(selector)=>{
                  const el=document.querySelector(selector),cs=getComputedStyle(el),r=el.getBoundingClientRect();
                  return {text:el.textContent,visibility:cs.visibility,opacity:cs.opacity,color:cs.color,
                    fill:cs.webkitTextFillColor,fontSize:cs.fontSize,writingMode:cs.writingMode,
                    display:cs.display,overflow:cs.overflow,
                    width:r.width,height:r.height,scrollWidth:el.scrollWidth,scrollHeight:el.scrollHeight};
                };
                return {heading:inspect('.fa-video-head h2'),chapter:inspect('.fa-chapter-title')};
              }""")
              print("STYLE_DIAGNOSTICS",json.dumps(styles,ensure_ascii=False),flush=True)
              assert styles['chapter']['height']>=50,styles
              assert styles['heading']['color']=='rgb(35, 19, 11)',styles
              page.locator('[data-follow-jump="329"]').click()
              page.wait_for_timeout(1600)
              diag=page.evaluate("""() => { const v=document.getElementById('fa-video-1'); return {
                currentTime:v.currentTime,duration:v.duration,readyState:v.readyState,
                networkState:v.networkState,seeking:v.seeking,seekable:v.seekable.length,
                currentSrc:v.currentSrc,error:v.error?.message,
                selected:[...document.querySelectorAll('.fa-chapter.active')].map(x=>x.textContent),
                status:document.getElementById('fa-awake-info').textContent
              }; }""")
              print("SEEK_DIAGNOSTICS",json.dumps(diag,ensure_ascii=False),flush=True)
              page.screenshot(path='fitness-tracker/qa/v536-actual-mobile-with-timeline.png',full_page=True,animations='disabled')
              page.wait_for_function("document.querySelector('#fa-video-1').currentTime>=328.5",timeout=12000)
              page.wait_for_function("window.__wakeEvents.includes('request:screen')",timeout=10000)
              page.evaluate("document.querySelector('#fa-video-1').pause()")
              page.wait_for_function("window.__wakeEvents.includes('release')",timeout=10000)
              page.screenshot(path='fitness-tracker/qa/v536-actual-mobile-with-timeline.png',full_page=True,animations='disabled')
              page.evaluate("""async () => {
                const a=document.querySelector('#fa-video-1');
                const b=document.querySelector('#fa-video-2');
                a.muted=true;b.muted=true;
                await a.play();await b.play();
              }""")
              states=page.evaluate("""() => ({
                firstPaused:document.querySelector('#fa-video-1').paused,
                secondPlaying:!document.querySelector('#fa-video-2').paused,
                wakeEvents:window.__wakeEvents
              })""")
              assert states['firstPaused'] and states['secondPlaying'],states
              page.evaluate("document.querySelector('#fa-video-2').pause()")
              print('V536_BROWSER_QA',json.dumps({'media':dims,'playback':states,'errors':errors},ensure_ascii=False))
              assert not errors,errors
              browser.close()
          server.shutdown()
          PY
          python /tmp/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitness-v536-real-browser-screenshot
          path: fitness-tracker/qa/v536-actual-mobile-with-timeline.png
