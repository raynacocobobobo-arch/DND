name: Deploy Four Corrected Cups Paintings
on:
  push:
    branches: [main]
    paths: [".github/workflows/cups-four-corrections-v3.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cups-four-v3-art
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - run: python -m pip install --quiet Pillow
      - name: Transfer originals without regeneration
        shell: bash
        run: |
          cat > /tmp/cups-art-input.json <<'MANIFEST_END'
          [
            {
              "slug": "four",
              "url": "https://docs.google.com/docs-images-rt/ALKuzta3Sf6_Fw_3i4_hfRnKW4l3bB9kKYiBoiybNKlywkeK6byeKFNWz3Tly-CoE6nTEsC7daRyYZ9YVAHWgy6B05Ag89V-8Dbgf36X-4mBrIZuQkwcdpQgQ_e2YvYdnmF8jnjOqFr1Fk-vG2t8doDKPx20a5u8drAkEqDVuIiMxDa3_3cL=s2048?key=IUxvN53PSzX0AUpdb0Rhog"
            },
            {
              "slug": "six",
              "url": "https://docs.google.com/docs-images-rt/ALKuztYnENXA6vOisTAUtSf6OOMSLOme1UaTNcW-EYCBKMYjAyI2lxCM7umA4u267jpMH89wxxcJQHQ5wIMec6vNp4e_DYuSj_FR4nzMAE8YbQmoYsmE3_UCXXYlSaUEVtbJPZ9zCfHMNEWlpH1arcaDhNZcIgN9rIi3sfCVEzrWM8qgOo2-=s2048?key=IUxvN53PSzX0AUpdb0Rhog"
            },
            {
              "slug": "nine",
              "url": "https://docs.google.com/docs-images-rt/ALKuztabivWKKWnI6P_VEwPaBvTILhxXMu-9srr7KOTLmgxmwsSSHSjn3EVLAQkg4wHdKSSuQQMo6Tdm0gufZJE8E0AFpSqZ_s3kP8bqjLONpoNtod8ot9AgElOb6dPNoLdxCEuJFGzYF8n0fPTySkAz-a2vj2dv9PqoWPQDIaboTHqiZVYil0Y=s2048?key=IUxvN53PSzX0AUpdb0Rhog"
            },
            {
              "slug": "ten",
              "url": "https://docs.google.com/docs-images-rt/ALKuztYE7UBZptqb0CvfT2ul9YQI6gYvEVCPgnwSkRCUc0ai9BCxtqDsvRPsIeOiSSu8-8rB_Q682SCxx3VookvjITplerLTb9ZPg1bmoJQPQbpr32L0hNi_FX4hO2oHPHH9Tt-ofIhbnpikPyiHQNF4T2CuA9Sz-nfxDkzcJix-6_WylSCS5Hk=s2048?key=IUxvN53PSzX0AUpdb0Rhog"
            }
          ]
          MANIFEST_END
          cat > /tmp/transfer_cups.py <<'PY_END'
          import io, json, os, time, urllib.request, hashlib
          from PIL import Image
          from concurrent.futures import ThreadPoolExecutor,as_completed
          items=json.load(open('/tmp/cups-art-input.json'))
          assert [e['slug'] for e in items]==['four','six','nine','ten']
          os.makedirs('minor-arcana/cups/final',exist_ok=True)
          os.makedirs('minor-arcana/cups/thumbs',exist_ok=True)
          def fetch(e):
            slug=e['slug'];last=None
            for attempt in range(4):
              try:
                request=urllib.request.Request(e['url'],headers={'User-Agent':'TarotOriginalArtworkUploader/1.0'})
                with urllib.request.urlopen(request,timeout=80) as response:
                  raw=response.read()
                if len(raw)<150000:raise ValueError('source file too small')
                with Image.open(io.BytesIO(raw)) as img:
                  img.load();original=img.convert('RGB')
                if original.size!=(941,1672):raise ValueError('resolution mismatch '+str(original.size))
                final=f'minor-arcana/cups/final/{slug}-of-cups-v3.webp'
                original.save(final,'WEBP',lossless=True,method=5)
                with Image.open(final) as check:
                  check.load()
                  assert check.format=='WEBP' and check.size==(941,1672)
                  assert check.convert('RGB').tobytes()==original.tobytes(), 'pixels changed '+slug
                thumb=original.copy();thumb.thumbnail((360,640),Image.Resampling.LANCZOS)
                thumb_path=f'minor-arcana/cups/thumbs/{slug}-of-cups-v3.webp'
                thumb.save(thumb_path,'WEBP',quality=90,method=5)
                return dict(slug=slug,path=final,thumb=thumb_path,sha256=hashlib.sha256(open(final,'rb').read()).hexdigest(),bytes=os.path.getsize(final),resolution=[941,1672])
              except Exception as exc:
                last=exc
                time.sleep(attempt*3+1)
            raise RuntimeError(str((slug,last)))
          with ThreadPoolExecutor(max_workers=4) as executor:
            jobs=[executor.submit(fetch,e) for e in items]
            output=[f.result() for f in as_completed(jobs)]
          assert len(output)==4 and len({x['sha256'] for x in output})==4
          output.sort(key=lambda x:['four','six','nine','ten'].index(x['slug']))
          for item in output:print('APPROVED_IMAGE_TRANSFER_OK',item,flush=True)
          with open('minor-arcana/cups/final/corrected-four-v3-manifest.json','w',encoding='utf-8') as f:json.dump(output,f,indent=2)
          print('ALL_FOUR_SOURCE_IMAGES_SAVED_WITH_PIXEL_IDENTITY',flush=True)
          PY_END
          python /tmp/transfer_cups.py
      - name: Commit actual art files to live website branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minor-arcana/cups/final minor-arcana/cups/thumbs
          git diff --cached --stat
          git diff --cached --quiet && { echo "No change"; exit 1; }
          git commit -m "art(cups): publish corrected IV VI IX X original paintings"
          git push origin HEAD:gh-pages
