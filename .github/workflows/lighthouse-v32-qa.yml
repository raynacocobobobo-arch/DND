name: Lighthouse V32 dynamic Kraken and pirate navigation QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v32-*.js'
      - 'lighthouse/v32-preview.html'
      - '.github/workflows/lighthouse-v32-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v32
          npm --prefix /tmp/lighthouse-v32 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v32/node_modules/.bin/playwright install chromium
      - name: Verify event obstacles only activate while actually present
        env:
          NODE_PATH: /tmp/lighthouse-v32/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v32.log 2>&1 &
          mkdir -p lighthouse/v32-qa-output
          cat >/tmp/lighthouse-v32/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push(e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
           page.on('requestfailed',r=>errors.push(r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v32-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const state=()=>page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             return {version:document.body.dataset.version,mode:document.body.dataset.mode,
              boat:api.getBoat(),event:api.getState()};
           });
           const init=await state();
           const idle=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             return {siteFree:api.testBoatSafe(-12.2,3.4),
               laneFree:api.testBoatSafe(12,-11.685),
               reefBlocked:!api.testBoatSafe(9,7),
               islandBlocked:!api.testBoatSafe(0,0),
               edgeBlocked:!api.testBoatSafe(99,99)};
           });
           await page.screenshot({path:'lighthouse/v32-qa-output/day-boat-free-ocean.png'});
           const sailing=await page.evaluate(()=>window.__lighthouseNightEvents.routeBoatTo(-4.75,8.1));
           const travelled=await page.evaluate(()=>window.__lighthouseNightEvents.advanceBoatForTest(5));
           await page.locator('#mode-night').click();
           await page.waitForTimeout(3150);
           const waitForHazards=await state();
           const nightIdle=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             return {siteFree:api.testBoatSafe(-12.2,3.4),
               laneFree:api.testBoatSafe(12,-11.685)};
           });
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const triggerTentacles=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const kraken=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.6));
           const activeKraken=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             const arms=api.getState().arms.filter(a=>a.visible);
             return {visible:arms.length,
               blocked:arms.every(a=>!api.testBoatSafe(a.origin.x,a.origin.z)),
               otherSites:api.getState().arms.filter(a=>!a.visible).map(a=>({
                 origin:a.origin,safe:api.testBoatSafe(a.origin.x,a.origin.z)})),
               boat:api.getBoat()};
           });
           await page.screenshot({path:'lighthouse/v32-qa-output/night-active-kraken.png'});
           const triggerShip=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const activeShip=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             return {ship:api.getState().ship,blocked:!api.testBoatSafe(12,-11.685),
               dynamic:api.getBoat()};
           });
           const both=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1));
           const sailingInEvents=await page.evaluate(()=>window.__lighthouseNightEvents.advanceBoatForTest(5));
           await page.screenshot({path:'lighthouse/v32-qa-output/night-active-ship-and-kraken.png'});
           await page.locator('#mode-day').click();
           await page.waitForTimeout(3000);
           const retreat=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(7));
           const shipExit=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(26));
           const after=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents;
             return {freeSite:api.testBoatSafe(-12.2,3.4),
               freeLane:api.testBoatSafe(12,-11.685),
               boat:api.getBoat(),event:api.getState()};
           });
           const ok=init.version==='v32a'&&init.mode==='day'&&init.boat.safe&&
             idle.siteFree&&idle.laneFree&&idle.reefBlocked&&idle.islandBlocked&&idle.edgeBlocked&&
             sailing&&travelled.travelled>1&&travelled.safe&&
             waitForHazards.mode==='night'&&nightIdle.siteFree&&nightIdle.laneFree&&
             triggerTentacles&&kraken.activeCount===5&&activeKraken.visible===5&&
             activeKraken.blocked&&
             activeKraken.otherSites.every(s=>s.safe)&&
             activeKraken.boat.tentacleBlockedCount===5&&
             triggerShip&&activeShip.ship.active&&activeShip.blocked&&
             activeShip.dynamic.pirateLaneBlocked&&both.concurrent&&sailingInEvents.safe&&
             retreat.activeCount===0&&!shipExit.ship.active&&after.freeSite&&after.freeLane&&
             after.boat.tentacleBlockedCount===0&&!after.boat.pirateLaneBlocked&&
             errors.length===0;
           console.log('V32_QA_RESULT',JSON.stringify({
             ok,initialMode:init.mode,idle,nightIdle,sailing,
             moved:travelled.travelled,krakenCount:kraken.activeCount,
             visibleKraken:activeKraken.visible,krakenSafe:activeKraken.blocked,
             otherSites:activeKraken.otherSites,shipTriggered:triggerShip,
             shipBlocked:activeShip.blocked,simultaneous:both.concurrent,
             after,errors
           }));
           await browser.close();
           if(!ok)throw Error('V32 dynamic obstacle regression failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v32/test.cjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v32-dynamic-navigation
          path: lighthouse/v32-qa-output/
          if-no-files-found: warn
