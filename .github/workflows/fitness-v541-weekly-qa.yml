name: Fitness V5.41 weekly progress visual regression
on:
  push:
    branches: [fix/fitness-weekly-progress-clipping-v541-20261123]
    paths: [.github/workflows/fitness-v541-weekly-qa.yml, fitness-tracker/v541-weekly-progress-fix.css]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Check text never overlaps bar in narrow phone layouts
        run: |
          mkdir -p fitness-tracker/qa
          cat > /tmp/qa_v541.py <<'PY'
          import json,threading,http.server,socketserver
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          class Handler(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          server=socketserver.ThreadingTCPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base='http://127.0.0.1:%s/fitness-tracker/'%server.server_address[1]
          fixture={'version':1,'settings':{'weight':65,'age':36,'weeklyGoal':1500},
                   'records':[],'weightHistory':{'2026-11-21':65.4},'stepDiary':{},
                   'eatingWindows':{'2026-11-22':{'startAt':0}}}
          def measure(page):
              return page.evaluate("""() => {
                function box(selector){
                  const el=document.querySelector(selector);
                  if(!el)return null;
                  const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
                  return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height,
                    scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,overflow:cs.overflow,
                    fontSize:cs.fontSize,lineHeight:cs.lineHeight,text:el.textContent?.trim()};
                }
                const span=document.querySelector('.if6-week-cal'),range=document.createRange();
                range.selectNodeContents(span);const tr=range.getBoundingClientRect();
                const cards=[...document.querySelectorAll('.if6-card')].map(el=>el.getBoundingClientRect());
                return {viewport:[innerWidth,innerHeight],pageScrollHeight:document.documentElement.scrollHeight,
                   stats:box('.if6-stats'),week:box('.if6-stat-week'),upper:box('.if6-week-upper'),
                   kcal:box('.if6-week-cal'),bar:box('.if6-track'),hero:box('.if6-head'),
                   eating:box('.if6-eat'),nav:box('#mobileNav'),
                   kcalText:{top:tr.top,bottom:tr.bottom,width:tr.width},
                   cardCount:cards.length,lastCardBottom:Math.max(...cards.map(r=>r.bottom)),
                   minCardHeight:Math.min(...cards.map(r=>r.height)),
                   phase:document.querySelector('.if6-eat')?.dataset.eatingPhase,
                   cssVersion:[...document.styleSheets].map(s=>s.href).filter(x=>x?.includes('v541'))};
              }""")
          def assess(info,allow_scroll=False):
              assert info['kcal']['text']=='0 / 1,500 kcal',info
              assert info['bar']['top']>=info['kcalText']['bottom']+2, 'kcal glyphs overlap bar: '+str(info)
              assert info['upper']['bottom']<=info['kcalText']['top']+2,'upper header overlaps kcal: '+str(info)
              assert info['kcalText']['bottom']<=info['stats']['bottom']-3,'kcal clipped by stats boundary: '+str(info)
              assert info['kcalText']['width']<info['kcal']['width']+1,'kcal clipped horizontally: '+str(info)
              assert info['cardCount']==12 and info['minCardHeight']>=90,info
              assert info['eating']['height']>=55,info
              if not allow_scroll:assert info['lastCardBottom']<=info['nav']['top']+2,info
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(viewport={'width':353,'height':768},device_scale_factor=2,
                is_mobile=True,has_touch=True,locale='zh-CN',timezone_id='Asia/Shanghai',service_workers='block')
              page=context.new_page();errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.clock.install(time=datetime(2026,11,23,0,3,tzinfo=ZoneInfo('Asia/Shanghai')))
              page.add_init_script("""(() => {
                const state=%s;
                state.eatingWindows['2026-11-22'].startAt=new Date(2026,10,22,9,19).getTime();
                if(!localStorage.getItem('hermes_fitness_journal_v1'))
                  localStorage.setItem('hermes_fitness_journal_v1',JSON.stringify(state));
              })();"""%json.dumps(fixture,ensure_ascii=False))
              page.goto(base,wait_until='networkidle',timeout=90000)
              alldata={}
              for w,h in [(353,768),(375,812),(390,844),(402,874)]:
                  page.set_viewport_size({'width':w,'height':h})
                  page.evaluate('window.scrollTo(0,0)')
                  info=measure(page)
                  print('V541_DIM',w,h,json.dumps(info,ensure_ascii=False),flush=True)
                  assess(info)
                  alldata[f'{w}x{h}']=info
                  page.screenshot(path=f'fitness-tracker/qa/v541-zero-progress-{w}x{h}.png',full_page=False,animations='disabled')
              page.set_viewport_size({'width':390,'height':844})
              page.add_style_tag(content='body[data-screen="overview"] .main{padding-top:55px!important;}')
              safe=measure(page)
              print('V541_SAFE',json.dumps(safe,ensure_ascii=False),flush=True)
              assess(safe)
              page.screenshot(path='fitness-tracker/qa/v541-safe-area.png',full_page=False,animations='disabled')
              page.set_viewport_size({'width':375,'height':667})
              page.evaluate('window.scrollTo(0,document.documentElement.scrollHeight)')
              short=measure(page)
              print('V541_SHORT',json.dumps(short,ensure_ascii=False),flush=True)
              assess(short)
              assert short['lastCardBottom']<=short['nav']['top']+2,short
              page.screenshot(path='fitness-tracker/qa/v541-short-375x667.png',full_page=False,animations='disabled')
              assert not errors,errors
              Path('fitness-tracker/qa/v541-diagnostics.json').write_text(json.dumps(
                {'sizes':alldata,'safe':safe,'short':short,'errors':errors},ensure_ascii=False,indent=2))
              browser.close()
          server.shutdown()
          PY
          python /tmp/qa_v541.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitness-v541-actual-phone-screens
          path: fitness-tracker/qa/v541-*
