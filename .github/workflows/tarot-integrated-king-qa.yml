name: Verify Cup King inside main Tarot library
on:
  push:
    branches: [main]
    paths: [".github/workflows/tarot-integrated-king-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Install Selenium and Pillow
        run: python -m pip install --quiet selenium requests pillow
      - name: Verify approved King exists in actual deck navigation
        run: |
          cat >/tmp/check.py <<'PY'
          import time,io,requests
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://raynacocobobobo-arch.github.io/DND/'
          for n in range(35):
            r=requests.get(base+'?king-integrated-check='+str(n),headers={'Cache-Control':'no-cache'},timeout=25)
            if r.ok and 'king-integrated-20261026' in r.text:
                break
            print('Waiting for deploy',n,r.status_code,flush=True)
            time.sleep(5)
          else:raise RuntimeError('new app version not yet deployed')
          r=requests.get(base+'minor-arcana/cups/final/king-of-cups-v1.webp',timeout=40);r.raise_for_status()
          im=Image.open(io.BytesIO(r.content));im.load()
          assert im.format=='WEBP' and im.size==(941,1672)
          print('APPROVED_BINARY_REAL_941x1672',flush=True)
          opts=Options()
          for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1370,920']:opts.add_argument(x)
          b=webdriver.Chrome(options=opts)
          b.set_script_timeout(35)
          try:
            b.get(base+'?v=integrated-king#/home')
            WebDriverWait(b,20).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.home-visual img'))==1)
            nav=b.find_element(By.CSS_SELECTOR,'[data-route-nav="cups"]')
            assert nav.get_attribute('href').endswith('#/library/cups'),nav.get_attribute('href')
            b.execute_script("document.querySelector('[data-route-nav=\"cups\"]').click()")
            WebDriverWait(b,12).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.cups-approved-card'))==1)
            assert '已定稿 1 / 14 张' in b.find_element(By.CSS_SELECTOR,'.library-count').text
            assert len(b.find_elements(By.CSS_SELECTOR,'.library-card'))==1
            print('NATIVE_LIBRARY_CUPS_ONE_APPROVED_PASS',flush=True)
            b.execute_script("document.querySelector('.cups-approved-card').click()")
            WebDriverWait(b,12).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1)
            assert b.current_url.endswith('#/card/cups/king'),b.current_url
            assert '圣杯国王' in b.find_element(By.CSS_SELECTOR,'.detail-copy h1').text
            txt=b.find_element(By.CSS_SELECTOR,'.detail-copy').text
            for x in ['牌面的故事','正位 · 启示','逆位 · 阴影','原著背景与艺术改编','留给你的问题']:
                assert x in txt,x
            detail=b.execute_async_script("""
                const done=arguments[0],im=document.querySelector('.detail-art img');
                im.decode().then(()=>done([im.naturalWidth,im.naturalHeight])).catch(()=>done([0,0]));
            """)
            assert detail==[941,1672],detail
            assert len(b.find_elements(By.CSS_SELECTOR,'.library-card'))==0
            print('KING_DEDICATED_DETAIL_REAL_HD_WITH_STORY_PASS',flush=True)
            b.get(base+'?v=integrated-king#/library/1')
            WebDriverWait(b,12).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.library-card'))==6)
            b.get(base+'?v=integrated-king#/draw')
            WebDriverWait(b,12).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#go-draw'))==1)
            b.execute_script("document.querySelector('#go-draw').click()")
            assert len(b.find_elements(By.CSS_SELECTOR,'.drawn-card'))==1
            print('ORIGINAL_22_AND_DRAW_PRESERVED_PASS',flush=True)
            b.set_window_size(390,844)
            b.get(base+'?v=integrated-king#/card/cups/king')
            WebDriverWait(b,12).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.detail-art img'))==1)
            overflow=b.execute_script("return [document.documentElement.scrollWidth,window.innerWidth]")
            assert overflow[0]<=overflow[1]+2,overflow
            print('MOBILE_NO_HORIZONTAL_OVERFLOW_PASS',flush=True)
            print('ALL_MAIN_SITE_KING_INTEGRATION_TESTS_PASSED',flush=True)
          finally:b.quit()
          PY
          python /tmp/check.py
