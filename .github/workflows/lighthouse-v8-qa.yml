name: Lighthouse V8 preview visual QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v8-*.js'
      - 'lighthouse/v8-preview.html'
      - '.github/workflows/lighthouse-v8-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v8
          npm --prefix /tmp/lighthouse-v8 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v8/node_modules/.bin/playwright install chromium
      - name: Render night, day and overhead, test mode buttons
        env:
          NODE_PATH: /tmp/lighthouse-v8/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v8-http.log 2>&1 &
          mkdir -p lighthouse/v8-qa-output
          cat >/tmp/lighthouse-v8/qa.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              '--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage'
            ]});
            const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
            await page.goto('http://127.0.0.1:8765/lighthouse/v8-preview.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(11000);
            const base=await page.evaluate(()=>({
              ready:document.body.dataset.rendered,version:document.body.dataset.version,
              meshCount:Number(document.body.dataset.meshCount||0),
              initialMode:document.body.dataset.mode,
              canvas:document.querySelector('canvas')?.width,
              status:document.querySelector('#status')?.textContent,
              hidden:document.querySelector('#status')?.hidden
            }));
            await page.screenshot({path:'lighthouse/v8-qa-output/night.png'});
            await page.locator('#mode-day').click();await page.waitForTimeout(650);
            const day=await page.evaluate(()=>document.body.dataset.mode);
            await page.screenshot({path:'lighthouse/v8-qa-output/day.png'});
            await page.locator('#topview').click();await page.waitForTimeout(700);
            await page.screenshot({path:'lighthouse/v8-qa-output/overhead.png'});
            await page.locator('#reset').click();await page.waitForTimeout(450);
            await page.mouse.move(620,515);await page.mouse.down();await page.mouse.move(780,595,{steps:14});await page.mouse.up();await page.waitForTimeout(600);
            await page.screenshot({path:'lighthouse/v8-qa-output/rotated.png'});
            await page.locator('#mode-night').click();
            const night=await page.evaluate(()=>document.body.dataset.mode);
            console.log('RESULT',JSON.stringify({base,day,night,errors}));
            await browser.close();
            if(base.ready!=='true'||base.version!=='v8'||base.meshCount<210||base.initialMode!=='night'||day!=='day'||night!=='night'||errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v8/qa.cjs
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v8-preview
          path: lighthouse/v8-qa-output/
          if-no-files-found: warn
