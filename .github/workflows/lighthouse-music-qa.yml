name: Lighthouse bundled background music regression QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/index.html'
      - 'lighthouse/background-music.js'
      - 'lighthouse/audio/lighthouse_background_music.mp3'
      - '.github/workflows/lighthouse-music-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-background-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --prefix /tmp/musicqa playwright@1.56.1 --no-audit --no-fund
          /tmp/musicqa/node_modules/.bin/playwright install chromium
      - name: Assert full audio asset and actual game playback
        env:
          NODE_PATH: /tmp/musicqa/node_modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lighthouse/audio/lighthouse_background_music.mp3')
          data=p.read_bytes()
          assert len(data)>1_900_000, f'missing or truncated MP3: {len(data)} bytes'
          assert data[:3]==b'ID3' or data[:2]==b'\xff\xfb', 'invalid MP3 header'
          html=Path('lighthouse/index.html').read_text()
          assert 'music-toggle' not in html and 'music-volume' not in html and 'music-file' not in html
          assert 'src="./audio/lighthouse_background_music.mp3?v=music4"' in html
          print('Bundled MP3 size:',len(data))
          PY
          python3 -m http.server 8765 >/tmp/musicqa-server.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
           const page=await browser.newPage({viewport:{width:1100,height:750}});
           const errors=[];
           page.on('pageerror',err=>errors.push(err.message));
           const response=await page.goto('http://localhost:8765/lighthouse/',{waitUntil:'domcontentloaded'});
           if(response.status()!==200)throw Error('index.html did not load');
           await page.waitForFunction(()=>window.__lighthouseMusic?.getState().playing===true,{timeout:30000});
           const result=await page.evaluate(()=>{
            const audio=document.getElementById('game-background-music');
            return {status:document.body.dataset.musicStatus,
             paused:audio.paused,ready:audio.readyState,volume:audio.volume,
             duration:audio.duration,src:audio.currentSrc,
             loop:audio.loop,buttonCount:document.querySelectorAll(
             '#music-toggle,#music-volume,#music-file,#music-status').length};
           });
           console.log('MUSIC_QA',JSON.stringify({result,errors}));
           if(result.paused||result.ready<2||result.duration<110||result.duration>130||
             !result.loop||result.buttonCount!==0||errors.length>0)
              throw Error('Game music autoplay regression');
           await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
