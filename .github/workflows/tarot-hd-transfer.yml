name: Deploy 22 HD Tarot Images
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tarot-hd-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarot-hd-images-deployment
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout live GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - name: Install image processing library
        run: python -m pip install --quiet Pillow
