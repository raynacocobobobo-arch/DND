            }
          ]
          IMAGE_MANIFEST_END
          cat > /tmp/process_tarot.py <<'PYTHON_END'
          import io, json, hashlib, os, shutil, urllib.request, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from PIL import Image, ImageOps

          data=json.load(open('/tmp/tarot-source.json',encoding='utf8'))
          assert len(data)==22 and set(x['id'] for x in data)==set(range(22))
          assert len({x['old_path'] for x in data})==22
          for folder in ['assets/cards','assets/cards-hd','assets/cards-thumb']:
              os.makedirs(folder,exist_ok=True)

          def process(item):
              last=None
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(item['url'],headers={'User-Agent':'TarotHDTransfer/1.0'})
                      with urllib.request.urlopen(request,timeout=45) as r:
                          raw=r.read()
                      if len(raw)<200_000: raise ValueError('Unexpected small original')
                      with Image.open(io.BytesIO(raw)) as img:
                          img=ImageOps.exif_transpose(img).convert('RGB')
                          if img.width<800 or img.height<1400:
                              raise ValueError('Not HD '+str(img.size))
                          original_size=img.size
                          buff=io.BytesIO();img.save(buff,'WEBP',quality=93,method=6)
                          hd_bytes=buff.getvalue()
                          thumb=img.copy();thumb.thumbnail((360,640),Image.Resampling.LANCZOS)
                          tb=io.BytesIO();thumb.save(tb,'WEBP',quality=83,method=5)
                          thumb_bytes=tb.getvalue()
                      i=item['id']
                      hd=f'assets/cards-hd/arcana-{i:02d}.webp'
                      old=item['old_path']
                      small=f'assets/cards-thumb/arcana-{i:02d}.webp'
                      for path,bytes_ in [(hd,hd_bytes),(old,hd_bytes),(small,thumb_bytes)]:
                          with open(path,'wb') as f:f.write(bytes_)
                      return {'id':i,'name':item['name'],'hd':hd,'old':old,'thumbnail':small,
                              'original_size':list(original_size),'hd_bytes':len(hd_bytes),
                              'thumb_bytes':len(thumb_bytes),'sha256':hashlib.sha256(hd_bytes).hexdigest()}
                  except Exception as exc:
                      last=exc
                      time.sleep(attempt*2+1)
              raise RuntimeError('Unable to download card '+str(item['id'])+': '+repr(last))

          outputs=[]
          with ThreadPoolExecutor(max_workers=6) as pool:
              jobs=[pool.submit(process,item) for item in data]
              for job in as_completed(jobs):
                  v=job.result(); outputs.append(v)
                  print('OK',f"{v['id']:02}",v['name'],v['original_size'],v['hd_bytes'],flush=True)
          outputs.sort(key=lambda x:x['id'])
          assert len(outputs)==22 and len({x['sha256'] for x in outputs})==22
          for entry in outputs:
              path=entry['hd']
              with Image.open(path) as im:
                  assert im.format=='WEBP' and im.size==tuple(entry['original_size'])
          with open('assets/cards-hd/manifest.json','w',encoding='utf8') as f:
              json.dump(outputs,f,ensure_ascii=False,indent=2)
          print('VERIFIED_22_HIGH_RESOLUTION_CARDS',sum(x['hd_bytes'] for x in outputs),flush=True)
          PYTHON_END
          python /tmp/process_tarot.py
      - name: Commit actual image binaries to live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards assets/cards-hd assets/cards-thumb
          git diff --cached --stat
          git diff --cached --quiet && { echo "No changes in image files"; exit 1; }
          git commit -m "assets(tarot): replace all 22 images with verified original HD art"
          git push origin HEAD:gh-pages
