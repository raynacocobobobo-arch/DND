name: Lighthouse V29 island-matched offshore boulders QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v29-*.js'
      - 'lighthouse/v29-preview.html'
      - '.github/workflows/lighthouse-v29-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v29
          npm --prefix /tmp/lighthouse-v29 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v29/node_modules/.bin/playwright install chromium
      - name: Check actual rendered reference rocks in scene and closeups
        env:
          NODE_PATH: /tmp/lighthouse-v29/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v29.log 2>&1 &
          mkdir -p lighthouse/v29-qa-output
          cat >/tmp/lighthouse-v29/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v29-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const inspect=()=>page.evaluate(()=>{
            const a=window.__lighthouseNightEvents;
            return {version:document.body.dataset.version,geometry:document.body.dataset.geometryAudit,
             seaStyle:document.body.dataset.seaStyle,
             waterThickness:+document.body.dataset.waterThickness,
             seabedThickness:+document.body.dataset.seabedThickness,
             noCharacter:document.body.dataset.characterCount==='0',
             header:document.querySelectorAll('header').length,
             reefs:a.getReefs(),events:a.getState(),gulls:a.getGulls(),clouds:a.getClouds()};
           });
           const night=await inspect();
           await page.screenshot({path:'lighthouse/v29-qa-output/night-wide.png'});
           await page.locator('#mode-day').click();await page.waitForTimeout(3200);
           const day=await inspect();
           await page.screenshot({path:'lighthouse/v29-qa-output/day-wide.png'});
           for(let i=0;i<3;i++){
            await page.evaluate(i=>window.__lighthouseNightEvents.focusReefForTest(i),i);
            await page.waitForTimeout(450);
            await page.screenshot({path:'lighthouse/v29-qa-output/reef-'+i+'-close.png'});
           }
           await page.locator('#reset').click();
           await page.mouse.move(740,520);await page.mouse.down();
           await page.mouse.move(848,560,{steps:11});await page.mouse.up();
           await page.waitForTimeout(300);
           await page.screenshot({path:'lighthouse/v29-qa-output/day-orbit.png'});
           await page.locator('#mode-night').click();await page.waitForTimeout(3100);
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const tentacles=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
           const ship=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const combo=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1));
           const ok=[day,night].every(v=>
            v.version==='v29a'&&v.geometry==='pass'&&
            v.seaStyle==='nearshore-deepwater-vector'&&v.header===0&&v.noCharacter&&
            v.waterThickness===3&&v.seabedThickness===1.5&&
            v.reefs.style==='shore-boulder-matched'&&
            v.reefs.count===3&&v.reefs.safe&&v.reefs.solid&&
            v.reefs.referenceMaterialExact&&v.reefs.referenceTextureExact&&
            v.reefs.referenceGeometry&&v.reefs.referenceDetail===2&&
            v.reefs.fullyOpaque&&v.reefs.noExtraTints&&
            v.reefs.meshes===8&&
            v.reefs.sites[0].height>2.7&&v.reefs.sites[0].footprint>.8&&
            v.reefs.sites[1].height>1.8&&v.reefs.sites[1].footprint>1.1&&
            v.reefs.sites[2].height<1.3&&
            v.reefs.sites.every(s=>s.tentacleClearance>s.footprint+2.1&&
              s.pirateClearance>s.footprint+2.1)&&
            v.events.positions.length===8&&v.events.corridorClear&&
            v.gulls.gullScaleFactor===.7&&v.clouds.fixedCount===3)&&
            tentacles&&arms.activeCount===5&&ship&&combo.concurrent&&errors.length===0;
           console.log('V29_QA_RESULT',JSON.stringify({ok,night,day,tentacles,armsCount:arms.activeCount,ship,concurrent:combo.concurrent,errors}));
           await browser.close();
           if(!ok)throw Error('V29 rock match QA failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v29/test.cjs
      - name: Upload closeups and wide scene
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v29-reference-rock-qa
          path: lighthouse/v29-qa-output/
          if-no-files-found: warn
