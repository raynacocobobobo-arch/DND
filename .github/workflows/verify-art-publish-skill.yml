name: Test Verified GitHub Pages Artwork Skill
on:
  push:
    branches: [main]
    paths:
      - ".agents/skills/github-pages-art-publish/**"
      - ".github/workflows/verify-art-publish-skill.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skill-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install --quiet Pillow PyYAML
      - name: Compile production helper and run offline tests
        run: |
          python -m py_compile .agents/skills/github-pages-art-publish/scripts/transfer_art.py
          python -m unittest discover -v -s .agents/skills/github-pages-art-publish/tests -p 'test_*.py'
      - name: Validate SKILL frontmatter and workflow template YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          base=Path('.agents/skills/github-pages-art-publish')
          skill=(base/'SKILL.md').read_text(encoding='utf-8')
          assert skill.startswith('---\n') and '\nname: github-pages-art-publish\n' in skill
          assert '\ndescription:' in skill and len(skill)>1000
          template=(base/'templates/one-time-approved-art-upload.yml.tmpl').read_text(encoding='utf-8')
          assert template.count('__INDENTED_JSON_MANIFEST__')==1
          manifest='[{"name":"test","source_url":"https://docs.google.com/docs-images-rt/EXAMPLE","expected_size":[941,1672],"output_path":"minor-arcana/wands/final/ace-of-wands-v99.webp","thumb_path":"minor-arcana/wands/thumbs/ace-of-wands-v99.webp"}]'
          resolved=template.replace('__INDENTED_JSON_MANIFEST__',manifest)
          cfg=yaml.safe_load(resolved)
          assert cfg['jobs']['publish-originals']['steps']
          assert cfg['permissions']['contents']=='write'
          assert 'gh-pages' in resolved and 'scripts/transfer_art.py' in resolved
          print('SKILL_FRONTMATTER_AND_GITHUB_ACTIONS_YAML_PASS')
          PY
