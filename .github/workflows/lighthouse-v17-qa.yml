name: Lighthouse V17 random offshore clouds and sparse gull QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v17-*.js'
      - 'lighthouse/v17-preview.html'
      - '.github/workflows/lighthouse-v17-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v17
          npm --prefix /tmp/lighthouse-v17 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v17/node_modules/.bin/playwright install chromium
      - name: Test WebGL, ten random open-sea sites, one to three clouds and preserved events
        env:
          NODE_PATH: /tmp/lighthouse-v17/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/v17-server.log 2>&1 &
          mkdir -p lighthouse/v17-qa-output
          cat >/tmp/lighthouse-v17/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v17-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const init=await page.evaluate(()=>({
             version:document.body.dataset.version,
             geometryAudit:document.body.dataset.geometryAudit,
             seaArea:+document.body.dataset.waterAreaFactor,
             clouds:window.__lighthouseNightEvents.getClouds(),
             gulls:window.__lighthouseNightEvents.getGulls(),
             events:window.__lighthouseNightEvents.getState(),
             fogCount:+document.body.dataset.fogMeshCount
           }));
           await page.screenshot({path:'lighthouse/v17-qa-output/night-default.png'});
           await page.locator('#topview').click();
           await page.screenshot({path:'lighthouse/v17-qa-output/night-top.png'});
           await page.locator('#mode-day').click();
           await page.waitForTimeout(3100);
           await page.screenshot({path:'lighthouse/v17-qa-output/day-top.png'});
           await page.locator('#reset').click();
           await page.screenshot({path:'lighthouse/v17-qa-output/day-default.png'});
           const cloudHistory=await page.evaluate(()=>{
             const api=window.__lighthouseNightEvents,h=[];
             for(let i=0;i<175;i++){
               api.advanceCloudsForTest(1);
               const state=api.getClouds();
               h.push({count:state.clusterCount,sites:state.activeSites,change:state.totalChanges});
             }
             return {history:h,end:api.getClouds()};
           });
           await page.screenshot({path:'lighthouse/v17-qa-output/after-random-cloud-changes.png'});
           await page.locator('#mode-night').click();
           await page.waitForTimeout(3050);
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const launched=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
           const shipLaunch=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const combo=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1));
           await page.screenshot({path:'lighthouse/v17-qa-output/kraken-ship-clouds.png'});
           await page.locator('#mode-day').click();
           const instant=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
           const retreat=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(5));
           const exit=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(26));
           const seen=new Set(cloudHistory.history.flatMap(x=>x.sites));
           const ok=init.version==='v17a'&&init.geometryAudit==='pass'&&
             Math.abs(init.seaArea-5.6)<.0002&&init.fogCount===0&&
             init.clouds.style==='open-sea'&&init.clouds.siteCount===10&&
             init.clouds.candidatePositions.length===10&&init.clouds.layerCount===0&&
             init.clouds.clusterCount>=1&&init.clouds.clusterCount<=3&&
             init.clouds.candidatePositions.every(p=>Math.hypot(p.x+.2,p.z-.25)>8)&&
             cloudHistory.history.every(s=>s.count>=1&&s.count<=3&&new Set(s.sites).size===s.sites.length)&&
             cloudHistory.end.totalChanges>=3&&seen.size>=4&&
             init.gulls.residentCount===1&&init.gulls.transientCapacity===2&&
             init.events.positions.length===8&&init.events.corridorClear&&
             launched&&arms.activeCount===5&&shipLaunch&&combo.concurrent&&
             instant.activeCount===5&&instant.ship.active&&
             retreat.activeCount===0&&!exit.ship.active&&errors.length===0;
           console.log('V17_QA_RESULT',JSON.stringify({
             base:{version:init.version,clouds:init.clouds,gulls:init.gulls},
             cloudChanges:cloudHistory.end.totalChanges,seenSites:[...seen],
             minCloudCount:Math.min(...cloudHistory.history.map(x=>x.count)),
             maxCloudCount:Math.max(...cloudHistory.history.map(x=>x.count)),
             launched,armsCount:arms.activeCount,shipLaunch,concurrent:combo.concurrent,
             retreatCount:retreat.activeCount,shipActiveAfterExit:exit.ship.active,errors
           }));
           await browser.close();
           if(!ok)throw Error('V17 assertions failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v17/test.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v17-qa-screenshots
          path: lighthouse/v17-qa-output/
          if-no-files-found: warn
