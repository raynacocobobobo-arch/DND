# TEMPLATE FILE — copy under .github/workflows/one-time-approved-art-upload.yml
# The manifest placeholder below must be replaced with actual signed
# Docs-image URLs and paths. Keep all JSON lines indented by 10 spaces.
# Delete the entire temporary workflow after a successful deploy.
name: Transfer Approved Artwork to Live Site
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-approved-art-upload.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-approved-art-publish
  cancel-in-progress: false
jobs:
  publish-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout reusable script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - name: Checkout actual Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: live
          persist-credentials: true
      - name: Install image library
        run: python -m pip install --quiet Pillow
      - name: Transfer real approved files and verify pixel identity
        shell: bash
        run: |
          cat >/tmp/approved-art-manifest.json <<'END_ART_MANIFEST'
                    [
            {
              "name": "Cups three approved 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztZa6IZt3Vq1b6K7gR6F9MZbqzfU9-cOC2Ie2gVwPOroLDY1nV5h-PzZkvT4yejM7tIKNomx_c67l0InXbVOzfRGSNvjl91sRHo_IaED0hTVQ2CkXbU0KScU3haPf8PQJLOf0HeKrGcPzosWHUyCZjQNzsabLtcG9HrihTBKx76NDkR4iqM=s2048?key=JxdLUd-T2Rvo1LViaAqdaA",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "f5c9415fe933b767b2bcd0e929579a8dd635eb98b2c67042d6041fb5917ae26f",
              "output_path": "minor-arcana/cups/final/three-of-cups-v4.webp",
              "thumb_path": "minor-arcana/cups/thumbs/three-of-cups-v4.webp"
            },
            {
              "name": "Cups nine approved 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztZF_qSIuRnekw1Gex7rzvIa-JLEpOkBp2Ycg1e8R_Xcn3Nch6uStC3Lbycy9rPKpjBXLXz1sWOUN9PgFvXjPZ0tCre1jlaf3HutnrY9ciC1jKYt2WHmZ9tpYtnLJS2UOAHztddW69zWuekiHZdkyFM4LD4j8UfOlzQvHCNqLbNGxU9pKcI=s2048?key=JxdLUd-T2Rvo1LViaAqdaA",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "c3d51709ddb5f937205f7e71593cb81f584c8d1dc938592b49556e271666c93e",
              "output_path": "minor-arcana/cups/final/nine-of-cups-v4.webp",
              "thumb_path": "minor-arcana/cups/thumbs/nine-of-cups-v4.webp"
            },
            {
              "name": "Cups knight approved 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztZYOIo8Trc0Z5oHyImWad-KhkccBUjV_5BclHc8vc4GLMuM0bTjH6sBNzW1loRRCo3k4-MgaS8-J7zYZ3ndCdQpvecGl1HHh7AAwwUn5G-0G7X6KxwbXVhS3qOSNovx6y27uDqQ8J2EGSpvDIzRYOFSiKXMvXB_vXh56D1A-WTzQzYB=s2048?key=JxdLUd-T2Rvo1LViaAqdaA",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "44e06b94476c603fde2942af03458ff680af89eaa8d30af214c3e5c5b7350592",
              "output_path": "minor-arcana/cups/final/knight-of-cups-v4.webp",
              "thumb_path": "minor-arcana/cups/thumbs/knight-of-cups-v4.webp"
            }
          ]
          END_ART_MANIFEST
          python tools/.agents/skills/github-pages-art-publish/scripts/transfer_art.py \
            --manifest /tmp/approved-art-manifest.json \
            --root live \
            --paths-file /tmp/approved-art-staging.bin
      - name: Commit only verified artwork to gh-pages
        shell: bash
        run: |
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -0 git -C live add -- </tmp/approved-art-staging.bin
          git -C live diff --cached --stat
          if git -C live diff --cached --quiet; then
            echo "No new artwork generated; verify requested version paths"
            exit 1
          fi
          git -C live commit -m "art: publish verified approved originals via reusable skill"
          git -C live push origin HEAD:gh-pages
          echo "BINARY_ARTWORK_COMMITTED_TO_LIVE_GH_PAGES"
