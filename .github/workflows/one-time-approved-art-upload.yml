# TEMPLATE FILE — copy under .github/workflows/one-time-approved-art-upload.yml
# The manifest placeholder below must be replaced with actual signed
# Docs-image URLs and paths. Keep all JSON lines indented by 10 spaces.
# Delete the entire temporary workflow after a successful deploy.
name: Transfer Approved Artwork to Live Site
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-approved-art-upload.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-approved-art-publish
  cancel-in-progress: false
jobs:
  publish-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout reusable script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - name: Checkout actual Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: live
          persist-credentials: true
      - name: Install image library
        run: python -m pip install --quiet Pillow
      - name: Transfer real approved files and verify pixel identity
        shell: bash
        run: |
          cat >/tmp/approved-art-manifest.json <<'END_ART_MANIFEST'
                    [
            {
              "name": "Wands ace approved revision 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztZma1nxOraVt-OM6mXC8UvQzl_iS5YrhWyy6eLve3pOIPFEpgExvAF-6LAUW_wGjKkGTEXyYN4dIgZQGqe2YAlDk2MmrLGOLho502USxHAygE9KZIR4oZDm9-M3dKcqrl42kso4wzERhV6Y0iJwyoWzM6QBXoG3ibjYdhiooyfcdgJvQ2U=s2048?key=FUBUSlMOtWwjjZfBDjfz-w",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "58369e15f98a8b895973cbf3bf0a1b4c50e19da47dd84dff4dd436a9f08be353",
              "output_path": "minor-arcana/wands/final/ace-of-wands-v3.webp",
              "thumb_path": "minor-arcana/wands/thumbs/ace-of-wands-v3.webp"
            },
            {
              "name": "Wands eight approved revision 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztbiXYKUIRnFCPPkPIfHuoRN0ULnBco3MmvzWYRxAhVJgdBsAk5v8G3J8aYgd4WElio3g05hrVy2oAa0ptpC9_dvzqrUX2KoZZsAYt5Z-bd2Z5AWqUdYsnNsUlct5LZhC0FggC6CZTND9_mvrNZzEx508vJYRQWSggCz-uKqSz5cQ_q1nfs=s2048?key=FUBUSlMOtWwjjZfBDjfz-w",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "0ffe0f360f7d4cba9ab08387c43030aa9929419c0f61e4a51d2427becc54476e",
              "output_path": "minor-arcana/wands/final/eight-of-wands-v3.webp",
              "thumb_path": "minor-arcana/wands/thumbs/eight-of-wands-v3.webp"
            }
          ]
          END_ART_MANIFEST
          python tools/.agents/skills/github-pages-art-publish/scripts/transfer_art.py \
            --manifest /tmp/approved-art-manifest.json \
            --root live \
            --paths-file /tmp/approved-art-staging.bin
      - name: Commit only verified artwork to gh-pages
        shell: bash
        run: |
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -0 git -C live add -- </tmp/approved-art-staging.bin
          git -C live diff --cached --stat
          if git -C live diff --cached --quiet; then
            echo "No new artwork generated; verify requested version paths"
            exit 1
          fi
          git -C live commit -m "art: publish verified approved originals via reusable skill"
          git -C live push origin HEAD:gh-pages
          echo "BINARY_ARTWORK_COMMITTED_TO_LIVE_GH_PAGES"
