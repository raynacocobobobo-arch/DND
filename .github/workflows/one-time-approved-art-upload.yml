# TEMPLATE FILE — copy under .github/workflows/one-time-approved-art-upload.yml
# The manifest placeholder below must be replaced with actual signed
# Docs-image URLs and paths. Keep all JSON lines indented by 10 spaces.
# Delete the entire temporary workflow after a successful deploy.
name: Transfer Approved Artwork to Live Site
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-approved-art-upload.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-approved-art-publish
  cancel-in-progress: false
jobs:
  publish-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout reusable script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - name: Checkout actual Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: live
          persist-credentials: true
      - name: Install image library
        run: python -m pip install --quiet Pillow
      - name: Transfer real approved files and verify pixel identity
        shell: bash
        run: |
          cat >/tmp/approved-art-manifest.json <<'END_ART_MANIFEST'
          [
            {
              "name": "PENTACLES two Roman numeral verified",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztZnxFc0ec6ibxH8cHK_UkFU3ir510lGKscNULBZ1hAKR6B4xzt6lifPg7ZmVi_4qeehJGSCs4IU5FiuNQHrupXTPZuf4gMPUondZUNX9bzoKkW_HhxhY_KJzzr0bYZrv1Y_6ebYcnMLwVxPLeEQ2v_yM-DhghR0M7RChhkVDD44ysAH=s2048?key=MrqSxuR83NacFhm59Xmk3g",
              "expected_size": [
                942,
                1670
              ],
              "expected_pixel_sha256": "32eb43267a1aa140ff155088f9b368422f910904a5fcb911eb4d357e25f7ecf0",
              "output_path": "minor-arcana/pentacles/final/two-of-pentacles-v2.webp",
              "thumb_path": "minor-arcana/pentacles/thumbs/two-of-pentacles-v2.webp"
            },
            {
              "name": "PENTACLES three Roman numeral verified",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztazHKeNayjeZT6ey8-E3wmKfk77VRYw7NdxqYqkNOrcF93VO8yIXZ1RrA7T7csotJvv84bwK-39P12d40z9Udd1Cag7nm3mPw9bGVcoBY4C8AThvnO-oyuZ1sNTbIB7NjItlOQORUzEZQmtIl_kO3UWCar_Hiqnf0j3IvdXYviRYyVm8Eg=s2048?key=MrqSxuR83NacFhm59Xmk3g",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "42013e80d9593fc28c96dc3af23585201355e5562161d5d544a0dfb3132bb884",
              "output_path": "minor-arcana/pentacles/final/three-of-pentacles-v2.webp",
              "thumb_path": "minor-arcana/pentacles/thumbs/three-of-pentacles-v2.webp"
            },
            {
              "name": "PENTACLES four Roman numeral verified",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuzta-hatHivIJkQY6pP5JIVyRAUom2MDLFw8iApvQliy0bxrFw7l5gBabXn_o-gS-KakQwjYgkVjwa_bBSiq4rc-qMyqviCKDTmB-sWMytdMp15VpyBQDQZnGsTgZUV-fHlDYG-H9Pk9IQfBiDRss5OrYdlEXZQ4OBeczgm7uYBjDN3SQrCY=s2048?key=MrqSxuR83NacFhm59Xmk3g",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "a6729a213091b41fe0a02655e1236c0ec53fb8ef1e265538a532bf889a0524ff",
              "output_path": "minor-arcana/pentacles/final/four-of-pentacles-v2.webp",
              "thumb_path": "minor-arcana/pentacles/thumbs/four-of-pentacles-v2.webp"
            },
            {
              "name": "PENTACLES five Roman numeral verified",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztYFXir_PFJHhFFP8PFZbkcShIA2y8IdRmSM7KwtHswFs-ThGOw87I0rAmCKy3M3woWOsOSWSFcLV79qmMqOZD2VK1es_BAcYIoKy9LgeGdlhcMrwDiNDO16CokPFEW0BMrGAzwF6jOBgWa76h5S_jnikYHwO-5edLgnVcee_7Md-YdKp8E=s2048?key=MrqSxuR83NacFhm59Xmk3g",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "b7a0af60129a2ca3ff9f8cb6a9709e082f4bdf2dc549e960335a8d1c854b1c2a",
              "output_path": "minor-arcana/pentacles/final/five-of-pentacles-v2.webp",
              "thumb_path": "minor-arcana/pentacles/thumbs/five-of-pentacles-v2.webp"
            }
          ]
          END_ART_MANIFEST
          python tools/.agents/skills/github-pages-art-publish/scripts/transfer_art.py \
            --manifest /tmp/approved-art-manifest.json \
            --root live \
            --paths-file /tmp/approved-art-staging.bin
      - name: Commit only verified artwork to gh-pages
        shell: bash
        run: |
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -0 git -C live add -- </tmp/approved-art-staging.bin
          git -C live diff --cached --stat
          if git -C live diff --cached --quiet; then
            echo "No new artwork generated; verify requested version paths"
            exit 1
          fi
          git -C live commit -m "art: publish verified approved originals via reusable skill"
          git -C live push origin HEAD:gh-pages
          echo "BINARY_ARTWORK_COMMITTED_TO_LIVE_GH_PAGES"
