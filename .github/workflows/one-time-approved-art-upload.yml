# TEMPLATE FILE — copy under .github/workflows/one-time-approved-art-upload.yml
# The manifest placeholder below must be replaced with actual signed
# Docs-image URLs and paths. Keep all JSON lines indented by 10 spaces.
# Delete the entire temporary workflow after a successful deploy.
name: Transfer Approved Artwork to Live Site
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-approved-art-upload.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-approved-art-publish
  cancel-in-progress: false
jobs:
  publish-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout reusable script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - name: Checkout actual Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: live
          persist-credentials: true
      - name: Install image library
        run: python -m pip install --quiet Pillow
      - name: Transfer real approved files and verify pixel identity
        shell: bash
        run: |
          cat >/tmp/approved-art-manifest.json <<'END_ART_MANIFEST'
                    [
            {
              "name": "Cups page approved 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztYJQ2FCxq3GxdztIulyu5nYIVz5GgTbd3uQI7C9fGJpOespNsKVEQLbMdSPOD483r3C94w0UhdtIiP3AvmB-pmBb4w_lcmUF2_thhrIZ6fcSzA_4ksercuqVfnMzC0RMo0KYjrsxmGVVXvXO7Sfjia3dwSwPSEfZIdgV7578-bHdFfMH0g=s2048?key=PuyYB9znWXIW53oY59QDnA",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "3acea1ffc604eb6ffecadfa758eeae608310d7a0557baf2f7b7d24e694d6b8d0",
              "output_path": "minor-arcana/cups/final/page-of-cups-v4.webp",
              "thumb_path": "minor-arcana/cups/thumbs/page-of-cups-v4.webp"
            },
            {
              "name": "Cups queen approved 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztaiRPUpotASSJ3PHyHHYhWVYKky09z0eVoo9Sxblsd6XtCBn8Oci4h2SN_uv4hoieDt4X7_Ui3knrogLaBGhYU3hiWJ1q53EgSwwhem1dbBb3z4ihuqDEZjmH9BlH98omN5XJW51QWIaN7gSfRmgkcusjdfo7bQar9hCjX7eKXOTOg3=s2048?key=PuyYB9znWXIW53oY59QDnA",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "cd6de83c4405ecc36206271ae94ac18781475d8602fe2bf3dc5e42fe029ebe3e",
              "output_path": "minor-arcana/cups/final/queen-of-cups-v4.webp",
              "thumb_path": "minor-arcana/cups/thumbs/queen-of-cups-v4.webp"
            },
            {
              "name": "Cups king approved 2026-10-27",
              "source_url": "https://docs.google.com/docs-images-rt/ALKuztbVuqtjRQghbY4tvXvB2624XlghdYgPopIV2QYEocCJwFCMvXoZBJI7fMPl18Tb8Lr0pENSUpCxe9TI6M9cVCqUKvTRzpCKi9XiWlb6khdpHRGc8LYS4Piteh9C-vDrxzSCxZBhUEFo6VxeJ5MbDlnRmvmAZdOMId0qhvAekE9t45Lnnyc=s2048?key=PuyYB9znWXIW53oY59QDnA",
              "expected_size": [
                941,
                1672
              ],
              "expected_pixel_sha256": "82aac6d467772b049e2b1bdf5785a6522d6353807b0de27c1fd1fb898761001d",
              "output_path": "minor-arcana/cups/final/king-of-cups-v4.webp",
              "thumb_path": "minor-arcana/cups/thumbs/king-of-cups-v4.webp"
            }
          ]
          END_ART_MANIFEST
          python tools/.agents/skills/github-pages-art-publish/scripts/transfer_art.py \
            --manifest /tmp/approved-art-manifest.json \
            --root live \
            --paths-file /tmp/approved-art-staging.bin
      - name: Commit only verified artwork to gh-pages
        shell: bash
        run: |
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -0 git -C live add -- </tmp/approved-art-staging.bin
          git -C live diff --cached --stat
          if git -C live diff --cached --quiet; then
            echo "No new artwork generated; verify requested version paths"
            exit 1
          fi
          git -C live commit -m "art: publish verified approved originals via reusable skill"
          git -C live push origin HEAD:gh-pages
          echo "BINARY_ARTWORK_COMMITTED_TO_LIVE_GH_PAGES"
