      - name: Denoise original Swords Three conservatively and retain untouched v1
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageDraw
          from pathlib import Path
          import hashlib
          root=Path('live/minor-arcana/swords')
          src=root/'final/three-of-swords-v1.webp'
          output=root/'final/three-of-swords-v2.webp'
          thumb=root/'thumbs/three-of-swords-v2.webp'
          if output.exists() or thumb.exists():
              raise FileExistsError('Must not overwrite existing Swords Three artwork')
          with Image.open(src) as img:
              img.load()
              orig=img.convert('RGB')
          if orig.size!=(941,1672):
              raise ValueError(f'Unexpected original dimensions {orig.size}')
          med=orig.filter(ImageFilter.MedianFilter(size=3))
          filtered=Image.blend(orig,med,0.78).filter(ImageFilter.GaussianBlur(0.19))
          mask=Image.new('L',orig.size,0)
          dr=ImageDraw.Draw(mask)
          dr.rounded_rectangle((40,106,900,1410),radius=42,fill=255)
          mask=mask.filter(ImageFilter.GaussianBlur(10))
          clean=Image.composite(filtered,orig,mask)
          clean.save(output,'WEBP',lossless=True,method=5)
          with Image.open(output) as check:
              check.load()
              assert check.size==orig.size and check.convert('RGB').tobytes()==clean.tobytes()
          p=clean.copy()
          p.thumbnail((360,640),Image.Resampling.LANCZOS)
          p.save(thumb,'WEBP',quality=91,method=5)
          with open('/tmp/approved-art-staging.bin','ab') as f:
              for path in [output,thumb]:
                  f.write(str(path.relative_to('live')).encode()+bytes([0]))
          print('SWORDS_THREE_DENOISED_V2 '+hashlib.sha256(clean.tobytes()).hexdigest(), flush=True)
          PY
      - name: Commit only verified artwork to gh-pages
        shell: bash
        run: |
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -0 git -C live add -- </tmp/approved-art-staging.bin
          git -C live diff --cached --stat
          if git -C live diff --cached --quiet; then
            echo "No new artwork generated; verify requested version paths"
            exit 1
          fi
          git -C live commit -m "art: publish verified approved originals via reusable skill"
          git -C live push origin HEAD:gh-pages
          echo "BINARY_ARTWORK_COMMITTED_TO_LIVE_GH_PAGES"
