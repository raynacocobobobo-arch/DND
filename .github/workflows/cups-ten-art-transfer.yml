name: Transfer 10 Approved Cups Illustrations
on:
  push:
    branches: [main]
    paths: [".github/workflows/cups-ten-art-transfer.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cups-ten-hd-art-upload
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - run: python -m pip install --quiet pillow
      - name: Fetch 10 approved original paintings and encode lossless WebP
        shell: bash
        run: |
          cat >/tmp/cups-manifest.json <<'CUPS_MANIFEST_END'
          [
            {
              "slug": "ace",
              "url": "https://docs.google.com/docs-images-rt/ALKuztbzpR67tV-NlDTD-8Er4MYRtiaqc5A4vtqOsrkp4HjaHT-mv0Ls-NZUw-ldC-QTP15wP9hXN3Y3KGfDy1Qcq5uL0uSEykzsKhpNXFhYVKrUjfCVPnD-Zz8RsdU246i_PNbqHzrmO2BJd3j-lB7V5Cn-9JJBGw84nY4bQdYa-nIrs8mX=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "two",
              "url": "https://docs.google.com/docs-images-rt/ALKuztbkcQNSZP9uPXAxrcqoMKHsqW2xzvsB0tQ1t7MTv4EjPQ1MySblukCfnGRu6Op4iLHfFutkcahztIQ_HnUAKsZYh0hDS9UopNo_-lgeLxPHfattcXxegTQ4QsR9nKo1xuMjUx7thZT2z1_mR-pdxKhJP0VW8E2Qv_Acc-HPlaisHNIQ=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "three",
              "url": "https://docs.google.com/docs-images-rt/ALKuztYeTKldZgcSX3mpx63W9UoyayNYqjiS5aSR41Xc5Q_Mkfly9qB1XbGW78OdLEMp5F4xFZ0rs-HN3urvgh0NsMhgN6XPmmjHUxI1rz8bglN5HQ9pYrr9d8s3fhjqDg8S2ureFGTQO4M8-lAzhNmtReG6f2xiEzZFABGbRWaICKTlUisD=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "four",
              "url": "https://docs.google.com/docs-images-rt/ALKuztYIsrT0A5ikHJ5EZ4vZC8XFXZXTSfYv_-nQ4hN5CCObmg4iGv73d79HJKespj5cL9nUPRnPFqn3q_TsR25bny4mHsG1d4seOV14Symjn7bG6lDJYWfNKCRsAWZXXqc7J0MP2wAHIiWO1ytQJVfe2ANk2j0OH9Y4jcTmo8H-XKBhQtpMQJI=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "six",
              "url": "https://docs.google.com/docs-images-rt/ALKuztb3bck1LrjEEBzzbtLyaByEIVdLOUsg7HubMGcWrDJ6aiZetkRd1X8lslUV8EUeFxto7wqJf1QLVF_Zopiop1JHcVNMmyMZ9Bvwb4Jxr5AQ2OGmrOclAg2a_XitUuSuDWTS0VW5bt9t1akJqHl4pPr_MG_Z9WaP7jtOH4HXKGHcTulnnzI=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "seven",
              "url": "https://docs.google.com/docs-images-rt/ALKuztYqpsLOjt9V9DB8K85tlBeVjn2zZJrF4NHjrrz1H-J4et3m1UUfSA5WZKHZN_I-8C_3OQWia76TRe128nQCzjbfYKC_OLHrhieR7n6CYwxCoIbhCYbtNGrAayMwO6bJvDhK5dGiXTvNR_clWP9uOxgKPvS5GAm8V9HVUzx1UIjPXdEKmHM=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "eight",
              "url": "https://docs.google.com/docs-images-rt/ALKuztaGANccyY8T8kWr6S5mbNhCkhALnyi8Tj4aenbSO2mOAXxhiH7-C-45JwvrkygW11clRbyFLeWmsaKLMvas3Gsc935fM89fABxyp3mBiPB_VaYov-3vnyFTcr0eaiNQxpza-K7bGAGODtu0ZzzlzzdVzg-9Zi-PkrH-OtDHmItF7yxv=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "nine",
              "url": "https://docs.google.com/docs-images-rt/ALKuztbRfPeopubnhOKT6vb6SzDL_0oqg6US7gYoqs403VQXAcQdvBNLAyqfHo0zActEyPqb8bBFQ9Dcbrj3XeVRdC9pPnWiliuOC3wrUhr_oXAwjEahlvjhflQ2bEQxnT2PoJHR2y3xpHOzjLT5FlgLO50-BzMtBvZTL-5d9F6k_e1oK7IHP6c=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "ten",
              "url": "https://docs.google.com/docs-images-rt/ALKuztbuK_QoE0m64X0sQjBWr3yKQa3M3X-PrT-tmAbOQrCZFz8HBwxcjGJqK9scHNcwjTzxCYjSEZ4OLfLVB01RdGjyo-S29YE0JcoTACU-sgKhRi8bYSmTQa07eRCFEhvmoB2m1wdh8ldaVrJlndqyUqs3mEHAOtP5S3g5iCC5QKnjcAKCfjg=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            },
            {
              "slug": "page",
              "url": "https://docs.google.com/docs-images-rt/ALKuztam9tx38ZyqClGv-PvTxwCmpSTdlqq4t08rans0Imvmbo-z0s2Lp4giFTv1Z_R-rRyLpO38_GkuDyuq86BDvdfog-LlQwfRUnlDtPk3RHv-zLKMLwqsF8ITXau0eltPm6d62BqTR5Keo76iaF9r7BRE7dKuMHgvPJ3D-4MhOULNcu6B8_w=s2048?key=2zHo4wMRfoqPi69KKNP7Lg"
            }
          ]
          CUPS_MANIFEST_END
          cat >/tmp/cups_transfer.py <<'PYTHON_END'
          import os,io,hashlib,json,time,urllib.request
          from PIL import Image
          from concurrent.futures import ThreadPoolExecutor,as_completed
          entries=json.load(open('/tmp/cups-manifest.json'))
          assert len(entries)==10 and len({e['slug'] for e in entries})==10
          os.makedirs('minor-arcana/cups/final',exist_ok=True)
          os.makedirs('minor-arcana/cups/thumbs',exist_ok=True)
          def transfer(entry):
              slug,url=entry['slug'],entry['url']
              last=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'CupsTarotArtTransfer/1.0'})
                      with urllib.request.urlopen(req,timeout=75) as response:
                          raw=response.read()
                      if len(raw)<200_000:raise ValueError('source too small')
                      with Image.open(io.BytesIO(raw)) as source:
                          source.load()
                          rgb=source.convert('RGB')
                      if rgb.size!=(941,1672):raise ValueError(f'Wrong dimensions {slug}: {rgb.size}')
                      path=f'minor-arcana/cups/final/{slug}-of-cups-v1.webp'
                      rgb.save(path,'WEBP',lossless=True,method=5)
                      with Image.open(path) as check:
                          check.load()
                          assert check.size==rgb.size and check.format=='WEBP'
                          assert check.convert('RGB').tobytes()==rgb.tobytes(),slug+' pixel mismatch'
                      thumb=rgb.copy();thumb.thumbnail((360,640),Image.Resampling.LANCZOS)
                      tpath=f'minor-arcana/cups/thumbs/{slug}-of-cups.webp'
                      thumb.save(tpath,'WEBP',quality=89,method=5)
                      return {'slug':slug,'path':path,'thumbnail':tpath,'width':rgb.width,'height':rgb.height,'bytes':os.path.getsize(path),'sha256':hashlib.sha256(open(path,'rb').read()).hexdigest()}
                  except Exception as error:
                      last=error;time.sleep(attempt*2+1)
              raise RuntimeError('Unable to transfer '+slug+': '+repr(last))
          with ThreadPoolExecutor(max_workers=4) as pool:
              fs=[pool.submit(transfer,e) for e in entries]
              output=[]
              for f in as_completed(fs):
                  r=f.result();output.append(r)
                  print('CUPS_ART_VERIFIED',r['slug'],r['width'],r['height'],r['bytes'],flush=True)
          assert len(output)==10 and len({r['sha256'] for r in output})==10
          output.sort(key=lambda x:[e['slug'] for e in entries].index(x['slug']))
          with open('minor-arcana/cups/final/verified-upload-v1.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print('ALL_10_USER_APPROVED_CUPS_ARTWORKS_VERIFIED',flush=True)
          PYTHON_END
          python /tmp/cups_transfer.py
      - name: Publish binary artwork and thumbnails to gh-pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minor-arcana/cups/final minor-arcana/cups/thumbs
          git diff --cached --stat
          git diff --cached --quiet && { echo "No new binaries"; exit 0; }
          git commit -m "art(cups): add 10 user-approved HD cards and thumbnails"
          git push origin HEAD:gh-pages
