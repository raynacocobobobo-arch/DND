name: Publish Corrected Cups Five Six and Verify Court Cards
on:
  push:
    branches: [main]
    paths: [".github/workflows/cups-count-corrections.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cups-count-corrections
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: python -m pip install --quiet Pillow
      - name: Transfer four verified originals
        shell: bash
        run: |
          cat >/tmp/urls.json <<'CUPS_INPUTS'
          [
            {
              "slug": "five",
              "url": "https://docs.google.com/docs-images-rt/ALKuztaCEK2LNpgtolAZs9HABTSPXFPFBD-lrYu-gYeUSyqiWd5aV7cLN1Cg1iLoOITV_Aw26-FldCWHBjLZt8Qi7QJSrMlJ45PT9mz3EFu4J8hOmCqS2kAOn4F4Bt40GoPobqPTTNOOLYSOFS7lFnm0kA_qYYhZMbj-PPKwrKhRSsulreqHJSE=s2048?key=T73xUcIBNvn1I4j2fIF4xQ"
            },
            {
              "slug": "six",
              "url": "https://docs.google.com/docs-images-rt/ALKuztYIvq_BUBZlAkz4yGRzHB_C2PP67d_WVeZkewv5WnookZWkM18dk9aSNkFa8YXwwYIr88zUDo9_yv-_fCAKMADOxoLEXGddh7PA6rw3l8UB9yiWdoOlDWd5a2dn-O_Zijdc81GnXtkIfYy3c_dCjOrQAYyJz-gzVOSGNg084NxlrZI63do=s2048?key=T73xUcIBNvn1I4j2fIF4xQ"
            },
            {
              "slug": "knight",
              "url": "https://docs.google.com/docs-images-rt/ALKuztay2EAD-z8Lu-2-8yZP24FcMiNzsbYla2iRSgi9WyQa6BoOERa5mxPIUK_FJl3Vpso6HFJdpxdd3-hTbkHlz27ckb8ROyF5hXnZGQ4t1C24uArHKcNcZd7R1fZXW-UMvejTi8hYkwpxvfn1BbbAuss3LzPM-9lWfWvsRP93nsz_A_xZ7Qg=s2048?key=T73xUcIBNvn1I4j2fIF4xQ"
            },
            {
              "slug": "queen",
              "url": "https://docs.google.com/docs-images-rt/ALKuztbRHFhlnQB95w7e_XrtVoWqPplTtDQq-_lMT2Q8ph_2HqPO1CURsisutXEIMClKjRGR8Y7_jmITyrmL0EKegpdXHJCBbtIi8sQYXF2CO9TRdU1nLA959qQePA109O84igLAqhoBFr1tOzcu-l_Alcff6UjPv2jIZZJwwmga8jSNS1uhL_c=s2048?key=T73xUcIBNvn1I4j2fIF4xQ"
            }
          ]
          CUPS_INPUTS
          cat >/tmp/upload.py <<'PY'
          import io,os,json,time,urllib.request,hashlib
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from PIL import Image
          art=json.load(open('/tmp/urls.json'))
          assert set(e['slug'] for e in art)=={'five','six','knight','queen'}
          os.makedirs('minor-arcana/cups/final',exist_ok=True)
          os.makedirs('minor-arcana/cups/thumbs',exist_ok=True)
          def f(e):
            last=None
            for attempt in range(4):
              try:
                r=urllib.request.Request(e['url'],headers={'User-Agent':'TarotImageRepository/2'})
                with urllib.request.urlopen(r,timeout=65) as h:raw=h.read()
                with Image.open(io.BytesIO(raw)) as im:
                  im.load();im=im.convert('RGB')
                assert im.size==(941,1672),(e['slug'],im.size)
                slug=e['slug']
                version='v2' if slug in ('five','six') else 'v1'
                path=f'minor-arcana/cups/final/{slug}-of-cups-{version}.webp'
                im.save(path,'WEBP',lossless=True,method=5)
                with Image.open(path) as check:
                  check.load();assert check.format=='WEBP' and check.size==(941,1672)
                  assert check.convert('RGB').tobytes()==im.tobytes(), slug
                thumb=im.copy();thumb.thumbnail((360,640),Image.Resampling.LANCZOS)
                tpath=f'minor-arcana/cups/thumbs/{slug}-of-cups.webp'
                thumb.save(tpath,'WEBP',quality=88,method=5)
                return dict(slug=slug,version=version,path=path,size=list(im.size),bytes=os.path.getsize(path),sha256=hashlib.sha256(open(path,'rb').read()).hexdigest())
              except Exception as exc:
                last=exc;time.sleep(attempt*3+1)
            raise RuntimeError(e['slug']+':'+repr(last))
          with ThreadPoolExecutor(max_workers=4) as pool:
            jobs=[pool.submit(f,e) for e in art]
            done=[j.result() for j in as_completed(jobs)]
          assert len(done)==4 and len({x['sha256'] for x in done})==4
          for r in sorted(done,key=lambda x:x['slug']):print('NEW_UPLOAD_OK',r['slug'],r['version'],r['bytes'],r['sha256'][:18],flush=True)
          with open('minor-arcana/cups/final/corrected-20261026-manifest.json','w') as manifest:json.dump(done,manifest,indent=2)
          PY
          python /tmp/upload.py
      - name: Commit actual corrected images to live branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minor-arcana/cups/final minor-arcana/cups/thumbs
          git diff --cached --stat
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "art(cups): correct Cups Five and Six; verify Knight and Queen originals"
          git push origin HEAD:gh-pages
