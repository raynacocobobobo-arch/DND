name: HermesTodo checks

on:
  pull_request:
    paths:
      - "HermesTodo/**"
      - ".github/workflows/hermestodo-ci.yml"
  push:
    branches: [main]
    paths:
      - "HermesTodo/**"
      - ".github/workflows/hermestodo-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HermesTodo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: HermesTodo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
