name: Lighthouse V24 fishman human day night character QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v24-*.js'
      - 'lighthouse/v24-preview.html'
      - '.github/workflows/lighthouse-v24-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v24
          npm --prefix /tmp/lighthouse-v24 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v24/node_modules/.bin/playwright install chromium
      - name: Test low-poly character model, scale, location and day/night morph
        env:
          NODE_PATH: /tmp/lighthouse-v24/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/v24-server.log 2>&1 &
          mkdir -p lighthouse/v24-qa-output
          cat >/tmp/lighthouse-v24/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v24-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const api=()=>page.evaluate(()=>window.__lighthouseNightEvents.getVisitor());
           const night=await api();
           await page.screenshot({path:'lighthouse/v24-qa-output/night-fishman-default.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.focusVisitorForTest());
           await page.waitForTimeout(400);
           await page.screenshot({path:'lighthouse/v24-qa-output/night-fishman-closeup.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.resetCameraForTest());
           await page.locator('#mode-day').click();
           const mid=await page.evaluate(()=>window.__lighthouseNightEvents.advanceVisitorTransitionForTest(1.3));
           await page.screenshot({path:'lighthouse/v24-qa-output/transform-middle.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.advanceVisitorTransitionForTest(1.7));
           const day=await api();
           await page.screenshot({path:'lighthouse/v24-qa-output/day-human-default.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.focusVisitorForTest());
           await page.waitForTimeout(400);
           await page.screenshot({path:'lighthouse/v24-qa-output/day-human-closeup.png'});
           await page.evaluate(()=>window.__lighthouseNightEvents.resetCameraForTest());
           await page.locator('#mode-night').click();
           await page.evaluate(()=>window.__lighthouseNightEvents.advanceVisitorTransitionForTest(3.0));
           const afterNight=await api();
           await page.screenshot({path:'lighthouse/v24-qa-output/back-to-fishman.png'});
           const sceneData=await page.evaluate(()=>({
            version:document.body.dataset.version,geometry:document.body.dataset.geometryAudit,
            vectorSea:document.body.dataset.vectorSea,sideWalls:document.body.dataset.waterSidewallCount,
            topview:!!document.querySelector('#topview'),
            gulls:window.__lighthouseNightEvents.getGulls(),
            kraken:window.__lighthouseNightEvents.getState()
           }));
           // Verify the original night events work after adding the NPC.
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const launched=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
           const ship=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const combo=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1));
           await page.screenshot({path:'lighthouse/v24-qa-output/night-visitor-kraken-pirate.png'});
           const good=sceneData.version==='v24a'&&sceneData.geometry==='pass'&&
             sceneData.vectorSea==='true'&&sceneData.sideWalls==='4'&&!sceneData.topview&&
             night.form==='fishman'&&night.fishFinsVisible&&night.sharedBody&&
             day.form==='human'&&!day.fishFinsVisible&&day.humanScale>.999&&
             afterNight.form==='fishman'&&afterNight.fishScale>.999&&
             mid.form==='morphing'&&mid.humanScale>.01&&mid.fishScale>.01&&
             night.belowDoor&&Math.abs(night.doorHeight-.72)<.001&&
             night.height>=.63&&night.height<.72&&
             night.doorDistance>1&&night.doorDistance<2.1&&
             night.fireDistance>1.5&&night.fireDistance<2.3&&
             Math.abs(night.position.x-day.position.x)<.001&&
             Math.abs(night.position.z-day.position.z)<.001&&
             sceneData.gulls.gullScaleFactor===.7&&
             sceneData.kraken.positions.length===8&&launched&&arms.activeCount===5&&ship&&combo.concurrent&&
             errors.length===0;
           console.log('V24_QA_RESULT',JSON.stringify({night,mid,day,afterNight,good,errors}));
           await browser.close();
           if(!good)throw Error('V24 visitor model QA failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v24/test.cjs
      - name: Upload character screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v24-visitor-screenshots
          path: lighthouse/v24-qa-output/
          if-no-files-found: warn
