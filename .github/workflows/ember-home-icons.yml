name: Generate Severed Ember home-screen icons
on:
  push:
    branches: [gh-pages]
    paths:
      - 'scripts/build_ember_home_icons.py'
      - '.github/workflows/ember-home-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: severed-ember-home-icons
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Generate and verify approved-crest PNG icons
        run: python scripts/build_ember_home_icons.py
      - name: Commit generated icons to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add severed-ember/assets/branding/ember-home-icon-*-20261117.png
          if git diff --cached --quiet; then
            echo "Icons already up to date"
            exit 0
          fi
          git commit -m "Publish approved chapter crest as iOS and Android home-screen icons"
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then
              echo "Published home-screen icons"
              exit 0
            fi
            sleep 3
          done
          echo "Unable to push home-screen icons" >&2
          exit 1
