name: Tarot editorial visual and content QA
on:
  push:
    branches: [main]
    paths: [".github/workflows/tarot-editorial-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser test packages
        run: python -m pip install --quiet selenium requests
      - name: Test published art size, stories, detail modal, mobile and spreads
        shell: bash
        run: |
          cat > /tmp/qa.py <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://raynacocobobobo-arch.github.io/DND/?editorial=20261026'
          opts=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1400,970']:opts.add_argument(arg)
          b=webdriver.Chrome(options=opts)
          b.set_script_timeout(50)
          try:
              for attempt in range(30):
                  b.get(base+'&poll='+str(attempt))
                  try:
                      WebDriverWait(b,5).until(lambda x:x.execute_script("return typeof window.ARCANA_DEPTH!=='undefined' && window.ARCANA_DEPTH.length===22 && document.querySelector('#grid .card .card-line')!==null"))
                      break
                  except Exception:
                      time.sleep(6)
              else:
                  raise RuntimeError('Editorial V2 script not yet visible on GitHub Pages')
              count=b.execute_script("return document.querySelectorAll('#grid .card').length")
              assert count==22,count
              assert b.execute_script("return window.ARCANA_DEPTH.every(c=>c.scene.length>50 && c.canon.length>30 && c.up.length>30 && c.rev.length>30)")
              cols=b.execute_script("return getComputedStyle(document.querySelector('#grid')).gridTemplateColumns.split(' ').length")
              width=b.execute_script("return document.querySelector('#grid .card').getBoundingClientRect().width")
              assert cols==4,(cols,width)
              assert width>=230,width
              print('DESKTOP LARGE CARDS:',cols,width,flush=True)

              b.execute_script("document.querySelector('#grid .card').click()")
              WebDriverWait(b,10).until(lambda x:x.find_element(By.ID,'modal').get_attribute('class').find('open')>=0)
              paragraph_text=b.find_element(By.ID,'detailText').text
              assert len(paragraph_text)>300, len(paragraph_text)
              for title in ['牌面的故事','这幅画在讲什么','正位 · 启示','逆位 · 阴影','原著中的线索','留给你的问题']:
                  assert title in paragraph_text,title
              img_size=b.execute_async_script("""
                 const done=arguments[0],im=document.getElementById('detailImg');
                 im.decode().then(()=>done([im.naturalWidth,im.naturalHeight])).catch(()=>done([0,0]));
              """)
              assert img_size==[864,1536],img_size
              img_h=b.execute_script("return document.getElementById('detailImg').getBoundingClientRect().height")
              assert img_h>600,img_h
              print('DETAIL full visual + six detailed chapters + real 864x1536 image:',img_h,flush=True)
              b.execute_script("document.getElementById('nextArcana').click()")
              assert '魔术师' in b.find_element(By.ID,'detailText').text
              b.execute_script("document.querySelector('#close').click()")
              assert 'open' not in b.find_element(By.ID,'modal').get_attribute('class')

              b.execute_script("document.querySelector('#drawBtn').click()")
              WebDriverWait(b,8).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.result-card img'))==1)
              assert '牌面叙事：' in b.find_element(By.ID,'result').text
              print('SINGLE SPREAD DEEP READING passed',flush=True)
              b.execute_script("document.querySelector('#modes button[data-n=\"3\"]').click();document.querySelector('#drawBtn').click()")
              assert len(b.find_elements(By.CSS_SELECTOR,'.result-card img'))==3
              assert '过去 · 事情的来路' in b.find_element(By.ID,'result').text
              print('THREE SPREAD DEEP READING passed',flush=True)
              b.set_window_size(390,844)
              time.sleep(1)
              mcols=b.execute_script("return getComputedStyle(document.querySelector('#grid')).gridTemplateColumns.split(' ').length")
              assert mcols==2,mcols
              b.execute_script("document.querySelector('#grid .card').click()")
              mim=b.execute_script("return document.getElementById('detailImg').getBoundingClientRect().width")
              assert mim>=260,mim
              print('MOBILE IMAGE-FIRST DETAIL',mcols,mim,flush=True)
              print('EDITORIAL_V2_FULL_BROWSER_PASS',flush=True)
          finally:
              b.quit()
          PY
          python /tmp/qa.py
