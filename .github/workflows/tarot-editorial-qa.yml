name: Tarot multi-screen UX QA
on:
  push:
    branches: [main]
    paths: [".github/workflows/tarot-editorial-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Install Selenium
        run: python -m pip install --quiet selenium requests
      - name: Validate true page routing, card sizes, complete lore and draw UI
        run: |
          cat >/tmp/qa.py <<'PY'
          import time,requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://raynacocobobobo-arch.github.io/DND/'
          opt=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1380,920']:
              opt.add_argument(arg)
          b=webdriver.Chrome(options=opt)
          b.set_script_timeout(50)
          try:
              for n in range(30):
                  b.get(base+'?v=v3-multipage-'+str(n)+'#/home')
                  try:
                      WebDriverWait(b,4).until(lambda d:d.find_element(By.CSS_SELECTOR,'.home-visual img').is_displayed())
                      break
                  except Exception: time.sleep(5)
              else: raise Exception('V3 not yet published')
              assert len(b.find_elements(By.CSS_SELECTOR,'.library-card'))==0
              assert len(b.find_elements(By.CSS_SELECTOR,'.draw-controls'))==0
              print('HOME_ONLY no wall of cards PASS',flush=True)
              img=b.find_element(By.CSS_SELECTOR,'.home-visual img')
              img_size=b.execute_async_script("""
                const done=arguments[0],im=document.querySelector('.home-visual img');
                im.decode().then(()=>done([im.naturalWidth,im.naturalHeight])).catch(e=>done([0,0]));
              """)
              assert img_size==[864,1536],img_size
              assert img.size['height']>=550,img.size
              print('HOME_ART_DOMINANT',img.size,flush=True)
              b.get(base+'?v=v3#/library/1')
              WebDriverWait(b,10).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==6)
              assert len(b.find_elements(By.CSS_SELECTOR,'.detail-layout'))==0
              print('PAGINATED_LIBRARY_6_ONLY PASS',flush=True)
              b.get(base+'?v=v3#/library/4')
              WebDriverWait(b,10).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==4)
              print('LIBRARY_LAST_PAGE_4 PASS',flush=True)
              b.get(base+'?v=v3#/card/0')
              WebDriverWait(b,10).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1)
              assert len(b.find_elements(By.CSS_SELECTOR,'.library-card'))==0
              assert len(b.find_elements(By.CSS_SELECTOR,'.chapter'))==7
              assert '牌面的故事' in b.find_element(By.CSS_SELECTOR,'.detail-copy').text
              assert len(b.find_element(By.CSS_SELECTOR,'.detail-copy').text)>650
              detail_img=b.find_element(By.CSS_SELECTOR,'.detail-art img')
              dims=b.execute_async_script("""
                const done=arguments[0],im=document.querySelector('.detail-art img');
                im.decode().then(()=>done([im.naturalWidth,im.naturalHeight])).catch(e=>done([0,0]));
              """)
              assert dims==[864,1536],dims
              assert detail_img.size['height']>=540,detail_img.size
              print('DEDICATED_CARD_PAGE HD_IMAGE 7_CHAPTERS',detail_img.size,flush=True)
              b.get(base+'?v=v3#/card/21')
              WebDriverWait(b,8).until(lambda d:'世界' in d.find_element(By.CSS_SELECTOR,'.detail-copy h1').text)
              print('DIRECT_CARD_21_REFRESH PASS',flush=True)
              b.get(base+'?v=v3#/draw')
              WebDriverWait(b,8).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.draw-controls'))==1)
              assert len(b.find_elements(By.CSS_SELECTOR,'.library-card'))==0
              b.execute_script("document.querySelector('#go-draw').click()")
              assert len(b.find_elements(By.CSS_SELECTOR,'.drawn-card'))==1
              assert '牌面故事' in b.find_element(By.CSS_SELECTOR,'.reading-sections').text
              print('SINGLE_DRAW PASS',flush=True)
              b.execute_script("document.querySelector('.spread-select button[data-n=\"3\"]').click();document.querySelector('#go-draw').click()")
              assert len(b.find_elements(By.CSS_SELECTOR,'.drawn-card'))==3
              print('TRIPLE_DRAW PASS',flush=True)
              b.set_window_size(390,844)
              b.get(base+'?v=v3#/card/3')
              WebDriverWait(b,8).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.detail-art img'))==1)
              dim=b.execute_script("return [document.documentElement.scrollWidth,window.innerWidth,document.querySelector('.detail-art img').getBoundingClientRect().width]")
              assert dim[0]<=dim[1]+2,dim
              assert dim[2]>=230,dim
              print('MOBILE_IMAGE_DOMINANT no-horizontal-overflow',dim,flush=True)
              print('ALL_MULTIPAGE_TESTS_PASSED',flush=True)
          finally: b.quit()
          PY
          python /tmp/qa.py
