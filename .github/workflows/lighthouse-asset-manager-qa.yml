name: Lighthouse asset manager safe browser smoke
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse-editor/assets.html'
      - 'lighthouse-editor/index.html'
      - 'lighthouse-editor/editor-desktop-v530.js'
      - 'lighthouse-editor/github-delete-request.js'
      - 'lighthouse-editor/assets/palms/manifest.json'
      - 'lighthouse-editor/asset-manager-page.js'
      - 'lighthouse-editor/asset-preview-frame.html'
      - 'lighthouse-editor/editor-storage.js'
      - 'lighthouse-editor/assets/pirates/manifest.json'
      - 'lighthouse-editor/assets/cliffy-coast/asset-manager-index.json'
      - '.github/workflows/lighthouse-asset-manager-qa.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --prefix /tmp/lighthouse-asset-qa --no-fund --no-audit playwright@1.56.1
          /tmp/lighthouse-asset-qa/node_modules/.bin/playwright install chromium
      - name: Verify standalone manager without repository mutation
        env:
          NODE_PATH: /tmp/lighthouse-asset-qa/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-asset-web.log 2>&1 &
          cat > /tmp/lighthouse-asset-qa/test.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),assert=require('node:assert/strict');
          const ROOT='lighthouse-editor/assets/';
          const tree=[];
          for(const dir of ['pirates','cliffy-coast','palms']){
            for(const f of fs.readdirSync(ROOT+dir)){
              if(!f.endsWith('.glb')&&!f.endsWith('.glbpack.gz'))continue;
              tree.push({path:ROOT+dir+'/'+f,type:'blob',size:fs.statSync(ROOT+dir+'/'+f).size});
            }
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            const page=await browser.newPage({viewport:{width:1366,height:820}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.route('**/git/trees/gh-pages?recursive=1',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({tree,truncated:false})}));
            let contentsCalls=0;
            await page.route('**/contents/lighthouse/editor-preview-map.json?ref=gh-pages',r=>{
              contentsCalls++;
              return r.fulfill({status:403,contentType:'application/json',body:'{"message":"API rate limit exceeded"}'});
            });
            await page.goto('http://127.0.0.1:8765/lighthouse-editor/assets.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#total')?.textContent.includes('655'),{timeout:35000});
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent.includes('已显示'),{timeout:30000});
            assert.equal(await page.locator('article.asset').count(),655);
            assert.equal(await page.locator('#token').count(),0,'No token field in public GitHub Pages');
            assert.equal(await page.locator('#delete-selected').isDisabled(),true,'Nothing selected yet');
            await page.locator('article.asset .select-item').first().check();
            assert.equal(await page.locator('#delete-selected').isDisabled(),false,'Selection should be deletable without PAT');
            await page.locator('#clear-selection').click();
            // Intercept the prefilled GitHub issue URL; do not submit an issue.
            await page.evaluate(()=>{
              HTMLAnchorElement.prototype.click=function(){window.__githubDeleteUrl=this.href;};
            });
            page.on('dialog',d=>d.accept());
            await page.locator('article.asset .remove-one').first().click();
            const request=await page.evaluate(()=>window.__githubDeleteUrl);
            assert.ok(request?.startsWith('https://github.com/raynacocobobobo-arch/DND/issues/new?'));
            assert.ok(decodeURIComponent(request).includes('DND_ASSET_DELETE_V1'));
            assert.ok(decodeURIComponent(request).includes('pirates_'));
            assert.equal(await page.locator('#token').count(),0);
            await page.fill('#search','Parrot');
            assert.ok((await page.locator('article.asset').count())>=1);
            await page.fill('#search','');
            assert.equal(await page.locator('article.asset').count(),655);
            assert.ok(fs.readFileSync('lighthouse-editor/index.html','utf8').includes('href="./assets.html'));
            assert.ok((await page.locator('#status').textContent()).includes('GitHub 删除确认页'),'Delete action should open the owner confirmation request');
            assert.equal(contentsCalls,0,'Anonymous dependency checks must not call GitHub Contents API');
            assert.ok((await page.locator('#available').textContent()).includes('可永久删除'));
            assert.ok(!errors.length,errors.join('\n'));
            console.log('ASSET_MANAGER_QA PASS: 403 Contents API bypassed and 655 indexed entries readable');
            const editor=await browser.newPage({viewport:{width:1440,height:900}});
            const editorErrors=[];editor.on('pageerror',e=>editorErrors.push(e.message));
            await editor.goto('http://127.0.0.1:8765/lighthouse-editor/',{waitUntil:'domcontentloaded'});
            await editor.waitForFunction(()=>document.body.dataset.editorReady==='true',{timeout:115000});
            const blank=await editor.evaluate(()=>{
              const e=window.__lighthouseEditor,w=e.exportMap();
              return {objects:w.objects.length,types:w.types.every(t=>t==='water'),
                heights:w.heights.every(h=>h===-3),regions:w.regions?.length||0,
                original:e.getState().originalIslandVisible,resume:!!document.getElementById('resume-last')};
            });
            assert.equal(blank.objects,0);
            assert.equal(blank.types,true);
            assert.equal(blank.heights,true);
            assert.equal(blank.regions,0);
            assert.equal(blank.original,false);
            assert.equal(blank.resume,true);
            assert.equal(await editor.locator('#toggle-original').count(),0,'Original island control must be removed');
            assert.equal(await editor.evaluate(()=>window.__lighthouseEditor.getState().nativeObjectCount),0,
              'Native original game scene must not be built');
            assert.ok(!editorErrors.length,editorErrors.join('\n'));
            console.log('BLANK_OCEAN_QA PASS',JSON.stringify(blank));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-asset-qa/test.cjs
