name: Tarot Cups 14 Gallery and Approved Draw QA
on:
  push:
    branches: [main]
    paths: [".github/workflows/cups14-gallery-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install browser test dependencies
        run: python -m pip install --quiet selenium requests Pillow
      - name: Validate original art assets, navigation and approved draw
        shell: bash
        run: |
          cat >/tmp/cups14_qa.py <<'PY'
          import time,io,requests
          from PIL import Image
          from concurrent.futures import ThreadPoolExecutor
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://raynacocobobobo-arch.github.io/DND/'
          cups=base+'minor-arcana/cups/'
          order=['ace','two','three','four','five','six','seven','eight','nine','ten','page','knight','queen','king']
          for i in range(40):
              main=requests.get(base+'?qa=cups14-'+str(i),headers={'Cache-Control':'no-cache'},timeout=20)
              detail=requests.get(cups+'?qa=cups14-'+str(i),headers={'Cache-Control':'no-cache'},timeout=20)
              if main.ok and 'all-cups-14-20261026' in main.text and detail.ok and '14张完整原画' in detail.text:break
              print('WAIT_PUBLISH',i,main.status_code,detail.status_code,flush=True)
              time.sleep(5)
          else:raise RuntimeError('new main and gallery not yet published')
          print('CURRENT_SITE_PUBLISHED',flush=True)
          reg=requests.get(cups+'design-register-v1.json',timeout=20).json()
          assert len(reg['cards'])==14,reg['cards']
          assert reg['approved_count']==13,reg['approved_count']
          assert [x['slug'] for x in reg['cards'] if x['status']!='approved']==['six']
          def check(slug):
              r=requests.get(cups+f'final/{slug}-of-cups-v1.webp',timeout=45)
              r.raise_for_status()
              with Image.open(io.BytesIO(r.content)) as im:
                  im.load()
                  assert im.format=='WEBP' and im.size==(941,1672),(slug,im.format,im.size)
              return slug,len(r.content)
          with ThreadPoolExecutor(max_workers=7) as p: assets=list(p.map(check,order))
          print('14_LIVE_ORIGINAL_WEBP_IMAGES_VALID_941x1672',assets,flush=True)
          o=Options()
          for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1380,950']:o.add_argument(x)
          b=webdriver.Chrome(options=o)
          b.set_script_timeout(35)
          try:
              def get(route):
                  b.get(base+'?qa=cups14#'+route)
                  WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.cups-approved-card'))>0 if route.startswith('/library/cups') else len(d.find_elements(By.CSS_SELECTOR,'.detail-layout'))>0)
              for p,want in [(1,6),(2,6),(3,2)]:
                  get('/library/cups/'+str(p))
                  assert len(b.find_elements(By.CSS_SELECTOR,'.cups-approved-card'))==want
                  print('MAIN_GALLERY_PAGE',p,want,flush=True)
              assert '杯数待修正' in b.find_element(By.CSS_SELECTOR,'.cups-library').text
              for slug in ['five','knight','queen','six']:
                  get('/card/cups/'+slug)
                  body=b.find_element(By.CSS_SELECTOR,'.detail-copy').text
                  for item in ['牌面的故事','正位 · 启示','逆位 · 阴影','原著背景与艺术改编','留给你的问题']:
                      assert item in body,(slug,item)
                  actual=b.execute_async_script("""
                     const done=arguments[0], im=document.querySelector('.detail-art img');
                     im.decode().then(()=>done([im.naturalWidth,im.naturalHeight])).catch(()=>done([0,0]));
                  """)
                  assert actual==[941,1672],(slug,actual)
                  print('REAL_IMAGE_DEEP_CARD',slug,flush=True)
              b.get(base+'?qa=cups14#/draw')
              WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.pool-select button'))==2)
              assert '35张' in b.find_element(By.CSS_SELECTOR,'.pool-select').text
              state=b.execute_script("""
                return {
                  all:window.CUPS_APPROVED.length,
                  approved:window.CUPS_APPROVED.filter(c=>c.status==='approved').length,
                  excluded:window.CUPS_APPROVED.filter(c=>c.status!=='approved').map(c=>c.slug)
                };
              """)
              assert state=={'all':14,'approved':13,'excluded':['six']},state
              b.execute_script("Math.random=()=>0.9999;document.querySelector('#go-draw').click()")
              assert len(b.find_elements(By.CSS_SELECTOR,'.drawn-card'))==1
              assert '圣杯国王' in b.find_element(By.CSS_SELECTOR,'.drawn-card').text
              b.execute_script("document.querySelector('[data-pool=major]').click();document.querySelector('#go-draw').click()")
              assert '世界' in b.find_element(By.CSS_SELECTOR,'.drawn-card').text
              print('DRAW_POOL_35_CARDS_MAJOR_22_PRESERVED',flush=True)
              b.get(cups+'?qa=cups14')
              WebDriverWait(b,15).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.approved-art-card'))==14)
              assert b.find_elements(By.CSS_SELECTOR,'.approved-art-card')[-1].text
              print('STANDALONE_GALLERY_14_REAL_IMAGES',flush=True)
              b.set_window_size(390,844)
              for route in ['/library/cups/3','/card/cups/queen']:
                  b.get(base+'?qa=cups14#'+route)
                  WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.detail-art img'))==1 if route.startswith('/card') else len(d.find_elements(By.CSS_SELECTOR,'.cups-approved-card'))==2)
                  sz=b.execute_script("return [document.documentElement.scrollWidth,window.innerWidth]")
                  assert sz[0]<=sz[1]+2,(route,sz)
              print('MOBILE_NO_OVERFLOW',flush=True)
              print('ALL_CUPS_14_GALLERY_TESTS_PASSED',flush=True)
          finally:b.quit()
          PY
          python /tmp/cups14_qa.py
