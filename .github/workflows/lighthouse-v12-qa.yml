name: Lighthouse V12 night-encounter and expanded sea QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v12-*.js'
      - 'lighthouse/v12-preview.html'
      - '.github/workflows/lighthouse-v12-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v12
          npm --prefix /tmp/lighthouse-v12 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v12/node_modules/.bin/playwright install chromium
      - name: Render and validate water, vegetation, three arms, ship and event exclusion
        env:
          NODE_PATH: /tmp/lighthouse-v12/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v12-http.log 2>&1 &
          mkdir -p lighthouse/v12-qa-output
          cat >/tmp/lighthouse-v12/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              '--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage'
            ]});
            const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
            await page.goto('http://127.0.0.1:8765/lighthouse/v12-preview.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:45000});
            const base=await page.evaluate(()=>({
              version:document.body.dataset.version,
              meshCount:Number(document.body.dataset.meshCount||0),
              waterFactor:Number(document.body.dataset.waterAreaFactor||0),
              waterCenter:document.body.dataset.waterCenter,
              plantClusters:Number(document.body.dataset.plantClusters||0),
              barrelCount:Number(document.body.dataset.barrelCount||0),
              geometryAudit:document.body.dataset.geometryAudit,
              tyreCount:Number(document.body.dataset.tyreCount||0),
              event:window.__lighthouseNightEvents?.getState()
            }));
            await page.screenshot({path:'lighthouse/v12-qa-output/night-idle.png'});
            await page.locator('#mode-day').click();
            const daylight=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
            await page.screenshot({path:'lighthouse/v12-qa-output/day.png'});
            await page.locator('#topview').click();
            await page.waitForTimeout(550);
            await page.screenshot({path:'lighthouse/v12-qa-output/overhead.png'});
            await page.locator('#reset').click();
            await page.locator('#mode-night').click();
            const waiting=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
            const armsStarted=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',3));
            const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
            await page.screenshot({path:'lighthouse/v12-qa-output/three-curled-tentacles.png'});
            const single=await page.evaluate(()=>{
              window.__lighthouseNightEvents.forceEvent('tentacles',1);
              return window.__lighthouseNightEvents.advanceForTest(2.5);
            });
            await page.screenshot({path:'lighthouse/v12-qa-output/one-tentacle.png'});
            const dual=await page.evaluate(()=>{
              window.__lighthouseNightEvents.forceEvent('tentacles',2);
              return window.__lighthouseNightEvents.advanceForTest(2.5);
            });
            await page.screenshot({path:'lighthouse/v12-qa-output/two-tentacles.png'});
            const shipStarted=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
            const shipEarly=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
            await page.screenshot({path:'lighthouse/v12-qa-output/pirate-ship-early.png'});
            const shipMid=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(5.0));
            await page.screenshot({path:'lighthouse/v12-qa-output/pirate-ship-mid.png'});
            await page.locator('#mode-day').click();
            const dayAfter=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
            const result={base,daylight,waiting,armsStarted,arms,single,dual,shipStarted,shipEarly,shipMid,dayAfter,errors};
            console.log('V12_EVENTS_QA',JSON.stringify(result));
            await browser.close();
            const chosen=(x)=>x.arms.filter(a=>x.selected.includes(a.index));
            if(base.version!=='v12a'||base.meshCount<300||
               Math.abs(base.waterFactor-4)>.0001||base.waterCenter!=='-0.2,0.25'||
               base.geometryAudit!=='pass'||base.tyreCount!==6||
               base.plantClusters!==40||base.barrelCount!==4||
               !base.event?.mutualExclusion||base.event.positions.length!==3||
               daylight.night!==false||daylight.ship.visible||
               waiting.night!==true||waiting.wait<5||waiting.wait>10||
               !armsStarted||arms.activeCount!==3||arms.phase!=='tentacles'||
               chosen(arms).some(a=>a.growth<.97||a.suckers!==24||a.bend<.4)||
               !arms.mutualExclusion||arms.ship.active||
               single.activeCount!==1||dual.activeCount!==2||
               !shipStarted||shipEarly.phase!=='ship'||shipEarly.activeCount!==0||
               !shipEarly.ship.active||shipEarly.ship.sails!==4||!shipEarly.mutualExclusion||
               shipMid.ship.progress<=shipEarly.ship.progress||
               Math.abs(shipMid.ship.sailMotion-shipEarly.ship.sailMotion)<.0001||
               dayAfter.ship.visible||dayAfter.activeCount!==0||errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v12/test.cjs
      - name: Upload proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v12-night-events-screenshots
          path: lighthouse/v12-qa-output/
          if-no-files-found: warn
