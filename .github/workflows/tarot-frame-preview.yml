name: Tarot frame extraction preview
on:
  push:
    branches: [main]
    paths:
      - 'projects/cthulhu-tarot/minor-arcana-v3/tools/extract_major_border.py'
      - '.github/workflows/tarot-frame-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frame-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pillow
        run: python -m pip install pillow
      - name: Fetch locked source from gh-pages (read only)
        run: |
          git show origin/gh-pages:assets/cards-hd/arcana-05.webp > /tmp/arcana-05.webp
          test -s /tmp/arcana-05.webp
      - name: Extract preview overlay and art window
        run: |
          python projects/cthulhu-tarot/minor-arcana-v3/tools/extract_major_border.py --source /tmp/arcana-05.webp --out frame-preview
      - name: Upload preview for inspection (not published)
        uses: actions/upload-artifact@v4
        with:
          name: cthulhu-major-border-first-pass
          path: frame-preview/
          retention-days: 30
