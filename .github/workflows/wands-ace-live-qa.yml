name: Verify Live Wands Ace Integration
on:
  push:
    branches: [main]
    paths: [".github/workflows/wands-ace-live-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Install browser test tools
        run: python -m pip install --quiet selenium requests Pillow
      - name: Test image, library navigation, deep story, draw and mobile
        shell: bash
        run: |
          cat >/tmp/wands_check.py <<'PY'
          import io,time,requests
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://raynacocobobobo-arch.github.io/DND/'
          for n in range(36):
              page=requests.get(base+'?wands-ace-verification='+str(n),timeout=30,headers={'Cache-Control':'no-cache'})
              if page.ok and 'wands-ace-v1-20261026' in page.text and 'wands-navigation-20261026' in page.text:break
              print('WAIT_FOR_PUBLISH',n,page.status_code,flush=True)
              time.sleep(5)
          else:raise Exception('Published HTML not updated yet')
          image=requests.get(base+'minor-arcana/wands/final/ace-of-wands-v1.webp',timeout=40)
          image.raise_for_status()
          art=Image.open(io.BytesIO(image.content));art.load()
          assert art.size==(941,1672) and art.format=='WEBP',(art.size,art.format)
          print('LIVE_HD_WANDS_ACE_ARTWORK_OK',art.size,len(image.content),flush=True)
          opts=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1380,940']:opts.add_argument(arg)
          b=webdriver.Chrome(options=opts)
          b.set_script_timeout(30)
          try:
              b.get(base+'?v=wands-ace-qa#/home')
              WebDriverWait(b,15).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.home-visual img'))==1)
              w=b.find_element(By.CSS_SELECTOR,'[data-route-nav="wands"]')
              assert w.get_attribute('href').endswith('#/library/wands')
              b.execute_script("document.querySelector('[data-route-nav=\"wands\"]').click()")
              WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==1)
              assert '权杖王牌' in b.find_element(By.CSS_SELECTOR,'.library-card').text
              assert '台账' not in b.find_element(By.ID,'app').text
              assert '审核' not in b.find_element(By.ID,'app').text
              print('WANDS_LIBRARY_SAME_STANDARD_AS_MAJOR',flush=True)
              b.execute_script("document.querySelector('.library-card').click()")
              WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1)
              assert b.current_url.endswith('#/card/wands/ace'),b.current_url
              txt=b.find_element(By.CSS_SELECTOR,'.detail-copy').text
              for expected in ['牌面的故事','画面在讲什么','正位 · 启示','逆位 · 阴影','原著背景与艺术改编','留给你的问题']:
                  assert expected in txt,expected
              imageSize=b.execute_async_script("""
                 const done=arguments[0],im=document.querySelector('.detail-art img');
                 im.decode().then(()=>done([im.naturalWidth,im.naturalHeight])).catch(()=>done([0,0]));
              """)
              assert imageSize==[941,1672],imageSize
              print('WANDS_ACE_DEDICATED_DETAIL_6_CHAPTERS_HD',imageSize,flush=True)
              b.get(base+'?v=wands-ace-qa#/library/cups')
              WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==6)
              b.get(base+'?v=wands-ace-qa#/library/1')
              WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==6)
              print('CUPS_14_AND_MAJOR_22_UNCHANGED',flush=True)
              b.get(base+'?v=wands-ace-qa#/draw')
              WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.pool-select button'))==2)
              assert '37张' in b.find_element(By.CSS_SELECTOR,'.pool-select').text
              b.execute_script("Math.random=()=>0.999;document.querySelector('#go-draw').click()")
              assert '权杖王牌' in b.find_element(By.CSS_SELECTOR,'.drawn-card').text
              print('ACE_AVAILABLE_IN_37_CARD_DRAW_POOL',flush=True)
              b.set_window_size(390,844)
              b.get(base+'?v=wands-ace-qa#/library/wands')
              WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==1)
              measures=b.execute_script("return [document.documentElement.scrollWidth,innerWidth,document.querySelectorAll('.nav a').length]")
              assert measures[0]<=measures[1]+2,measures
              assert measures[2]==5,measures
              print('MOBILE_NAV_AND_ART_NO_HORIZONTAL_OVERFLOW',measures,flush=True)
              print('ALL_WANDS_ACE_LIVE_TESTS_PASSED',flush=True)
          finally:b.quit()
          PY
          python /tmp/wands_check.py
