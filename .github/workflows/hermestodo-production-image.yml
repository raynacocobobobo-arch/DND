name: HermesTodo production container image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hermestodo-production-image
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Verify and publish real full-stack image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: HermesTodo/package-lock.json
      - name: Install
        working-directory: HermesTodo
        run: npm ci
      - name: Tests
        working-directory: HermesTodo
        run: npm test
      - name: TypeScript
        working-directory: HermesTodo
        run: npm run typecheck
      - name: Compile real client and server (no preview mocks)
        working-directory: HermesTodo
        env:
          VITE_STATIC_PREVIEW: "false"
          HERMESTODO_PREVIEW: "false"
        run: |
          npm run build
          test -s dist/server/index.js
          test -s dist/client/index.html
          ! grep -R -l 'hermestodo-public-preview-v1' dist/client/assets
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate container
        uses: docker/build-push-action@v6
        with:
          context: ./HermesTodo
          file: ./HermesTodo/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermestodo:candidate
            ghcr.io/${{ github.repository_owner }}/hermestodo:sha-${{ github.sha }}
          cache-from: type=gha,scope=hermestodo-production
          cache-to: type=gha,mode=max,scope=hermestodo-production
      - name: Deployment boundary
        run: |
          echo "Published the real full-stack Docker image to GHCR."
          echo "GitHub stores the image; a running server/managed host with a persistent volume is still required."
          echo "No production database or credentials were included in the image."
