name: Lighthouse V35 editor map gameplay preview QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/preview.html'
      - 'lighthouse/v35-preview-scene.js'
      - 'lighthouse/editor-preview-map.json'
      - 'lighthouse/shared-map.js'
      - 'lighthouse-editor/coastal-tree-prefabs.js'
      - 'lighthouse-editor/assets/palms/**'
      - '.github/workflows/lighthouse-map-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          mkdir -p /tmp/lighthouse-map-preview-qa
          npm --prefix /tmp/lighthouse-map-preview-qa install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-map-preview-qa/node_modules/.bin/playwright install chromium
      - name: Test saved map, local preview, and original game isolation
        env:
          NODE_PATH: /tmp/lighthouse-map-preview-qa/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-map-preview-qa-server.log 2>&1 &
          mkdir -p lighthouse/qa-map-preview
          cat >/tmp/lighthouse-map-preview-qa/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:[
            '--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
           const context=await browser.newContext({viewport:{width:1440,height:930},deviceScaleFactor:1});
           const errors=[];
           const watch=p=>{
            p.on('pageerror',e=>errors.push('PAGE '+e.message));
            p.on('console',msg=>{if(msg.type()==='error')errors.push('CONSOLE '+msg.text());});
            p.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure()?.errorText));
           };
           const open=async path=>{
            const p=await context.newPage();watch(p);
            await p.goto('http://127.0.0.1:8765'+path,{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
            return p;
           };
           const published=await open('/lighthouse/preview.html');
           const original=await published.evaluate(()=>{
            const api=window.__lighthouseNightEvents;
            const map=api.getWorldMap();
            return {source:document.body.dataset.worldMapSource,
             objCount:+document.body.dataset.mapObjects,
             active:api.getMapInfo().active,asset:map.objects[0]?.asset,
             y:map.objects[0]?.y,size:[map.width,map.depth],
             hasCanvas:!!document.querySelector('canvas')};
           });
           await published.screenshot({path:'lighthouse/qa-map-preview/preview-published.png'});
           const copy=await published.evaluate(()=>{
            const map=window.__lighthouseNightEvents.getWorldMap();
            map.objects[0].y=9.75;
            localStorage.setItem('dnd-lighthouse-world-map-v2',JSON.stringify(map));
            return map.objects[0].y;
           });
           const local=await open('/lighthouse/preview.html?source=local');
           const draft=await local.evaluate(()=>({
            source:document.body.dataset.worldMapSource,
            y:window.__lighthouseNightEvents.getWorldMap().objects[0]?.y,
            count:+document.body.dataset.mapObjects
           }));
           const game=await open('/lighthouse/');
           const intact=await game.evaluate(()=>({
            source:document.body.dataset.worldMapSource,
            active:document.body.dataset.worldMapActive,
            count:+document.body.dataset.mapObjects
           }));
           const ok=original.source==='editor-published-preview'&&original.active&&
            original.objCount===1&&original.asset==='coastal_tree_t03'&&
            original.size[0]===328.5&&original.size[1]===290.25&&
            original.hasCanvas&&Math.abs(original.y-.7443517356364033)<1e-8&&
            copy===9.75&&draft.source==='editor-local-preview'&&
            draft.y===9.75&&draft.count===1&&
            intact.source==='original-fixed'&&intact.active==='false'&&
            intact.count===0&&errors.length===0;
           console.log('MAP_PREVIEW_QA',JSON.stringify({ok,original,draft,intact,errors}));
           await browser.close();
           if(!ok)process.exit(1);
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
          node /tmp/lighthouse-map-preview-qa/test.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-map-preview-qa
          path: lighthouse/qa-map-preview/
          if-no-files-found: warn
