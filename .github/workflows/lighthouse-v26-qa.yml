name: Lighthouse V26 faceted ocean and three reefs QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v26-*.js'
      - 'lighthouse/v26-preview.html'
      - '.github/workflows/lighthouse-v26-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v26
          npm --prefix /tmp/lighthouse-v26 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v26/node_modules/.bin/playwright install chromium
      - name: Verify no character, varied opaque water facets and rock clearances
        env:
          NODE_PATH: /tmp/lighthouse-v26/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v26.log 2>&1 &
          mkdir -p lighthouse/v26-qa-output
          cat >/tmp/lighthouse-v26/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:[
            '--enable-webgl','--use-gl=angle','--use-angle=swiftshader',
            '--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v26-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const inspect=()=>page.evaluate(()=>{
            const api=window.__lighthouseNightEvents;
            const sea=window.__lighthouseSea;
            const coords=sea.geometry.attributes.position.array;
            const colors=sea.geometry.attributes.color.array;
            const levels=new Set,facets=new Set;
            for(let i=0;i<coords.length;i+=3)levels.add(coords[i+1].toFixed(5));
            for(let i=0;i<colors.length;i+=9)
             facets.add([...colors.slice(i,i+3)].map(v=>v.toFixed(3)).join(','));
            return {
             version:document.body.dataset.version,rendered:document.body.dataset.rendered,
             geometry:document.body.dataset.geometryAudit,seaStyle:document.body.dataset.seaStyle,
             waterArea:+document.body.dataset.waterAreaFactor,
             seaTriangles:+document.body.dataset.seaTriangles,
             seaPalette:+document.body.dataset.seaPaletteCount,
             waterWalls:+document.body.dataset.waterSidewallCount,
             seaTransparent:sea.material.transparent,
             seaDepthWrite:sea.material.depthWrite,
             waterHeights:[...levels],uniqueFacetColors:facets.size,
             colorProbe:[...colors.slice(0,18)],flat:sea.userData.vectorFlat,
             characterCount:+document.body.dataset.characterCount,
             fishPresent:!!document.querySelector('[data-fishman]')||
               !!api.getVisitor||!!document.body.dataset.visitorType,
             meshes:Array.from({length:0}),reefs:api.getReefs(),
             ship:api.getState().ship,krakenSites:api.getState().positions.length,
             sailingClearance:api.getState().corridorClear,
             gulls:api.getGulls(),clouds:api.getClouds()
            };
           });
           const night=await inspect();
           await page.screenshot({path:'lighthouse/v26-qa-output/night-faceted-sea.png'});
           await page.locator('#mode-day').click();
           await page.waitForTimeout(3200);
           const day=await inspect();
           await page.screenshot({path:'lighthouse/v26-qa-output/day-faceted-sea.png'});
           await page.mouse.move(710,520);
           await page.mouse.down();await page.mouse.move(815,565,{steps:10});await page.mouse.up();
           await page.waitForTimeout(400);
           await page.screenshot({path:'lighthouse/v26-qa-output/day-orbit-reefs.png'});
           await page.locator('#reset').click();
           await page.locator('#mode-night').click();
           await page.waitForTimeout(3150);
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const launched=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
           const shipLaunch=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const combo=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1.0));
           await page.screenshot({path:'lighthouse/v26-qa-output/night-kraken-ship-reefs.png'});
           await page.locator('#mode-day').click();
           const immediate=await page.evaluate(()=>window.__lighthouseNightEvents.getState());
           const retreat=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(5));
           const shipEnd=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(26));
           const p=night.reefs.sites;
           const passed=[night,day].every(s=>
             s.version==='v26a'&&s.geometry==='pass'&&s.rendered==='true'&&
             s.seaStyle==='multicolor-faceted-flat'&&s.flat&&
             Math.abs(s.waterArea-5.6)<.0002&&
             s.seaTriangles>=170&&s.seaTriangles<=350&&s.seaPalette>=5&&
             s.waterWalls===4&&!s.seaTransparent&&s.seaDepthWrite&&
             s.waterHeights.length===1&&s.uniqueFacetColors>=5&&
             s.characterCount===0&&!s.fishPresent&&
             s.reefs.count===3&&s.reefs.safe&&s.reefs.solid&&
             s.reefs.sites.every(r=>r.tentacleClearance>3&&r.pirateClearance>3)&&
             s.krakenSites===8&&s.sailingClearance&&
             s.gulls.gullScaleFactor===.70&&s.clouds.fixedCount===3)&&
             p[0].height>p[1].height&&p[1].height>p[2].height&&
             day.colorProbe[0]!==night.colorProbe[0]&&
             launched&&arms.activeCount===5&&shipLaunch&&combo.concurrent&&
             immediate.activeCount===5&&immediate.ship.active&&
             retreat.activeCount===0&&!shipEnd.ship.active&&errors.length===0;
           console.log('V26_QA_RESULT',JSON.stringify({passed,night,day,launched,
            armsCount:arms.activeCount,shipLaunch,concurrent:combo.concurrent,
            retreatCount:retreat.activeCount,shipDone:!shipEnd.ship.active,errors}));
           await browser.close();
           if(!passed)throw Error('V26 QA assertion failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v26/test.cjs
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v26-faceted-ocean-qa
          path: lighthouse/v26-qa-output/
          if-no-files-found: warn
