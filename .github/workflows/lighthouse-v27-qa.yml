name: Lighthouse V27 clean vector sea, rock material and water cutaway QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v27-*.js'
      - 'lighthouse/v27-preview.html'
      - '.github/workflows/lighthouse-v27-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v27
          npm --prefix /tmp/lighthouse-v27 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v27/node_modules/.bin/playwright install chromium
      - name: Validate shallow sea, deep sea, rock shapes and 2:1 water to seabed cross-section
        env:
          NODE_PATH: /tmp/lighthouse-v27/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v27.log 2>&1 &
          mkdir -p lighthouse/v27-qa-output
          cat >/tmp/lighthouse-v27/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:[
             '--enable-webgl','--use-gl=angle','--use-angle=swiftshader',
             '--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v27-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           const inspect=()=>page.evaluate(()=>{
             const sea=window.__lighthouseSea,geo=sea.geometry;
             const pos=geo.attributes.position.array,col=geo.attributes.color.array;
             const heights=new Set();
             for(let k=1;k<pos.length;k+=3)heights.add(pos[k].toFixed(5));
             const center={x:-.2,z:.25};let near=null,far=null;
             for(let i=0;i<pos.length;i+=3){
               const x=pos[i],z=pos[i+2],r=Math.hypot((x-center.x)/5.38,(z-center.z)/4.34);
               const c=[col[i],col[i+1],col[i+2]],l=c[0]+c[1]+c[2];
               if(r>1&&r<1.15&&(!near||r<near.r))near={r,l,c};
               if(r>2.8&&(!far||r>far.r))far={r,l,c};
             }
             return {
               version:document.body.dataset.version,rendered:document.body.dataset.rendered,
               geometry:document.body.dataset.geometryAudit,
               seaStyle:document.body.dataset.seaStyle,
               heightValues:[...heights],
               waterThickness:+document.body.dataset.waterThickness,
               seabedThickness:+document.body.dataset.seabedThickness,
               waterFraction:+document.body.dataset.waterFraction,
               waterWalls:+document.body.dataset.waterSidewallCount,
               waterArea:+document.body.dataset.waterAreaFactor,
               opaque:!sea.material.transparent&&sea.material.depthWrite,
               near,far,seaTriangles:+document.body.dataset.seaTriangles,
               headerCount:document.querySelectorAll('header').length,
               hudCount:document.querySelectorAll('#hud').length,
               reefs:window.__lighthouseNightEvents.getReefs(),
               events:window.__lighthouseNightEvents.getState(),
               cloud:window.__lighthouseNightEvents.getClouds(),
               gull:window.__lighthouseNightEvents.getGulls()
             };
           });
           const night=await inspect();
           await page.screenshot({path:'lighthouse/v27-qa-output/night-default.png'});
           await page.locator('#mode-day').click();
           await page.waitForTimeout(3300);
           const day=await inspect();
           await page.screenshot({path:'lighthouse/v27-qa-output/day-default.png'});
           await page.mouse.move(710,520);await page.mouse.down();
           await page.mouse.move(840,560,{steps:12});await page.mouse.up();
           await page.waitForTimeout(500);
           await page.screenshot({path:'lighthouse/v27-qa-output/day-orbit.png'});
           await page.locator('#reset').click();
           // Side elevation reveals the full water/earth section.
           await page.evaluate(()=>{
             const t=window.__lighthouseNightEvents;
             if(t.setCutawayViewForTest)t.setCutawayViewForTest();
           });
           await page.waitForTimeout(500);
           await page.screenshot({path:'lighthouse/v27-qa-output/water-seabed-cross-section.png'});
           await page.locator('#reset').click();
           await page.locator('#mode-night').click();await page.waitForTimeout(3100);
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const a=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',5,[0,1,2,3,0]));
           const arms=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2.5));
           const ship=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const concurrent=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1));
           const ok=[night,day].every(s=>s.version==='v27a'&&s.rendered==='true'&&
             s.geometry==='pass'&&s.seaStyle==='nearshore-deepwater-vector'&&
             s.headerCount===0&&s.hudCount===0&&s.heightValues.length===1&&
             s.opaque&&s.near&&s.far&&s.near.l>s.far.l+.1&&
             s.waterThickness===3&&s.seabedThickness===1.5&&
             Math.abs(s.waterFraction-2/3)<.00001&&s.waterWalls===4&&
             Math.abs(s.waterArea-5.6)<.0002&&s.reefs.count===3&&
             s.reefs.safe&&s.reefs.sites.every(v=>v.materialMatchesIsland)&&
             s.reefs.sites[0].height>3&&s.reefs.sites[0].footprint<.65&&
             s.events.positions.length===8&&s.events.corridorClear&&
             s.gull.gullScaleFactor===.7&&s.cloud.fixedCount===3)&&
             a&&arms.activeCount===5&&ship&&concurrent.concurrent&&errors.length===0;
           console.log('V27_QA_RESULT',JSON.stringify({ok,night,day,events:concurrent.concurrent,errors}));
           await browser.close();
           if(!ok)throw Error('V27 QA assertions failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v27/test.cjs
      - name: Save captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v27-qa
          path: lighthouse/v27-qa-output/
          if-no-files-found: warn
