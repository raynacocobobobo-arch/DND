name: Lighthouse V33 daytime Kraken and double duration QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v33-*.js'
      - 'lighthouse/v33-preview.html'
      - '.github/workflows/lighthouse-v33-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v33
          npm --prefix /tmp/lighthouse-v33 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v33/node_modules/.bin/playwright install chromium
      - name: Validate double animation durations, daytime frequency and boat avoidance
        env:
          NODE_PATH: /tmp/lighthouse-v33/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v33-server.log 2>&1 &
          mkdir -p lighthouse/v33-qa-output
          cat >/tmp/lighthouse-v33/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:[
            '--enable-webgl','--use-gl=angle','--use-angle=swiftshader',
            '--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
           const errors=[];
           page.on('pageerror',e=>errors.push('PAGE '+e.message));
           page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
           page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
           await page.goto('http://127.0.0.1:8765/lighthouse/v33-preview.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:60000});
           await page.evaluate(()=>window.__lighthouseNightEvents.pauseForTest(true));
           const inspect=()=>page.evaluate(()=>{
            const api=window.__lighthouseNightEvents;
            return {version:document.body.dataset.version,mode:document.body.dataset.mode,
             event:api.getState(),boat:api.getBoat()};
           });
           const start=await inspect();
           const dayWait=start.event.wait;
           const dayPirateDenied=await page.evaluate(()=>!window.__lighthouseNightEvents.forceEvent('ship'));
           const dayKraken=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('tentacles',3,[0,1,2]));
           const dayRise=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(3.0));
           const duringDay=await inspect();
           await page.screenshot({path:'lighthouse/v33-qa-output/day-kraken-rising.png'});
           const dayHover=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(1.7));
           await page.screenshot({path:'lighthouse/v33-qa-output/day-kraken-hover.png'});
           const collisionDay=await page.evaluate(()=>{
            const a=window.__lighthouseNightEvents;
            const state=a.getState();
            return {
             visible:state.arms.filter(x=>x.visible).length,
             blocked:state.arms.filter(x=>x.visible).every(x=>!a.testBoatSafe(x.origin.x,x.origin.z)),
             otherSitesFree:state.arms.filter(x=>!x.visible).every(x=>a.testBoatSafe(x.origin.x,x.origin.z))
            };
           });
           // Enter night DURING the day event; it must not reset or vanish.
           await page.locator('#mode-night').click();
           const afterNightSwitch=await inspect();
           const nightWait=afterNightSwitch.event.nightWaitRange;
           const nightActive=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(2));
           await page.screenshot({path:'lighthouse/v33-qa-output/night-continuing-tentacles.png'});
           // Return to day while the same event is still active.
           await page.locator('#mode-day').click();
           const afterDaySwitch=await inspect();
           const dayAgain=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(3));
           const dayFinish=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(12));
           const afterComplete=await inspect();
           await page.screenshot({path:'lighthouse/v33-qa-output/day-after-natural-retreat.png'});
           // Transition to night with no active tentacles; doubled day wait
           // must be halved proportionally in night mode.
           await page.locator('#mode-night').click();
           const nightIdle=await inspect();
           const shipStart=await page.evaluate(()=>window.__lighthouseNightEvents.forceEvent('ship'));
           const shipState=await inspect();
           await page.locator('#mode-day').click();
           const shipDuringSunrise=await inspect();
           const shipFinished=await page.evaluate(()=>window.__lighthouseNightEvents.advanceForTest(27));
           const boatSafe=await page.evaluate(()=>window.__lighthouseNightEvents.getBoat().safe);
           const ok=start.version==='v33a'&&start.mode==='day'&&
             start.event.daytimeEnabled&&start.event.daytimeWaitMultiplier===2&&
             start.event.durationMultiplier===2&&dayWait>=10&&dayWait<=20&&
             dayPirateDenied&&dayKraken&&dayRise.activeCount===3&&
             dayRise.arms.filter(x=>x.visible).length===3&&
             dayRise.arms.filter(x=>x.visible).every(x=>x.phase==='rising'&&
               x.riseDuration===4.6&&x.retreatBaseDuration===5.4&&
               x.hold>=6&&x.hold<=8.4)&&
             dayHover.arms.filter(x=>x.visible).every(x=>x.phase==='hover')&&
             collisionDay.visible===3&&collisionDay.blocked&&collisionDay.otherSitesFree&&
             afterNightSwitch.event.selected.join(',')===dayHover.selected.join(',')&&
             afterNightSwitch.event.activeCount===3&&
             nightWait[0]===5&&nightWait[1]===10&&
             nightActive.activeCount===3&&afterDaySwitch.event.activeCount===3&&
             dayAgain.activeCount===3&&dayFinish.activeCount===0&&
             afterComplete.event.phase==='waiting'&&
             afterComplete.event.wait>=10&&afterComplete.event.wait<=20&&
             nightIdle.event.night&&
             Math.abs((nightIdle.event.wait-nightIdle.event.elapsed)-
              .5*(afterComplete.event.wait-afterComplete.event.elapsed))<.02&&
             shipStart&&shipState.event.ship.active&&
             shipDuringSunrise.event.ship.active&&
             !shipFinished.ship.active&&boatSafe&&errors.length===0;
           console.log('V33_QA_RESULT',JSON.stringify({ok,
            start:{version:start.version,mode:start.mode,wait:dayWait},
            dayPirateDenied,dayKraken,rise:dayRise.arms.filter(x=>x.visible).map(x=>({
             phase:x.phase,riseDuration:x.riseDuration,hold:x.hold,
             retreatDuration:x.retreatBaseDuration})),
            dayHoverPhases:dayHover.arms.filter(x=>x.visible).map(x=>x.phase),
            collisionDay,afterNightSwitch:{count:afterNightSwitch.event.activeCount,
             selected:afterNightSwitch.event.selected},
            afterDaySwitch:{count:afterDaySwitch.event.activeCount},
            dayFinished:dayFinish.activeCount,completedWait:afterComplete.event.wait,
            nightWait:nightIdle.event.wait,shipStart,shipSunrise:shipDuringSunrise.event.ship.active,
            shipDone:!shipFinished.ship.active,errors}));
           await browser.close();
           if(!ok)throw Error('V33 daytime Kraken QA failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v33/test.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v33-kraken-qa
          path: lighthouse/v33-qa-output/
          if-no-files-found: warn
