name: Verify Cups Art Preview
on:
  push:
    branches: [main]
    paths: [".github/workflows/cups-preview-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: python -m pip install --quiet selenium requests pillow
      - name: Verify live sample image and interactive 14-card register
        run: |
          cat > /tmp/check.py <<'PY'
          import io,requests
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          base='https://raynacocobobobo-arch.github.io/DND/minor-arcana/cups/'
          page=requests.get(base,timeout=30)
          print('PAGE_STATUS',page.status_code,len(page.content),flush=True)
          page.raise_for_status()
          assert '14 张制作台账' in page.text
          r=requests.get(base+'drafts/ace-of-cups-v01.webp',timeout=45)
          r.raise_for_status()
          im=Image.open(io.BytesIO(r.content))
          print('ACE_ART',im.format,im.size,len(r.content),flush=True)
          assert im.format=='WEBP' and im.width>=900 and im.height>=1500
          reg=requests.get(base+'design-register-v1.json',timeout=30).json()
          assert len(reg['cards'])==14
          assert reg['cards'][0]['status']=='sample'
          opt=Options()
          for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1300,900']:opt.add_argument(x)
          b=webdriver.Chrome(options=opt)
          try:
            b.get(base+'?v=sample1')
            from selenium.webdriver.support.ui import WebDriverWait
            WebDriverWait(b,20).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.tile'))==14)
            assert b.find_element(By.ID,'ace-photo').get_attribute('naturalWidth') is not None
            b.execute_script("document.querySelectorAll('.tile')[4].click()")
            assert '失物之港' in b.find_element(By.ID,'sheet').text
            assert '3只倒杯' in b.find_element(By.ID,'sheet').text
            print('DESKTOP_14_SCENES_AND_DETAIL_PASS',flush=True)
            b.set_window_size(390,844)
            b.refresh()
            WebDriverWait(b,20).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.tile'))==14)
            sw=b.execute_script('return document.documentElement.scrollWidth')
            assert sw<=390,sw
            print('MOBILE_NO_OVERFLOW_PASS',sw,flush=True)
            print('ALL_CUPS_PREVIEW_CHECKS_PASS',flush=True)
          finally:
            b.quit()
          PY
          python /tmp/check.py
