name: Publish HermesTodo latest preview

on:
  push:
    branches:
      - feature/hermestodo-dashboard-subtasks-20261025
    paths:
      - "HermesTodo/**"
      - ".github/workflows/hermestodo-preview-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermestodo-preview-publish
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: HermesTodo/package-lock.json
      - name: Install dependencies
        working-directory: HermesTodo
        run: npm ci
      - name: Build latest branch as local-data demo
        working-directory: HermesTodo
        env:
          VITE_STATIC_PREVIEW: "true"
          HERMESTODO_PREVIEW: "true"
        run: npx vite build
      - name: Browser smoke test - local latest preview
        run: |
          python3 -m pip install --quiet selenium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          fc-cache -f
          mkdir -p /tmp/hermestodo-site/DND/hermestodo
          cp -a HermesTodo/dist/client/. /tmp/hermestodo-site/DND/hermestodo/
          nohup python3 -m http.server 8090 --bind 127.0.0.1 --directory /tmp/hermestodo-site >/tmp/hermestodo-http.log 2>&1 &
          cat >/tmp/hermestodo-smoke.py <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1280,1000']:
              options.add_argument(arg)
          browser=webdriver.Chrome(options=options)
          try:
              browser.get('http://127.0.0.1:8090/DND/hermestodo/')
              wait=WebDriverWait(browser,20)
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.ios-dashboard')))
              assert '独立预览' in browser.find_element(By.TAG_NAME,'body').text
              # The independent illustration must be a real image, not a flattened UI.
              wait.until(lambda b: b.execute_script(
                  "return !!document.querySelector('.dashboard-hero-art') && document.querySelector('.dashboard-hero-art').naturalWidth > 0"))
              assert browser.execute_script("return getComputedStyle(document.querySelector('.dashboard-hero-art')).objectFit") == 'cover'
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.task-title-button')))
              browser.save_screenshot('/tmp/hermestodo-desktop.png')
              browser.find_element(By.CSS_SELECTOR,'.task-title-button').click()
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.task-detail')))
              browser.find_element(By.CSS_SELECTOR,'.task-detail .dialog-heading button').click()
              field=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.quick-add input')))
              field.send_keys('浏览器交互验收任务')
              browser.find_element(By.CSS_SELECTOR,'.quick-add button').click()
              wait.until(lambda b: '浏览器交互验收任务' in b.find_element(By.TAG_NAME,'body').text)
              browser.find_element(By.CSS_SELECTOR,'a[href="#/contexts"]').click()
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.contexts-page')))
              browser.find_element(By.CSS_SELECTOR,'a[href="#/ai"]').click()
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.ai-page')))
              browser.set_window_size(390,844)
              browser.get('http://127.0.0.1:8090/DND/hermestodo/#/')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.ios-dashboard')))
              browser.save_screenshot('/tmp/hermestodo-mobile.png')
              measure=browser.execute_script('return [innerWidth,document.documentElement.scrollWidth]')
              assert measure[1]<=measure[0]+2, f'Mobile horizontal overflow: {measure}'
              print('BROWSER SMOKE PASSED: desktop, create, task details, contexts, AI, mobile no-overflow',flush=True)
          finally:
              try: print('VISIBLE URL',browser.current_url,flush=True)
              except Exception: pass
              browser.quit()
          PY
          python3 /tmp/hermestodo-smoke.py
      - name: Save browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermestodo-heraldic-preview
          path: |
            /tmp/hermestodo-desktop.png
            /tmp/hermestodo-mobile.png
      - name: Publish preview under existing docs folder
        run: |
          mkdir -p /tmp/hermestodo-preview
          cp -a HermesTodo/dist/client/. /tmp/hermestodo-preview/
          # GitHub Pages for this repository publishes from gh-pages root,
          # not main/docs. Preserve all existing Tarot root assets.
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p hermestodo
          rsync -a --delete /tmp/hermestodo-preview/ hermestodo/
          touch hermestodo/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermestodo
          if git diff --staged --quiet; then
            echo "Preview unchanged"
          else
            git commit -m "build(hermestodo): publish current interactive preview"
            git push origin HEAD:gh-pages
          fi
