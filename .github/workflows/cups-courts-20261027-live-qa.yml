name: Verify Cups Court PAGE QUEEN KING 20261027
on:
  push:
    branches: [main]
    paths: [".github/workflows/cups-courts-20261027-live-qa.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Install browser test dependencies
        run: python -m pip install --quiet selenium requests Pillow
      - name: Verify live Cups court originals and site routes
        shell: bash
        run: |
          cat >/tmp/verify_cups_courts.py <<'PY'
          import io,hashlib,time,requests
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://raynacocobobobo-arch.github.io/DND/'
          hashes={
           'page':'3acea1ffc604eb6ffecadfa758eeae608310d7a0557baf2f7b7d24e694d6b8d0',
           'queen':'cd6de83c4405ecc36206271ae94ac18781475d8602fe2bf3dc5e42fe029ebe3e',
           'king':'82aac6d467772b049e2b1bdf5785a6522d6353807b0de27c1fd1fb898761001d'}
          sess=requests.Session()
          for i in range(50):
            try:
              resp=sess.get(base+'?verify-cups-courts='+str(i),timeout=30,headers={'Cache-Control':'no-cache'})
              if resp.ok and 'cups-courts-20261027' in resp.text:break
              print('WAIT_PUBLIC_HTML',i,resp.status_code,flush=True)
            except requests.RequestException as exc:print('RETRY',str(exc)[:120],flush=True)
            time.sleep(6)
          else:raise RuntimeError('Public Pages HTML is stale')
          js=sess.get(base+'assets/cups-approved-v1.js?v=cups-courts-20261027',timeout=35)
          js.raise_for_status()
          assert 'seven-of-cups-v1.webp' in js.text,'VII was changed'
          for slug,expected in hashes.items():
            assert slug+'-of-cups-v4.webp' in js.text,slug
            res=sess.get(base+f'minor-arcana/cups/final/{slug}-of-cups-v4.webp',timeout=50);res.raise_for_status()
            im=Image.open(io.BytesIO(res.content));im.load()
            assert im.format=='WEBP' and im.size==(941,1672),(slug,im.format,im.size)
            digest=hashlib.sha256(im.convert('RGB').tobytes()).hexdigest()
            assert digest==expected,(slug,digest,expected)
            thumb=sess.get(base+f'minor-arcana/cups/thumbs/{slug}-of-cups-v4.webp',timeout=40);thumb.raise_for_status()
            assert Image.open(io.BytesIO(thumb.content)).format=='WEBP',slug
            print('APPROVED_CUPS_COURT_PIXEL_PASS',slug,flush=True)
          opts=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1366,900']:opts.add_argument(a)
          b=webdriver.Chrome(options=opts);b.set_script_timeout(30)
          try:
            for slug in hashes:
              b.get(base+'?v=cupscourts-20261027#/card/cups/'+slug)
              WebDriverWait(b,18).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1)
              text=b.find_element(By.CSS_SELECTOR,'.detail-copy').text
              for term in ['牌面的故事','画面在讲什么','正位 · 启示','逆位 · 阴影','原著背景与艺术改编']:
                assert term in text,(slug,term)
              dims=b.execute_async_script("const done=arguments[0],img=document.querySelector('.detail-art img');img.decode().then(()=>done([img.naturalWidth,img.naturalHeight])).catch(()=>done([0,0]));")
              assert dims==[941,1672],(slug,dims)
              print('CUPS_COURT_DETAIL_PASS',slug,flush=True)
            b.get(base+'?v=cupscourts-20261027#/card/cups/seven')
            WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1)
            src=b.find_element(By.CSS_SELECTOR,'.detail-art img').get_attribute('src')
            assert 'seven-of-cups-v1.webp' in src,src
            b.get(base+'?v=cupscourts-20261027#/library/cups')
            WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==6)
            b.get(base+'?v=cupscourts-20261027#/library/cups/3')
            WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==2)
            b.get(base+'?v=cupscourts-20261027#/library/1')
            WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==6)
            print('MAJOR_22_CUPS_14_PRESERVED',flush=True)
            b.get(base+'?v=cupscourts-20261027#/draw')
            WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'#go-draw'))==1)
            assert '37张' in b.find_element(By.CSS_SELECTOR,'.pool-select').text
            b.execute_script("document.querySelector('#go-draw').click()")
            assert len(b.find_elements(By.CSS_SELECTOR,'.drawn-card'))==1
            b.set_window_size(390,844)
            b.get(base+'?v=cupscourts-20261027#/library/cups')
            WebDriverWait(b,12).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.library-card'))==6)
            dims=b.execute_script('return [document.documentElement.scrollWidth,innerWidth]')
            assert dims[0]<=dims[1]+2,dims
            print('CUPS_COURTS_MOBILE_PASS',dims,flush=True)
            print('CUPS_PAGE_QUEEN_KING_FULL_LIVE_QA_PASS',flush=True)
          finally:b.quit()
          PY
          python /tmp/verify_cups_courts.py
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: live
          persist-credentials: true
      - name: Write public verification result
        shell: bash
        run: |
          mkdir -p live/qa
          printf '%s\n' '{"version":"2026-10-27","cards":["page","queen","king"],"resolution":[941,1672],"result":"PASS","seven":"unchanged","checks":["public-pixels-sha256","thumbnails","detail-routes","major-and-cups-galleries","draw","mobile"]}' >live/qa/cups-page-queen-king-20261027.json
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C live add qa/cups-page-queen-king-20261027.json
          git -C live diff --cached --quiet || { git -C live commit -m "test(cups): verify PAGE QUEEN KING live"; git -C live push origin HEAD:gh-pages; }
          echo "CUPS_PAGE_QUEEN_KING_FULL_LIVE_QA_PASS"
