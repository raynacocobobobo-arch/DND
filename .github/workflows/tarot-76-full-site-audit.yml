name: Tarot 78 Complete Live Site Audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/tarot-76-full-site-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install browser and image verification tools
        run: python -m pip install --quiet Pillow requests selenium
      - name: Verify public website, all card content, galleries, pixels, draw and mobile
        shell: bash
        run: |
          cat >/tmp/tarot76qa.py <<'PY'
          import io,time,hashlib,requests
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://raynacocobobobo-arch.github.io/DND/'
          source={
           'ace':([942,1669],'b64c024f55749d314d7b692bb39613b990834048f36bc909b51b810b384662f2'),
           'three':([942,1670],'3c3de8a9cd24070d9f084a13f3abc44689ee1ad91535d11bab4be8f843c9214f'),
           'seven':([942,1670],'dc7259039bab89eca1be32b47c178d399f852ac4b5715c97294404874f7a8273'),
           'eight':([941,1672],'cfceabfd610253af180a605b2e38ed07484e36a4f2cc35d2068157269ec3829d')
          }
          session=requests.Session()
          for attempt in range(100):
              r=session.get(base+'?qa=tarot76-'+str(attempt),timeout=35,headers={'Cache-Control':'no-cache'});r.raise_for_status()
              if all(x in r.text for x in ['swords-composition-20261028','pentacles-final-78-20261028','full78-deep-reading-20261028','arcana-app-v3.js?v=reading-first-20261028']):break
              print('WAIT_FOR_LIVE_76',attempt,flush=True);time.sleep(5)
          else:raise AssertionError('Live HTML missing new artwork/editorial/app references')
          print('LIVE_78_HTML_ASSET_VERSIONS_OK',flush=True)
          for slug,(size,pixelhash) in source.items():
            for folder in ['final','thumbs']:
              url=base+'minor-arcana/swords/'+folder+'/'+slug+'-of-swords-v3.webp?v=tarot-qa'
              rr=session.get(url,timeout=40);rr.raise_for_status()
              im=Image.open(io.BytesIO(rr.content));im.load();assert im.format=='WEBP'
              if folder=='final':
                assert list(im.size)==size,(slug,im.size)
                got=hashlib.sha256(im.convert('RGB').tobytes()).hexdigest()
                assert got==pixelhash,(slug,'pixel mismatch',got)
              else:assert im.width<=360 and im.height<=640,(slug,im.size)
            print('REVISED_SWORDS_LOSSLESS_PIXELS_PASS',slug,size,flush=True)
          url=base+'minor-arcana/pentacles/final/eight-of-pentacles-v1.webp?v=qa-77'
          rr=session.get(url,timeout=45);rr.raise_for_status()
          im=Image.open(io.BytesIO(rr.content));im.load()
          assert im.format=='WEBP' and list(im.size)==[942,1670],(im.format,im.size)
          assert hashlib.sha256(im.convert('RGB').tobytes()).hexdigest()=='c908ffe5473c968c1d236573b9c0d37c551deda6fb216b5cb8f967d7d0d01e36','Pentacles VIII source mismatch'
          rthumb=session.get(base+'minor-arcana/pentacles/thumbs/eight-of-pentacles-v1.webp?v=qa-77',timeout=35);rthumb.raise_for_status()
          thumb=Image.open(io.BytesIO(rthumb.content));thumb.load()
          assert thumb.format=='WEBP' and thumb.width<=360 and thumb.height<=640,(thumb.format,thumb.size)
          print('PENTACLES_VIII_ORDINARY_EIGHT_COINS_LOSSLESS_PUBLIC_PASS',flush=True)
          # Pentacles X: publish the user's original without changing its known 11-coin composition.
          rr=session.get(base+'minor-arcana/pentacles/final/ten-of-pentacles-v1.webp?v=qa-78',timeout=45);rr.raise_for_status()
          orig=Image.open(io.BytesIO(rr.content));orig.load()
          assert orig.format=='WEBP' and list(orig.size)==[942,1670],(orig.format,orig.size)
          assert hashlib.sha256(orig.convert('RGB').tobytes()).hexdigest()=='1d7dfc8d47f87bbcd3622017e4e4e77e51128404148cc043ec1a788278e0abca','Pentacles X original pixel mismatch'
          rt=session.get(base+'minor-arcana/pentacles/thumbs/ten-of-pentacles-v1.webp?v=qa-78',timeout=35);rt.raise_for_status()
          thumb=Image.open(io.BytesIO(rt.content));thumb.load()
          assert thumb.format=='WEBP' and thumb.width<=360 and thumb.height<=640
          print('PENTACLES_X_ORIGINAL_UNCHANGED_LOSSLESS_WEBP_LIVE_PASS',flush=True)
          opts=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1360,900']:opts.add_argument(arg)
          d=webdriver.Chrome(options=opts);d.set_script_timeout(45)
          def wait_css(sel,n):
            WebDriverWait(d,20).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,sel))==n)
          try:
            d.get(base+'?qa=tarot76#/library/1')
            wait_css('.library-card',22)
            counts=d.execute_script('return [window.ARCANA_CATALOG.length,window.CUPS_APPROVED.length,window.WANDS_APPROVED.length,window.SWORDS_APPROVED.length,window.PENTACLES_APPROVED.length,Object.keys(window.ARCANA_EDITORIAL||{}).length]')
            assert counts==[22,14,14,14,14,78],counts
            suites=[('library/1',22),('library/cups',14),('library/wands',14),('library/swords',14),('library/pentacles',14)]
            for route,n in suites:
              d.execute_script('location.hash=arguments[0]','#/'+route);wait_css('.library-card',n)
              assert not d.find_elements(By.CSS_SELECTOR,'.paginator'),route
              thumb_urls=d.execute_script('return Array.from(document.querySelectorAll(".library-card img")).map(x=>x.getAttribute("src"))')
              assert all('thumb' in url for url in thumb_urls),(route,thumb_urls[:2])
              assert len(set(thumb_urls))==n,route
              print('ONE_PAGE_GALLERY_PASS',route,n,flush=True)
            for old,n in [('library/4',22),('library/cups/3',14)]:
              d.execute_script('location.hash=arguments[0]','#/'+old);wait_css('.library-card',n)
            print('LEGACY_GALLERY_ROUTES_REDIRECT_TO_FULL_GRID',flush=True)
            all_keys=[str(i) for i in range(22)]
            for suit in ['cups','wands','swords','pentacles']:
              arr=d.execute_script('return window[arguments[0]].map(x=>x.id)',{'cups':'CUPS_APPROVED','wands':'WANDS_APPROVED','swords':'SWORDS_APPROVED','pentacles':'PENTACLES_APPROVED'}[suit]);all_keys+=arr
            assert len(all_keys)==78 and len(set(all_keys))==78
            for i,key in enumerate(all_keys):
              route='#/card/'+key
              d.execute_script('location.hash=arguments[0]',route)
              WebDriverWait(d,18).until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1 and '#/card/'+key in x.current_url)
              assert len(d.find_elements(By.CSS_SELECTOR,'.quick-read'))==1,key
              assert len(d.find_elements(By.CSS_SELECTOR,'.detail-meaning-intro'))==1,key
              assert d.execute_script('return [...document.querySelectorAll(".detail-copy > .chapter")].findIndex(x=>x.classList.contains("story"))')>=4,key
              assert len(d.find_elements(By.CSS_SELECTOR,'.chapter.story p'))>=2,key
              headings=d.execute_script('return Array.from(document.querySelectorAll(".detail-copy .chapter h2")).map(x=>x.textContent.trim())')
              assert '深读 · 故事的暗线' in headings and '回到现实 · 如何理解这张牌' in headings,(key,headings)
              assert len(headings)>=9,(key,len(headings))
              body=d.find_element(By.CSS_SELECTOR,'.detail-copy').text
              assert len(body)>420,(key,len(body))
              assert not d.find_elements(By.CSS_SELECTOR,'.notfound'),key
              if i%10==0:print('DEEP_DETAIL_PROGRESS',i,key,len(body),flush=True)
            print('ALL_78_DETAILS_TWO_UNIQUE_ADDED_SECTIONS_AND_EXISTING_CONTENT_PASS',flush=True)
            for suit in ['cups','wands','swords','pentacles']:
              d.execute_script('location.hash="#/story/"+arguments[0]',suit)
              WebDriverWait(d,18).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.novella-chapter'))==5)
              assert len(d.find_elements(By.CSS_SELECTOR,'.novella-strip a'))==14,suit
              assert len(d.find_elements(By.CSS_SELECTOR,'.novella-intro p'))==3,suit
              print('FOURTEEN_CARD_NOVELLA_CHAPTERS_PASS',suit,flush=True)
            assert len(d.execute_script('return Object.keys(window.ARCANA_LITERARY_V2.beats)'))==78
            assert d.execute_script('return window.ARCANA_READING_V2.applied===true')
            assert d.execute_script('return window.ARCANA_INTERPRETATIONS_V3.count===78')
            assert d.execute_script('return Object.keys(window.ARCANA_EDITORIAL).length===78')
            print('ALL_78_REVISED_STORIES_AND_FOUR_NOVELLAS_PASS',flush=True)
            d.execute_script('location.hash="#/draw"')
            WebDriverWait(d,15).until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.pool-select button'))==2)
            assert '78张' in d.find_element(By.CSS_SELECTOR,'.pool-select').text
            d.execute_script('Math.random=()=>0.999;document.querySelector("#go-draw").click()')
            assert '星币国王' in d.find_element(By.CSS_SELECTOR,'.drawn-card').text
            d.execute_script('location.hash="#/card/pentacles/eight"')
            WebDriverWait(d,20).until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1)
            assert '星币八' in d.find_element(By.CSS_SELECTOR,'.detail-copy').text
            url=d.find_element(By.CSS_SELECTOR,'.detail-art img').get_attribute('src')
            assert 'eight-of-pentacles-v1.webp' in url,url
            print('NEW_PENTACLES_EIGHT_DETAIL_PASS',flush=True)
            d.execute_script('location.hash="#/card/pentacles/ten"')
            WebDriverWait(d,20).until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'.detail-layout'))==1 and 'pentacles/ten' in x.current_url)
            assert '星币十' in d.find_element(By.CSS_SELECTOR,'.detail-copy').text
            assert 'ten-of-pentacles-v1.webp' in d.find_element(By.CSS_SELECTOR,'.detail-art img').get_attribute('src')
            print('NEW_PENTACLES_TEN_DETAIL_AND_ART_PASS',flush=True)
            print('DRAW_POOL_78_PASS',flush=True)
            for width in [390,375,320]:
              d.set_window_size(width,844)
              for route,count in suites:
                d.execute_script('location.hash=arguments[0]','#/'+route);wait_css('.library-card',count)
                metrics=d.execute_script('return [document.documentElement.scrollWidth,window.innerWidth,document.querySelectorAll(".nav a").length]')
                if metrics[0]>metrics[1]+2:
                  elements=d.execute_script('return Array.from(document.querySelectorAll("body *")).filter(e=>e.getBoundingClientRect().right>innerWidth+2).slice(-12).map(e=>[e.tagName,String(e.className),Math.round(e.getBoundingClientRect().right)])')
                  print('OVERFLOW_DIAGNOSTIC',width,route,metrics,elements,flush=True)
                assert metrics[0]<=metrics[1]+2 and metrics[2]==4,(width,route,metrics)
              print('MOBILE_WIDTH_PASS',width,flush=True)
            print('TAROT_78_FULL_SITE_LIVE_QA_PASSED',flush=True)
          finally:d.quit()
          PY
          python /tmp/tarot76qa.py
