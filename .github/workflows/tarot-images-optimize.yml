name: Optimize finalized tarot card images
on:
  push:
    branches: [gh-pages]
    paths:
      - 'scripts/optimize_tarot_images.py'
      - '.github/workflows/tarot-images-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forbidden-arcana-image-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebP encoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Compress existing approved WebP artwork and thumbnails
        run: python scripts/optimize_tarot_images.py
      - name: Validate all 78 active card paths
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          files=['assets/arcana-catalog-v3.js','assets/cups-approved-v1.js',
                 'assets/wands-approved-v1.js','assets/swords-approved-v1.js',
                 'assets/pentacles-approved-v1.js']
          checked=set()
          for file in files:
              source=Path(file).read_text(encoding='utf-8')
              for relative in re.findall(r'\./((?:assets|minor-arcana)/[^"\s]+?\.webp)',source):
                  p=Path(relative)
                  if not p.is_file(): raise RuntimeError('Missing card image: '+relative)
                  with Image.open(p) as im: im.verify()
                  checked.add(relative)
          assert len(checked)>=156, f'Expected 78 cards + thumbnails, found {len(checked)}'
          print('VERIFIED',len(checked),'active card art paths')
          PY
      - name: Commit compressed artwork to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards assets/cards-hd assets/cards-thumb minor-arcana assets/tarot-optimization-report.json
          if git diff --cached --quiet; then
            echo "Nothing to optimize"
            exit 0
          fi
          git commit -m "Reduce tarot artwork download size without altering approved compositions"
          git push origin HEAD:gh-pages
