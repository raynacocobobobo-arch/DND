name: Tarot V3 experience QA
on:
  push:
    branches: [main]
    paths: [".github/workflows/tarot-v3-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Browser and Chinese font
        run: |
          python -m pip install --quiet selenium
          sudo apt-get update -qq && sudo apt-get install -qq -y fonts-wqy-microhei
      - name: Real-browser draw and display checks
        run: |
          cat >/tmp/qa.py <<'PY'
          import os,time,traceback,json
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.chrome.options import Options
          URL='https://raynacocobobobo-arch.github.io/DND/'
          o=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1100']:o.add_argument(a)
          d=webdriver.Chrome(options=o)
          os.makedirs('/tmp/tarot-v3-screenshots',exist_ok=True)
          def elem(sel):
            return WebDriverWait(d,20).until(EC.presence_of_element_located((By.CSS_SELECTOR,sel)))
          def tap(sel):
            e=elem(sel)
            d.execute_script("arguments[0].scrollIntoView({block:'center',behavior:'instant'});",e)
            time.sleep(.2)
            e.click()
          def route(part):
            d.execute_script("location.hash=arguments[0]",part)
            time.sleep(.25)
          def shoot(name):
            d.save_screenshot('/tmp/tarot-v3-screenshots/'+name+'.png')
          def fit(where):
            dims=d.execute_script("return {screen:window.innerWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth};")
            print('FIT',where,dims,flush=True)
            assert dims['doc']<=dims['screen']+2, 'horizontal overflow at '+where
          try:
            d.get(URL+'?v=tarot-v3-qa')
            d.execute_script("localStorage.clear()")
            d.refresh()
            elem('.new-home')
            assert not d.find_elements(By.CSS_SELECTOR,'.welcome-shade'),'unexpected consent gate'
            fit('desktop home')
            shoot('desktop-home')
            print('HERO IMAGE',d.execute_script("const e=document.querySelector('.home-main-art img');const r=e.getBoundingClientRect();return {natural:e.naturalWidth,height:e.naturalHeight,displayWidth:r.width,displayHeight:r.height};"),flush=True)
            route('#/ritual')
            elem('.consultation-layout')
            shoot('desktop-consultation')
            assert len(d.find_elements(By.CSS_SELECTOR,'.spread-option'))==3
            tap('#enterRitual')
            elem('.drawing-room')
            assert len(d.find_elements(By.CSS_SELECTOR,'.draw-fan-card'))==11
            shoot('desktop-fan')
            tap('[data-slot="4"]')
            elem('.oracle-gallery.oracle-single')
            assert len(d.find_elements(By.CSS_SELECTOR,'.oracle-card-visual'))==1
            assert len(elem('.reader-analysis').text)>220
            assert '读牌者的提醒' in elem('.reader-synthesis').text
            print('SINGLE: direct reveal PASSED',flush=True)
            print('RESULT CARD SIZE',d.execute_script("const e=document.querySelector('.oracle-art img');const r=e.getBoundingClientRect();return {natural:e.naturalWidth,height:e.naturalHeight,displayWidth:r.width,displayHeight:r.height};"),flush=True)
            assert d.execute_script("return document.querySelector('.oracle-art img').getBoundingClientRect().width")>=500, 'card art does not dominate desktop reading'
            shoot('desktop-result-single')
            tap('#drawAgain')
            elem('.drawing-room')
            tap('[data-slot="0"]')
            elem('.oracle-result')
            tap('#restartAfter')
            tap('.spread-option[data-spread="three"]')
            elem('#question').send_keys('我和伴侣的关系里现在要注意什么？')
            tap('#enterRitual')
            for ix in [2,6,9]:
              tap('[data-slot="'+str(ix)+'"]')
              if ix!=9:
                assert len(d.find_elements(By.CSS_SELECTOR,'.picked-card'))==([2,6].index(ix)+1)
            elem('.oracle-gallery.oracle-triple')
            assert len(d.find_elements(By.CSS_SELECTOR,'.oracle-card-visual'))==3
            assert '三张牌之间的关系' in elem('.reader-synthesis').text
            assert '关于情感' in elem('.reader-analysis').text
            print('THREE: auto reveal and contextual reading PASSED',flush=True)
            shoot('desktop-result-three')
            route('#/ritual')
            tap('#restartAfter')
            tap('.spread-option[data-spread="daily"]')
            tap('#enterRitual')
            elem('.oracle-gallery.oracle-single')
            assert not d.find_elements(By.CSS_SELECTOR,'.draw-fan-card')
            print('DAILY: single-tap result PASSED',flush=True)
            test=d.execute_script("""
              let original=cryptoRandom;
              cryptoRandom=()=>0;
              const a=getDailyDraw().cards[0].id,b=getDailyDraw().cards[0].id;
              cryptoRandom=original;
              return {a,b};
            """)
            assert test['a']==test['b']==0, 'same-card draw artificially prohibited'
            print('INDEPENDENT CHANCE: consecutive repeats are permitted',test,flush=True)
            route('#/codex')
            assert len(d.find_elements(By.CSS_SELECTOR,'.codex-card'))==22
            tap('.codex-card[href="#/codex/0"]')
            elem('.story-immersive')
            page=elem('.story-prose').text
            assert all(x in page for x in ['旧日传说','牌面秘语','正位','逆位'])
            assert '艺术改编' not in page and '改编并非' not in page
            shoot('desktop-story')
            print('CODEX: 22 illustrated narrative cards PASSED',flush=True)
            # Reload before offline to ensure service worker controls the page.
            d.refresh()
            info=d.execute_async_script("""
              let done=arguments[0];navigator.serviceWorker.ready.then(async reg=>{
                let keys=await(await caches.open('forbidden-arcana-v2-20261025')).keys();
                done({active:reg.active?.state,cached:keys.length});
              }).catch(e=>done({error:e.message}));
            """)
            print('SERVICE WORKER',info,flush=True)
            d.execute_cdp_cmd('Network.enable',{})
            d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':True,'latency':0,'downloadThroughput':0,'uploadThroughput':0})
            d.get(URL+'?v=offline-test#/ritual')
            elem('.consultation-form')
            tap('#enterRitual')
            tap('[data-slot="1"]')
            assert len(elem('.reader-analysis').text)>200
            print('OFFLINE: card draw and guidance PASSED',flush=True)
            d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':False,'latency':0,'downloadThroughput':-1,'uploadThroughput':-1})
            d.set_window_size(390,844)
            d.get(URL+'?v=tarot-v3-mobile')
            elem('.new-home')
            fit('mobile home')
            assert d.execute_script("return getComputedStyle(document.querySelector('.home-mobile-cta')).display")!='none', 'mobile CTA not visible'
            shoot('mobile-home')
            route('#/ritual')
            elem('.consultation-form')
            fit('mobile consultation')
            formTop=d.execute_script("return document.querySelector('.consultation-form').getBoundingClientRect().top")
            assert formTop<380, 'form hidden under hero art on mobile'
            shoot('mobile-consultation')
            tap('#enterRitual')
            elem('.reading-fan')
            fit('mobile draw fan')
            assert d.execute_script("return scrollY")<=2, 'draw fan unexpectedly opens scrolled down'
            shoot('mobile-fan')
            tap('[data-slot="1"]')
            elem('.oracle-gallery.oracle-single')
            fit('mobile result')
            shoot('mobile-result')
            route('#/codex/5')
            elem('.story-immersive')
            fit('mobile story')
            shoot('mobile-story')
            print('ALL V3 BROWSER CHECKS PASSED',flush=True)
          except Exception:
            print('FAILED',traceback.format_exc(),flush=True)
            print('BODY',d.find_element(By.TAG_NAME,'body').text[:1400],flush=True)
            shoot('failure')
            raise
          finally:
            try:print('BROWSER LOGS',d.get_log('browser'),flush=True)
            except Exception:pass
            d.quit()
          PY
          python /tmp/qa.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarot-v3-screenshots
          path: /tmp/tarot-v3-screenshots
