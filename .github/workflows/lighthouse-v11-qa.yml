name: Lighthouse V11 Kraken animation preview QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'lighthouse/v11-*.js'
      - 'lighthouse/v11-preview.html'
      - '.github/workflows/lighthouse-v11-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/lighthouse-v11
          npm --prefix /tmp/lighthouse-v11 install --no-audit --no-fund playwright@1.56.1
          /tmp/lighthouse-v11/node_modules/.bin/playwright install chromium
      - name: Check one Kraken, curved night emergence, day suppression and original geometry
        env:
          NODE_PATH: /tmp/lighthouse-v11/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/lighthouse-v11-http.log 2>&1 &
          mkdir -p lighthouse/v11-qa-output
          cat >/tmp/lighthouse-v11/test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              '--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage'
            ]});
            const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure().errorText));
            await page.goto('http://127.0.0.1:8765/lighthouse/v11-preview.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.body.dataset.rendered==='true',{timeout:28000});
            const base=await page.evaluate(()=>({
              version:document.body.dataset.version,
              meshCount:Number(document.body.dataset.meshCount||0),
              geometryAudit:document.body.dataset.geometryAudit,
              waterFactor:Number(document.body.dataset.waterAreaFactor||0),
              tyreCount:Number(document.body.dataset.tyreCount||0),
              mode:document.body.dataset.mode,
              kraken:window.__lighthouseKraken?.getState()
            }));
            // Day mode hides the tentacle instantly, including if an event was rising.
            await page.locator('#mode-day').click();
            await page.waitForTimeout(350);
            const day=await page.evaluate(()=>window.__lighthouseKraken.getState());
            await page.screenshot({path:'lighthouse/v11-qa-output/day-no-kraken.png'});
            // Switching into night restarts a fresh random 5-10 second waiting period.
            await page.locator('#mode-night').click();
            const before=await page.evaluate(()=>window.__lighthouseKraken.getState());
            await page.screenshot({path:'lighthouse/v11-qa-output/night-idle.png'});
            // Use the same production animation, with an immediate trigger only for reproducible QA.
            const triggered=await page.evaluate(()=>window.__lighthouseKraken.forceEvent());
            await page.waitForTimeout(1450);
            const rising=await page.evaluate(()=>window.__lighthouseKraken.getState());
            await page.screenshot({path:'lighthouse/v11-qa-output/curving-out.png'});
            await page.waitForTimeout(1600);
            const extended=await page.evaluate(()=>window.__lighthouseKraken.getState());
            await page.screenshot({path:'lighthouse/v11-qa-output/night-full-tentacle.png'});
            await page.waitForTimeout(3200);
            const nearReturn=await page.evaluate(()=>window.__lighthouseKraken.getState());
            await page.screenshot({path:'lighthouse/v11-qa-output/curled-return.png'});
            // Verify night-to-day switch suppresses any remaining tentacle and leaves original site.
            await page.locator('#mode-day').click();
            const finalDay=await page.evaluate(()=>window.__lighthouseKraken.getState());
            await page.screenshot({path:'lighthouse/v11-qa-output/day-after-event.png'});
            const result={base,day,before,triggered,rising,extended,nearReturn,finalDay,errors};
            console.log('V11_KRAKEN_QA',JSON.stringify(result));
            await browser.close();
            if(base.version!=='v11a'||base.meshCount<210||base.geometryAudit!=='pass'||
               base.tyreCount!==6||Math.abs(base.waterFactor-2)>.0001||
               base.kraken?.count!==1||base.kraken?.suckers!==24||
               day.night!==false||day.visible!==false||before.phase!=='waiting'||
               before.wait<5||before.wait>10||!triggered||
               rising.visible!==true||rising.growth<.2||rising.growth>.95||
               extended.visible!==true||extended.growth<.98||
               extended.bend<.55||extended.tipHeight<1.40||
               nearReturn.phase==='waiting'||
               finalDay.night!==false||finalDay.visible!==false||
               errors.length>0)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lighthouse-v11/test.cjs
      - name: Upload day, night, emergence and retreat screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v11-kraken-preview
          path: lighthouse/v11-qa-output/
          if-no-files-found: warn
