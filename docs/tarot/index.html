<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07131b"><title>禁忌之书 · 克苏鲁塔罗</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07131b;color:#e8d7b7;font-family:Georgia,"Noto Serif SC",serif}.loading{max-width:620px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}.sigil{font-size:58px;color:#c5a16b;margin-bottom:26px}.eyebrow{font:12px sans-serif;letter-spacing:.25em;color:#b89a6a}h1{font-size:clamp(30px,7vw,54px);font-weight:400;letter-spacing:.16em}p{line-height:1.9;color:#baad98}button{margin-top:20px;border:1px solid #b69a6c;background:transparent;color:#e8d7b7;padding:12px 28px;cursor:pointer}</style>
</head><body><main class="loading"><div class="sigil">✦</div><div class="eyebrow">THE FORBIDDEN ARCANA</div><h1>禁忌之书</h1><p id="status" role="status">正在载入22张大阿卡纳与禁忌档案……</p><button type="button" id="retry" hidden onclick="location.reload()">重新尝试</button></main>
<script>
(async function(){
const status=document.getElementById('status');
try{
const chunks=await Promise.all(Array.from({length:13},(_,i)=>i).map(async i=>{
 const name=String(i).padStart(2,'0');
 const r=await fetch('./parts/'+name+'.txt');
 if(!r.ok) throw new Error('卡牌资源 '+name+' 加载失败 ('+r.status+')');
 return await r.text();
}));
const page=chunks.join('');
if(page.length<4400000||!page.includes('</html>')||!page.includes('data:image/'))throw Error('卡牌资源校验失败');
document.open();document.write(page);document.close();
}catch(error){
status.textContent='网站资源暂时加载失败，请刷新重试。'+String(error?.message||error);
document.getElementById('retry').hidden=false;
}
})();
</script></body></html>
