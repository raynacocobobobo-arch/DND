/* Fixed-entry, one-tap home */
.quick-top{position:sticky;top:0;z-index:20;background:#27221a;color:#fff;border-radius:20px;padding:20px 22px 17px;box-shadow:0 9px 26px #27221a1c;margin-bottom:22px}
.quick-topline{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.quick-metric-label{font-size:12px;color:#463b23;font-weight:650}
.quick-metric-large{font-size:38px;line-height:1.1;font-weight:790;letter-spacing:-1.4px;margin-top:3px;font-variant-numeric:tabular-nums}
.quick-metric-large small{font-size:12px;font-weight:500;color:#463b23;margin-left:4px;letter-spacing:0}
.quick-week-meta{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.quick-week-meta strong{font-size:22px;line-height:1.2;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.quick-week-meta small{font-size:11px;color:#463b23}
.quick-bar{height:7px;background:#c99216;border-radius:20px;overflow:hidden;margin:14px 0 7px}
.quick-bar-fill{height:100%;background:#463b23;border-radius:20px;transition:width .2s}
.quick-barline{display:flex;justify-content:space-between;gap:10px;color:#463b23;font-size:11px}
.quick-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 1px 13px}
.quick-section-title h2{font-size:18px;font-weight:780;margin:0;letter-spacing:-.35px}
.quick-section-title span{font-size:11px;color:var(--sub)}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.quick-card{margin:0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 16px 15px;min-width:0;box-shadow:0 4px 16px #27221a08}
.quick-cardhead{display:flex;gap:9px;align-items:center}
.quick-bubble{height:36px;width:36px;flex-shrink:0;background:#29251d;border-radius:11px;color:#c99216;display:grid;place-items:center}
.quick-cardtitle{font-size:16px;font-weight:780;color:#27221a}
.quick-cardnote{font-size:11px;color:#e3ae2d;margin-top:3px;white-space:nowrap}
.quick-inputline{display:flex;align-items:center;gap:5px;margin-top:16px}
.quick-countbox{display:flex;align-items:center;flex:1;min-width:0;border:1px solid #29251d;border-radius:11px;overflow:hidden;background:#29251d}
.quick-countbox button{appearance:none;background:none;border:0;height:42px;min-width:30px;padding:0;font-size:20px;font-weight:500;color:#c99216}
.quick-countbox input{width:100%;min-width:0;height:42px;border:0;background:transparent;text-align:center;font-size:17px;font-weight:790;color:#27221a;padding:0;outline:0;font-variant-numeric:tabular-nums}
.quick-countbox input::-webkit-inner-spin-button,.quick-countbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.quick-countbox input[type=number]{-moz-appearance:textfield}
.quick-unit{font-size:12px;color:#e3ae2d;width:23px;flex:none}
.quick-save{width:100%;border:0;border-radius:10px;background:#c99216;color:#fff;font-size:13px;font-weight:750;padding:12px;min-height:42px;margin-top:12px}
.quick-save:active{background:#27221a}
.quick-estimate{font-size:11px;color:#e3ae2d;margin-top:9px;text-align:center}
.quick-estimate strong{color:#c99216}
.quick-recent{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.quick-recent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.quick-recent-head strong{font-size:15px}
.quick-recent-head button{border:0;background:transparent;color:#c99216;font-size:12px;font-weight:750}
.quick-recent-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #29251d}
.quick-recent-label{min-width:0;flex:1}
.quick-recent-label strong{font-size:13px;display:block}
.quick-recent-label small{font-size:11px;color:#e3ae2d}
.quick-recent-kcal{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.quick-quiet{font-size:11px;color:#e3ae2d;margin:12px 3px 0;line-height:1.6}
@media(max-width:800px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-card{padding:14px 12px 12px}.quick-cardtitle{font-size:15px}.quick-cardnote{font-size:10px;white-space:normal}.quick-bubble{width:31px;height:31px}.quick-top{padding:16px 17px 15px}.quick-metric-large{font-size:34px}.quick-week-meta strong{font-size:21px}}
@media(max-width:390px){.quick-top{border-radius:15px;margin-left:-7px;margin-right:-7px}.quick-week-meta strong{font-size:19px}.quick-bubble{width:29px;height:29px}.quick-card{padding:13px 10px}.quick-countbox button{min-width:27px}.quick-cardhead{gap:6px}}

/* V1.1 calendar and daily rest-day check-ins */
.checkin-strip{border:1px solid var(--line);border-radius:19px;background:#fff;padding:16px 18px;margin:0 0 22px}
.checkin-strip-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.checkin-strip-header strong{font-size:14px}.checkin-strip-header button{border:0;background:none;color:#c99216;font-size:12px;font-weight:750}
.checkin-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.checkin-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;border-radius:12px;border:1px solid transparent;background:#29251d;min-width:0}
.checkin-day.today{border-color:#896a29}.checkin-day .weekday{color:#e3ae2d;font-size:10px}
.checkin-day .day-circle{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:750}
.checkin-day.workout .day-circle{background:#c99216;color:#fff}
.checkin-day.rest .day-circle{background:#29251d;color:#c99216}
.checkin-day.none .day-circle{color:#e3ae2d}
.checkin-day .day-signal{font-size:9px;color:#e3ae2d;white-space:nowrap}
.checkin-footer{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:12px}
.checkin-footer span{color:var(--sub);font-size:11px}
.rest-check-button{background:#29251d;color:#c99216;border:1px solid #463b23;font-weight:750;font-size:12px;padding:9px 12px;border-radius:10px;min-height:37px;white-space:nowrap}
.rest-check-button:disabled{opacity:.65;cursor:default}
.cal-shell{max-width:880px;margin:0 auto}
.cal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.cal-month-label{font-size:21px;font-weight:800;letter-spacing:-.35px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav button{background:#29251d;border:1px solid var(--line);color:#c99216;border-radius:10px;min-width:39px;height:38px;font-size:21px;font-weight:600}

<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><span class="brand-symbol"><img src="./icon-180.png" width="39" height="39" alt="" /></span><div><h1>健身记录</h1><small>FITNESS JOURNAL</small></div></div><nav class="nav" id="desktopNav"></nav><div class="side-foot"><strong>专注记录，不消耗 Token</strong>训练可离线记录，登录后可与云端同步。</div></aside>
  <main class="main"><div id="content"></div><p class="footer-disclaimer">运动热量为简化估算，并非实际测量结果 · 可选云端同步</p></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />
<script>
'use strict';
const SEED_RECORDS = [];
const STORAGE_KEY = 'hermes_fitness_journal_v1';
const DEFAULT_SETTINGS={weight:65,weeklyGoal:1500};
const STEP_KINDS=[['gym','健身房'],['bike','骑车'],['transport','乘车'],['other','其他']];
const CATEGORIES=[['strength','力量'],['cardio','有氧'],['swimming','游泳'],['walking','步行'],['hold','静态']];
const DAY_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
const WEEK_SHORT=['一','二','三','四','五','六','日'];
const PLANS={
  1:{place:'游泳馆',label:'蛙泳训练',items:[{type:'swimming',exercise:'蛙泳',distanceM:1000,laps:20,caption:'20–25 来回 · 1000–1250 米'}]},
  2:{place:'健身房',label:'有氧 + 器械力量',items:[{type:'cardio',exercise:'椭圆机',durationMin:30},{type:'strength',exercise:'推胸',sets:4,repsPerSet:12,loadKg:12},{type:'strength',exercise:'拉背',sets:4,repsPerSet:12,loadKg:25},{type:'strength',exercise:'引体向上',sets:4,repsPerSet:12,loadKg:65}]},
  3:{place:'居家',label:'居家力量训练',items:[{type:'strength',exercise:'杠铃弯举',sets:4,repsPerSet:15,loadKg:3},{type:'strength',exercise:'杠铃推举',sets:4,repsPerSet:15,loadKg:3},{type:'strength',exercise:'臀桥',sets:4,repsPerSet:15},{type:'hold',exercise:'平板支撑',sets:4,secondsPerSet:45},{type:'strength',exercise:'仰卧起坐',sets:4,repsPerSet:15}]},
  4:{place:'游泳馆',label:'蛙泳训练',items:[{type:'swimming',exercise:'蛙泳',distanceM:1000,laps:20,caption:'20–25 来回 · 1000–1250 米'}]},
  5:{place:'健身房',label:'有氧 + 器械力量',items:[{type:'cardio',exercise:'椭圆机',durationMin:30},{type:'strength',exercise:'推胸',sets:4,repsPerSet:12,loadKg:12},{type:'strength',exercise:'拉背',sets:4,repsPerSet:12,loadKg:25},{type:'strength',exercise:'引体向上',sets:4,repsPerSet:12,loadKg:65}]},
  6:{place:'居家',label:'居家力量训练',items:[{type:'strength',exercise:'杠铃弯举',sets:4,repsPerSet:15,loadKg:3},{type:'strength',exercise:'杠铃推举',sets:4,repsPerSet:15,loadKg:3},{type:'strength',exercise:'臀桥',sets:4,repsPerSet:15},{type:'hold',exercise:'平板支撑',sets:4,secondsPerSet:45},{type:'strength',exercise:'仰卧起坐',sets:4,repsPerSet:15}]},
  0:{place:'休息',label:'恢复日',items:[]}
};
const icons={overview:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>',training:'<path d="M6.5 6.5 17.5 17.5M5 9l4-4M15 19l4-4M3 7l4-4M17 21l4-4"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15l2 2 5-5"/>',steps:'<path d="M3 17h4l3-4 4 5 7-10M16 8h5v5"/>',settings:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/>',activity:'<path d="M3 12h4l3-6 4 12 3-6h4"/>',swimming:'<path d="M3 18c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2M8 13l4-4 4 4M9 5h.01"/>',walking:'<circle cx="13" cy="4" r="2"/><path d="m7 21 3-7-2-3 3-3 4 3 2 4M15 21l-3-5"/>',hold:'<path d="M3 18h18M6 14h12M9 10h6M12 4v6"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.activity}</svg>`}
const clone=o=>JSON.parse(JSON.stringify(o));
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'record-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function localDate(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function dateFromISO(s){const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d=new Date()){return addDays(d,-((d.getDay()+6)%7))}
function formatDate(s){const d=dateFromISO(s);return `${d.getMonth()+1}月${d.getDate()}日`}
function getWeekDates(){let m=monday(new Date());return Array.from({length:7},(_,i)=>localDate(addDays(m,i)))}
function initialState(){return {version:1,settings:{...DEFAULT_SETTINGS},records:SEED_RECORDS.map((r,i)=>({...r,id:'original-'+i,createdAt:r.date+'T09:00:00',original:true})),stepDiary:{}}}

const RECOVERY_KEY='hermes_fitness_journal_recovery_v1';
let storageReadIssue='';
function parsedFitnessState(raw){
 if(typeof raw!=='string'||!raw)return null;
 try{const v=JSON.parse(raw);return v&&typeof v==='object'&&!Array.isArray(v)&&
  Array.isArray(v.records)&&v.settings&&typeof v.settings==='object'?v:null}catch(e){return null}
}
function archivePriorFitnessData(raw){
 if(!raw)return true;
 try{
  const old=parsedFitnessState(raw),existing=parsedFitnessState(localStorage.getItem(RECOVERY_KEY));
  if(!old){
   // Preserve malformed original bytes separately before an explicitly approved import.
   localStorage.setItem('hermes_fitness_unreadable_original_v1',raw);return true;
  }
  if(old.records.length>(existing?.records.length||0))
   localStorage.setItem(RECOVERY_KEY,raw);
  return true;
 }catch(e){return false}
}
function readState(){
 let raw;
 try{raw=localStorage.getItem(STORAGE_KEY)}
 catch(e){storageReadIssue='浏览器存储不可读取';return initialState()}
 if(raw===null)return initialState();
 const v=parsedFitnessState(raw);
 if(!v){storageReadIssue='检测到无法解析的原有记录，已禁止自动覆盖';return initialState()}
 return {version:1,records:v.records,settings:{...DEFAULT_SETTINGS,...v.settings},stepDiary:cleanStepDiary(v.stepDiary)};
}
let state=readState(),view='overview',historyFilter='week',historySelectedDate=null,draft=emptyDraft('strength');
function persist(){
 if(storageReadIssue){toast('原有数据读取异常：已停止写入以保护记录');return false}
 try{
  const next=JSON.stringify(state),prior=localStorage.getItem(STORAGE_KEY);
  if(prior!==next&&prior!==null&&!archivePriorFitnessData(prior)){
   toast('无法创建保护快照，未写入新数据');return false;
  }
  localStorage.setItem(STORAGE_KEY,next);
  return true;
 }catch(e){toast('浏览器存储失败，原数据未改写');return false}
}
function recoveryState(){
 try{return parsedFitnessState(localStorage.getItem(RECOVERY_KEY))}catch(e){return null}
}
function restoreFitnessSnapshot(){
 const saved=recoveryState();
 if(!saved||!saved.records.length){toast('当前浏览器没有可恢复的记录快照');return false}
 if(!confirm('找到 '+saved.records.length+' 条本地保护快照，确定用它替换当前 '+state.records.length+' 条训练记录吗？'))return false;
 const prior=state,wasBlocked=storageReadIssue;
 if(wasBlocked){
  try{if(!archivePriorFitnessData(localStorage.getItem(STORAGE_KEY))){toast('无法保护原始内容，已取消恢复');return false}}
  catch(e){toast('原始内容备份失败，已取消恢复');return false}
 }
 storageReadIssue='';
 state={version:1,records:saved.records,settings:{...DEFAULT_SETTINGS,...saved.settings},stepDiary:cleanStepDiary(saved.stepDiary)};
 if(!persist()){state=prior;storageReadIssue=wasBlocked;return false}
 view='history';historySelectedDate=null;render();toast('已恢复本地快照：'+saved.records.length+' 条记录');return true;
}

function emptyDraft(type='strength'){return {id:null,date:localDate(),type,exercise:type==='cardio'?'椭圆机':type==='swimming'?'蛙泳':type==='hold'?'平板支撑':'拉背',sets:4,repsPerSet:15,durationMin:type==='swimming'?'':20,laps:type==='swimming'?20:'',distanceM:'',legacySwimming:false,loadKg:'',secondsPerSet:45,steps:5000}}
function prettyType(type){return ({strength:'力量',cardio:'有氧',swimming:'游泳',walking:'步行',hold:'静态保持'})[type]||'训练'}
function describePlanItem(item){if(item.caption)return item.caption;if(item.type==='strength')return `${item.sets} 组 × ${item.repsPerSet} 次${item.loadKg?` · ${item.loadKg} kg`:''}`;if(item.type==='swimming')return `${item.laps||0} 来回 · ${(Number(item.laps)||0)*50} 米`;if(item.type==='cardio')return `${item.durationMin} 分钟`;if(item.type==='hold')return `${item.sets} 组 × ${item.secondsPerSet} 秒`;return '自行填写'}
function calc(d){
 const w=Number(state.settings.weight)||65;
 const exercise=String(d.exercise||'').trim();
 const preset=QUICK_ITEMS.find(q=>q.key===d.presetKey)||
  QUICK_ITEMS.find(q=>q.exercise===exercise&&q.type===d.type)||
  (d.type==='walking'?QUICK_ITEMS.find(q=>q.key==='steps'):null);
 if(d.type==='swimming'&&d.legacySwimming){
  const mins=Number(d.durationMin);
  const legacyRate=Number(state.settings.exerciseProfiles?.swim?.rate);
  const defaultRate=6*3.5*w/200;
  return mins>0?Math.round(mins*(Number.isFinite(legacyRate)&&state.settings.exerciseProfiles?.swim?.rate!==undefined?legacyRate:defaultRate)):null;
 }
 if(d.type==='swimming'&&!d.legacySwimming){
  const laps=Number(d.laps);
  if(!Number.isInteger(laps)||laps<1)return null;
  return Math.round(laps*exerciseProfile(preset||QUICK_ITEMS.find(q=>q.key==='swim')).rate);
 }
 if(preset){
  const p=exerciseProfile(preset);
  if(d.type==='strength'){const sets=Number(d.sets),reps=Number(d.repsPerSet);return sets>0&&reps>0?Math.round(sets*reps*p.rate):null}
  if(d.type==='hold'){const sets=Number(d.sets),seconds=Number(d.secondsPerSet);return sets>0&&seconds>0?Math.round(sets*seconds/60*p.rate):null}
  if(d.type==='walking'){const steps=Number(d.steps);return steps>0?Math.round(steps/1000*p.rate):null}
  if(d.type==='cardio'||d.type==='swimming'){const mins=Number(d.durationMin);return mins>0?Math.round(mins*p.rate):null}
 }
 let total=0;
 switch(d.type){
  case 'strength':{const reps=Number(d.sets)*Number(d.repsPerSet);if(!(reps>0))return null;total=(exercise==='仰卧起坐'?0.15*w/68:0.22)*reps;break}
  case 'cardio':case 'swimming':{const minutes=Number(d.durationMin);if(!(minutes>0))return null;const met=d.type==='swimming'?6:exercise==='自行车'?6:5;total=met*3.5*w/200*minutes;break}
  case 'walking':{if(!(Number(d.steps)>0))return null;total=0.04*(w/70)*Number(d.steps);break}
  case 'hold':{const secs=Number(d.sets)*Number(d.secondsPerSet);if(!(secs>0))return null;total=3*3.5*w/200*(secs/60);break}
  default:return null;
 }
 return Math.round(total);
}
function newRecord(d){const c=calc(d);if(c===null||!Number.isFinite(c))throw new Error('请填写有效训练数量');const date=d.date, type=d.type,ex=(d.exercise||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(dateFromISO(date).getTime()))throw new Error('日期格式不正确');if(['strength','cardio','swimming','hold'].includes(type)&&!ex)throw new Error('请输入运动名称');const r={id:d.id||uid(),date,type,calories:c,createdAt:d.id?state.records.find(x=>x.id===d.id)?.createdAt||new Date().toISOString():new Date().toISOString(),weightAtRecord:state.settings.weight};if(type==='strength'){const s=Number(d.sets),p=Number(d.repsPerSet);if(!Number.isInteger(s)||!Number.isInteger(p)||s<1||p<1)throw new Error('组数和次数需要是正整数');r.exercise=ex;r.sets=s;r.repsPerSet=p;r.reps=s*p;if(d.loadKg!==''&&Number(d.loadKg)>=0)r.loadKg=Number(d.loadKg);r.note=`${ex} ${s}组×${p}次`}
else if(type==='cardio'){r.exercise=ex;r.duration_min=Number(d.durationMin);r.note=`${ex} ${r.duration_min}分钟`}
else if(type==='swimming'){r.stroke=ex;if(d.legacySwimming){const minutes=Number(d.durationMin);if(!(minutes>0))throw new Error('旧记录需填写有效时长');r.duration_min=minutes;if(d.distanceM!==''&&Number(d.distanceM)>0)r.distance_m=Number(d.distanceM);r.note=`${ex} ${minutes}分钟（旧记录）`}else{const laps=Number(d.laps);if(!Number.isInteger(laps)||laps<1||laps>300)throw new Error('请输入有效的来回数');r.laps=laps;r.distance_m=laps*50;r.note=`${ex} ${laps}来回 · ${r.distance_m}米`}}
else if(type==='walking'){r.steps=Number(d.steps);if(!Number.isInteger(r.steps)||r.steps<1)throw new Error('步数需要是正整数');r.note=`步行${r.steps}步`}
else if(type==='hold'){r.exercise=ex;r.sets=Number(d.sets);r.secondsPerSet=Number(d.secondsPerSet);if(!Number.isInteger(r.sets)||r.sets<1||!(r.secondsPerSet>0))throw new Error('请填写有效组数与秒数');r.duration_sec=r.sets*r.secondsPerSet;r.note=`${ex} ${r.sets}组×${r.secondsPerSet}秒`}
if(d.presetKey)r.presetKey=d.presetKey;return r}
function totalRecs(list){return list.reduce((n,r)=>n+(Number(r.calories)||0),0)}
function recordsOfDate(date){return state.records.filter(r=>r.date===date)}
function viewTitle(){return {overview:['健身记录',''],steps:['手动步数',''],calendar:['训练日历','运动自动打卡，休息日可手动标记。'],training:[draft.id?'编辑训练记录':'记录运动','输入实际完成量，即时估算热量消耗。'],history:['训练历史','按日期查看和修改每一条记录。'],settings:['偏好与数据','体重、目标和备份，都由你控制。']}[view]}
function navHTML(){return [['overview','打卡'],['steps','手动步数'],['calendar','日历'],['history','历史'],['settings','设置']].map(([k,t])=>`<button type="button" class="nav-btn ${view===k?'active':''}" data-view="${k}" ${view===k?'aria-current="page"':''}>${icon(k)}<span>${t}</span></button>`).join('')}
function render(){document.body.dataset.screen=view;document.getElementById('desktopNav').innerHTML=navHTML();document.getElementById('mobileNav').innerHTML=navHTML();const [heading,sub]=viewTitle();const top=view==='overview'?'':`<header class="topline"><div><div class="eyebrow">FITNESS RECORD · V3.2.0</div><h1 class="page-title">${safe(heading)}</h1><div class="page-sub">${safe(sub)}</div></div><span class="date-chip">${safe(formatDate(localDate()))} · ${DAY_NAMES[new Date().getDay()]}</span></header>`;document.getElementById('content').innerHTML=top+({overview:renderQuickHome,steps:renderStepDedup,calendar:renderCalendar,training:renderTraining,history:renderHistory,settings:renderSettings}[view]())}
function renderOverview(){const today=localDate(),wk=getWeekDates(),byDay=wk.map(day=>totalRecs(recordsOfDate(day))),wTotal=byDay.reduce((a,b)=>a+b,0),dTotal=totalRecs(recordsOfDate(today)),goal=Number(state.settings.weeklyGoal)||1500,pct=Math.round(wTotal/goal*100),highest=Math.max(...byDay,goal/7,1),plan=PLANS[new Date().getDay()],tomorrow=PLANS[(new Date().getDay()+1)%7];return `
 <div class="overview-grid"><section class="card hero"><div><div class="hero-label">今日已记录消耗</div><div class="big-number">${dTotal}<small>千卡 kcal</small></div></div><div class="hero-bottom"><div class="hero-hint">${recordsOfDate(today).length?`今天已记 ${recordsOfDate(today).length} 项运动，继续完成下一组。`:'今天还没有记录，开始添加第一项训练。'}</div><button type="button" class="hero-btn" data-view="training">＋ 记录运动</button></div></section><div class="hero-stats"><section class="card stat"><span class="label">本周累计</span><div class="num">${wTotal}<small>kcal</small></div><span class="note">周目标 ${goal.toLocaleString('zh-CN')} kcal</span></section><section class="card stat"><span class="label">本周已记录</span><div class="num">${state.records.filter(r=>wk.includes(r.date)).length}<small>条</small></div><span class="note">实际训练记录</span></section></div></div>
 <div class="overview-grid section-block"><section class="card"><div class="section-title"><div><h2>本周运动消耗</h2><p>${formatDate(wk[0])} — ${formatDate(wk[6])}</p></div><span class="date-chip">${pct}% 目标</span></div><div class="week-chart">${byDay.map((v,i)=>`<div class="bar-col ${wk[i]===today?'today':''}" title="${safe(wk[i])}：${v} 千卡"><div class="bar-rail"><div class="bar-fill" style="height:${v?Math.max(v/highest*100,4):0}%"></div></div><span class="bar-label">周${WEEK_SHORT[i]}</span></div>`).join('')}</div><div class="week-total"><span>已完成 <strong>${wTotal}</strong> / ${goal} kcal</span><strong>${pct}%</strong></div><div class="progress-track" role="progressbar" aria-label="每周目标进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(pct,100)}"><div class="progress-bar" style="width:${Math.min(pct,100)}%"></div></div></section>
 <section class="card"><div class="section-title"><div><h2>训练记录总览</h2><p>本地保存 · 支持导入历史</p></div><button type="button" class="link-btn" data-view="history">查看历史</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:17px;padding:20px 0"><div class="stat"><span class="label">累计估算消耗</span><div class="num" style="font-size:29px">${totalRecs(state.records).toLocaleString('zh-CN')}<small>kcal</small></div></div><div class="stat"><span class="label">累计记录</span><div class="num" style="font-size:29px">${state.records.length}<small>条</small></div></div></div><p class="micro-note">仅在当前浏览器保存训练记录。可在“设置”导入原有历史 JSON，所有新增记录仅在本设备保存。</p></section></div>
 <div class="plan-grid section-block"><section class="card"><div class="section-title"><div><h2>今日训练计划 · ${DAY_NAMES[new Date().getDay()]}</h2><p>${plan.place} / ${plan.label}</p></div><button class="link-btn" data-view="training">自由记录</button></div>${plan.items.length?plan.items.map((item,i)=>`<div class="plan-item"><div><div class="plan-name">${safe(item.exercise)}</div><div class="plan-description">${safe(describePlanItem(item))}</div></div><button type="button" class="mini-btn" data-plan="${new Date().getDay()}-${i}">填写</button></div>`).join(''):`<div class="empty-state"><strong>今天是恢复日</strong><p>不安排固定训练，也可以自由记录散步或其他活动。</p></div>`}</section><section class="card"><div class="section-title"><div><h2>按自己的节奏记录</h2><p>计划仅供参考，实际完成多少就填多少。</p></div></div><p style="font-size:13px;color:var(--sub);margin:0">力量训练输入组数、每组次数；有氧和游泳输入时长；步行输入步数。点击保存后，今日和本周数据立刻更新。</p><div class="next-day-card"><div class="smallcap">明日计划 · ${DAY_NAMES[(new Date().getDay()+1)%7]}</div><strong>${tomorrow.label}</strong><p>${tomorrow.place}${tomorrow.items.length?` · ${tomorrow.items.length} 项动作`:' · 休息'}</p></div><button type="button" class="secondary-btn" style="width:100%;margin-top:17px" data-view="training">新建一条训练记录</button></section></div>`}
function field({key,label,value,type='number',step='1',unit='',full=false,placeholder='',min='0',hint=''}){const input=`<input class="input" id="f-${key}" name="${key}" type="${type}" ${type==='number'?`inputmode="decimal" step="${step}" min="${min}"`:''} value="${safe(value??'')}" placeholder="${safe(placeholder)}" autocomplete="off" />`;return `<div class="field ${full?'full':''}"><label for="f-${key}">${safe(label)}</label>${unit?`<div class="unitbox">${input}<span>${safe(unit)}</span></div>`:input}${hint?`<p class="hint">${safe(hint)}</p>`:''}</div>`}
function renderTypeFields(){let s='';if(draft.type==='strength'){s=field({key:'exercise',label:'动作名称',value:draft.exercise,type:'text',full:true,placeholder:'例如：拉背、划船、推胸'})+field({key:'sets',label:'完成组数',value:draft.sets,unit:'组',min:1})+field({key:'repsPerSet',label:'每组次数',value:draft.repsPerSet,unit:'次',min:1})+field({key:'loadKg',label:'器械重量 / 辅助重量（可选）',value:draft.loadKg,unit:'kg',step:0.5,hint:'仅作训练记录，不参与估算'})}
else if(draft.type==='cardio'){s=field({key:'exercise',label:'有氧项目',value:draft.exercise,type:'text',full:true,placeholder:'如：椭圆机'})+field({key:'durationMin',label:'实际时长',value:draft.durationMin,unit:'分钟',step:0.5,min:.5})}
else if(draft.type==='swimming'){s=field({key:'exercise',label:'泳姿',value:draft.exercise,type:'text',full:true,placeholder:'如：蛙泳'})+(draft.legacySwimming?field({key:'durationMin',label:'旧记录时长',value:draft.durationMin,unit:'分钟',step:0.5,min:.5,hint:'原记录按分钟保存，仅编辑旧数据时保留该字段'})+field({key:'distanceM',label:'原记录距离（可选）',value:draft.distanceM,unit:'米',step:1}):field({key:'laps',label:'游泳来回数',value:draft.laps,unit:'来回',step:1,min:1,hint:'1 来回 = 50 米，距离自动计算'}))}
else if(draft.type==='walking'){s=field({key:'steps',label:'实际步数',value:draft.steps,unit:'步',min:1})}
else if(draft.type==='hold'){s=field({key:'exercise',label:'静态动作',value:draft.exercise,type:'text',full:true,placeholder:'如：平板支撑、靠墙静蹲'})+field({key:'sets',label:'完成组数',value:draft.sets,unit:'组',min:1})+field({key:'secondsPerSet',label:'每组坚持时长',value:draft.secondsPerSet,unit:'秒',min:1})}return s}
function renderTraining(){const plan=PLANS[new Date().getDay()];return `<div class="form-grid"><section class="card"><div class="section-title"><div><h2>${draft.id?'修改已保存记录':'添加训练'}</h2><p>所有计算均在当前设备中完成</p></div>${draft.id?'<button type="button" class="link-btn" data-action="reset-draft">取消编辑</button>':''}</div><div class="segmented" role="group" aria-label="选择运动类型">${CATEGORIES.map(([key,label])=>`<button type="button" class="segment ${draft.type===key?'active':''}" data-category="${key}" aria-pressed="${draft.type===key}">${label}</button>`).join('')}</div><form id="recordForm"><div class="fields">${renderTypeFields()}${field({key:'date',label:'训练日期',value:draft.date,type:'date',full:true})}</div><div class="form-actions"><button type="submit" class="primary-btn">${draft.id?'保存修改':'保存这条训练'}</button><button type="button" class="secondary-btn" data-action="reset-draft">清空</button></div></form></section>
 <div><section class="card preview-card"><span class="hero-label" style="color:#5d8b72">本次预计消耗</span><div class="preview-kcal" id="previewKcal">${calc(draft)??'—'}<small>kcal</small></div><p class="preview-line" id="previewLine">${safe(previewDescription(draft))}</p><div class="rule-list" id="previewRule">${safe(previewRule(draft))}</div></section><section class="card assist-card section-block"><div class="section-title"><div><h3>今天的计划</h3><p>${plan.label}</p></div></div>${plan.items.length?plan.items.map((item,i)=>`<div class="compact-plan"><div><div class="compact-plan-name">${safe(item.exercise)}</div><div class="compact-plan-sub">${safe(describePlanItem(item))}</div></div><button type="button" class="mini-btn" data-plan="${new Date().getDay()}-${i}">填入</button></div>`).join(''):'<p class="micro-note">今天是休息日，可以记录实际完成的其他活动。</p>'}</section></div></div>`}
function previewDescription(d){if(d.type==='strength')return `${d.sets||0} 组 × ${d.repsPerSet||0} 次 = ${(Number(d.sets)||0)*(Number(d.repsPerSet)||0)} 次`;if(d.type==='swimming')return d.legacySwimming?`${d.exercise||'游泳'} · ${d.durationMin||'尚未填写'} 分钟（旧记录）`:`${d.exercise||'游泳'} · ${d.laps||0} 来回 · ${(Number(d.laps)||0)*50} 米`;if(d.type==='cardio')return `${d.exercise||'运动'} · ${d.durationMin||'尚未填写'} 分钟`;if(d.type==='walking')return `${d.steps||0} 步`;if(d.type==='hold')return `${d.sets||0} 组 × ${d.secondsPerSet||0} 秒`;return ''}
function previewRule(d){if(d.type==='strength')return d.exercise.trim()==='仰卧起坐'?'沿用原脚本：次数 × 0.15 × 体重 / 68':'沿用原脚本：总次数 × 0.22 kcal（经验估算）';if(d.type==='cardio')return String(d.exercise||'').trim()==='椭圆机'?'椭圆机定制：默认 5 kcal / 分钟（20 分钟 = 100 kcal）':'骑行按设置中的每分钟热量系数计算';if(d.type==='swimming')return d.legacySwimming?'旧记录按原有分钟数计算，历史数据不转换':'按 50 米 / 来回记录；热量使用可调整的每来回系数估算（默认以 6 MET、约 2 分钟 / 50 米折算），不代表测得游泳时长';if(d.type==='walking')return '沿用原脚本：0.04 × (体重 / 70) × 步数';return '静态保持补充简化算法：3 MET × 3.5 × 体重 ÷ 200 × 有效分钟'}
function recordDescription(r){if(r.type==='walking')return r.stepMode==='daily-net-v1'?`净 ${r.steps||0} 步 · 全天 ${r.dailyTotalSteps||0} 步 · 区间扣除 ${r.gymExcludedSteps||0} 步`:`${r.steps||0} 步`;if(r.type==='cardio')return `${r.duration_min||0} 分钟`;if(r.type==='swimming')return Number.isInteger(Number(r.laps))&&Number(r.laps)>0?`${r.laps} 来回 · ${r.distance_m||r.laps*50} 米`:`${r.duration_min||0} 分钟（旧记录）${r.distance_m?` · ${r.distance_m} 米`:''}`;if(r.type==='hold')return `${r.sets||0} 组 × ${r.secondsPerSet||0} 秒`;if(r.type==='strength')return r.sets&&r.repsPerSet?`${r.sets} 组 × ${r.repsPerSet} 次 = ${r.reps} 次${r.loadKg!=null?` · ${r.loadKg} kg`:''}`:`${r.reps||0} 次（原记录未分组）`;return r.note||'运动记录'}
function recordName(r){return r.type==='walking'?(r.stepMode==='daily-net-v1'?'走路 · 已去重':'步行'):r.exercise||r.stroke||r.note||prettyType(r.type)}

function historyRecordCard(r){
 const isSet=r.type==='strength'||r.type==='hold';
 const qty=isSet&&Number.isFinite(Number(r.sets))&&Number(r.sets)>0
  ?{main:String(r.sets),unit:'组'}:
  isSet&&Number(r.reps)>0
   ?{main:String(r.reps),unit:'次（未分组）'}:
  r.type==='walking'?{main:String(r.steps||0),unit:'步'}:
  r.type==='swimming'&&Number(r.laps)>0?{main:String(r.laps),unit:'来回'}:
  (r.type==='cardio'||r.type==='swimming')?{main:String(r.duration_min||0),unit:'分钟'}:{main:'—',unit:''};
 const detail=isSet&&r.sets?
  (r.type==='strength'
   ?(Number(r.repsPerSet)>0?'每组 '+Number(r.repsPerSet)+' 次':'组数已记录')
   :(Number(r.secondsPerSet)>0?'每组 '+Number(r.secondsPerSet)+' 秒':'组数已记录'))
  :recordDescription(r);
 return '<div class="record-card"><div class="record-icon">'+icon(r.type==='strength'?'training':r.type==='hold'?'hold':r.type==='walking'?'walking':r.type==='swimming'?'swimming':'activity',18)+'</div>'+
 '<div class="record-meta"><strong>'+safe(recordName(r))+'</strong><small>'+safe(detail)+'</small></div>'+
 '<div class="record-metric"><div><strong>'+safe(qty.main)+'</strong><span>'+safe(qty.unit)+'</span></div>'+
 '<small class="record-energy">'+(Number(r.calories)||0)+' kcal · 估算</small></div>'+
 '<button type="button" class="record-action" data-edit="'+safe(r.id)+'" aria-label="编辑 '+safe(recordName(r))+'">编辑</button>'+
 '<button type="button" class="record-action danger" data-delete="'+safe(r.id)+'" aria-label="删除 '+safe(recordName(r))+'">删除</button></div>';
}

function renderHistorySection(title,items){
 if(!items.length)return '';
 const sorted=[...items].sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
 const dates=[...new Set(sorted.map(r=>r.date))];
 return '<section class="history-slice"><div class="history-slice-head"><strong>'+safe(title)+'</strong><span>'+items.length+' 项</span></div>'+
 dates.map(date=>'<div class="history-date-group">'+(title==='今日'?'':'<div class="history-date-label">'+safe(formatDate(date))+'</div>')+
 sorted.filter(r=>r.date===date).map(historyRecordCard).join('')+'</div>').join('')+'</section>';
}

function saveHistoryQuickForm(form){
 const date=historySelectedDate;
 if(!date||date!==form?.dataset.historyDate||date>localDate()||!/^\d{4}-\d{2}-\d{2}$/.test(date)){
  toast('训练日期无效');return false;
 }
 const q=QUICK_ITEMS.find(x=>x.key===form.querySelector('#historyQuickExercise')?.value);
 const selector=form.querySelector('#historyQuickAmount');
 const raw=selector?.value==='custom'?form.querySelector('#historyQuickCustom')?.value:selector?.value;
 const n=Number(raw);
 if(!q||raw===undefined||raw===''||!Number.isInteger(n)||n<1||n>q.max){
  toast('请选择有效的运动数量');return false;
 }
 // Today's walking uses the same deduplicated daily record as the manual steps page.
 if(q.key==='steps'&&date===localDate())return saveDailySteps(n);
 if(q.key==='steps'&&recordsOfDate(date).some(r=>r.type==='walking'&&r.stepMode==='daily-net-v1')&&
    !confirm('这天已有净步数记录，另外添加走路可能重复计算。仍然添加吗？'))return false;
 const previous=state.records.slice();
 try{
  const draft=quickDraft(q,n);draft.date=date;
  const record=newRecord(draft);
  state.records.push(record);
  if(!persist()){state.records=previous;return false}
  render();toast('已记录 '+q.name+' · '+n+q.unit);return true;
 }catch(e){state.records=previous;toast(e.message||'保存失败');return false}
}

/* Nov 19 historical correction is deliberately user-triggered; device-local records cannot be read remotely. */
const CORRECT_DAY='2026-11-19';
const CORRECT_BACKUP='fitness_backup_nov19_pre_correction_v1';
function isCorrectElliptical(r){return r.date===CORRECT_DAY&&r.type==='cardio'&&r.exercise==='椭圆机'&&Number(r.duration_min)===20}
function nov19Backup(){
 try{const v=JSON.parse(localStorage.getItem(CORRECT_BACKUP)||'null');return v?.date===CORRECT_DAY&&Array.isArray(v.records)?v:null}catch(e){return null}
}
function nov19IsCorrect(){
 const rows=recordsOfDate(CORRECT_DAY);
 return rows.length===1&&isCorrectElliptical(rows[0])&&!state.stepDiary?.[CORRECT_DAY];
}
function historyCorrectionUI(date){
 if(date!==CORRECT_DAY)return '';
 const rows=recordsOfDate(date),backup=nov19Backup();
 return '<section class="history-correction"><div><strong>11月19日记录核对</strong>'+
  '<p>当前 '+rows.length+' 笔 · '+totalRecs(rows)+' kcal。'+
  (nov19IsCorrect()?'已是椭圆机20分钟的单笔记录。':'确认当天只有椭圆机20分钟后，可执行校正。')+'</p></div>'+
  (nov19IsCorrect()?'':'<button type="button" data-correct-day>校正为椭圆机20分钟</button>')+
  (backup?'<button type="button" class="history-correction-restore" data-restore-day>恢复原记录</button>':'')+
  '</section>';
}
function correctNov19(){
 if(nov19IsCorrect()){toast('11月19日记录已正确');return true}
 const rows=recordsOfDate(CORRECT_DAY);
 if(!confirm('11月19日现有 '+rows.length+' 笔记录。校正后仅保留椭圆机20分钟；当天其他记录及步数先备份后移除，其他日期不受影响。确定继续？'))return false;
 const previous=state;
 try{
  if(!nov19Backup()){
   const snapshot={date:CORRECT_DAY,records:rows,stepDiary:state.stepDiary?.[CORRECT_DAY]??null,savedAt:new Date().toISOString()};
   localStorage.setItem(CORRECT_BACKUP,JSON.stringify(snapshot));
   if(!nov19Backup())throw new Error('无法验证备份');
  }
  const q=QUICK_ITEMS.find(x=>x.key==='elliptical');
  if(!q)throw new Error('椭圆机配置不存在');
  const keep=rows.find(isCorrectElliptical)||newRecord({...quickDraft(q,20),date:CORRECT_DAY});
  const stepDiary={...(state.stepDiary||{})};delete stepDiary[CORRECT_DAY];
  state={...state,records:state.records.filter(r=>r.date!==CORRECT_DAY).concat([keep]),stepDiary};
  if(!persist()){state=previous;return false}
  render();toast('已校正：11月19日椭圆机20分钟');return true;
 }catch(e){state=previous;toast('校正失败：'+e.message);return false}
}
function restoreNov19(){
 const backup=nov19Backup();
 if(!backup){toast('没有可恢复的备份');return false}
 if(!confirm('恢复11月19日校正前的 '+backup.records.length+' 笔记录及当天步数？其他日期不变。'))return false;
 const previous=state,stepDiary={...(state.stepDiary||{})};
 if(backup.stepDiary===null)delete stepDiary[CORRECT_DAY];else stepDiary[CORRECT_DAY]=backup.stepDiary;
 state={...state,records:state.records.filter(r=>r.date!==CORRECT_DAY).concat(backup.records),stepDiary};
 if(!persist()){state=previous;return false}
 render();toast('11月19日原记录已恢复');return true;
}
document.addEventListener('click',e=>{
 if(e.target.closest('[data-correct-day]')){correctNov19();return}
 if(e.target.closest('[data-restore-day]')){restoreNov19();return}
});

function renderHistory(){
 const today=localDate(),week=getWeekDates(),recs=state.records;
 if(historySelectedDate){
  const day=historySelectedDate,items=recs.filter(r=>r.date===day);
  return '<div class="history-compact"><div class="history-focus-head"><strong>'+safe(formatDate(day))+'</strong>'+
   '<div class="history-focus-actions"><button type="button" class="link-btn" data-view="calendar">返回日历</button>'+
   '<button type="button" class="link-btn" data-history-all>全部记录</button></div></div>'+
   historyCorrectionUI(day)+renderHistoryQuickForm(day)+
   (items.length?'<section class="card history-unified">'+items.map(historyRecordCard).join('')+'</section>':
    '<div class="history-inline-empty">'+(dayKind(day)==='rest'?'休息日':'暂无记录')+'</div>')+'</div>';
 }
 const todayItems=recs.filter(r=>r.date===today);
 const weekItems=recs.filter(r=>r.date!==today&&week.includes(r.date));
 const older=recs.filter(r=>!week.includes(r.date));
 return '<div class="history-compact">'+historyCorrectionUI(today)+
  (todayItems.length||weekItems.length?'<section class="card history-unified">'+
    renderHistorySection('今日',todayItems)+
    renderHistorySection('本周',weekItems)+'</section>':
   '<div class="history-inline-empty">本周暂无训练记录</div>')+
  (older.length?'<button type="button" class="history-expand" data-filter="'+(historyFilter==='all'?'week':'all')+'">'+
   (historyFilter==='all'?'收起更早记录':'更早记录 · '+older.length+' 项')+'</button>'+
   (historyFilter==='all'?'<section class="card history-unified">'+renderHistorySection('更早记录',older)+'</section>':''):'')+
  '</div>';
}

function renderExerciseSettings(){
 return '<section class="card section-block exercise-settings"><div class="section-title"><div><h2>每组动作与热量计算</h2>'+

function defaultExerciseProfile(q){
 const w=Number(state.settings.weight)||65;
 if(q.type==='strength')return {perSet:15,rate:q.key==='situps'?0.15*w/68:0.22};
 if(q.type==='hold')return {perSet:45,rate:3*3.5*w/200};
 if(q.key==='elliptical')return {rate:5};
 if(q.key==='swim')return {rate:Math.round(6*3.5*w/200*2*10000)/10000};
 if(q.type==='walking')return {rate:0.04*w/70*1000};

}
function exerciseProfile(q){
 const defaults=defaultExerciseProfile(q);
 const saved=state.settings.exerciseProfiles&&state.settings.exerciseProfiles[q.key];
 if(!saved||typeof saved!=='object')return defaults;
 if(q.key==='swim'){const lapRate=Number(saved.lapRate);return {rate:saved.lapRate!==undefined&&Number.isFinite(lapRate)&&lapRate>=0&&lapRate<=10000?lapRate:defaults.rate};}
 const perSet=Number(saved.perSet),rate=Number(saved.rate);
 return {
  perSet:Number.isInteger(perSet)&&perSet>=1&&perSet<=600?perSet:defaults.perSet,
  rate:Number.isFinite(rate)&&rate>=0&&rate<=10000?rate:defaults.rate
 };
}

 if(q.type==='strength')return Math.round(n*p.perSet*p.rate);

function stepInt(v){const n=Number(v);return Number.isInteger(n)&&n>=0&&n<=1000000?n:null}
function cleanStepDiary(raw){
 const result={};
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
 for(const [date,values] of Object.entries(raw)){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!values||typeof values!=='object'||Array.isArray(values))continue;
  const clean={},total=stepInt(values.total);
  if(values.total!==undefined&&values.total!==''&&values.total!==null&&total!==null)clean.total=total;
  let sessions=[];
  if(Array.isArray(values.sessions)){
   for(let index=0;index<values.sessions.length&&index<50;index++){
    const x=values.sessions[index];if(!x||typeof x!=='object')continue;
    const start=stepInt(x.start),end=x.end===null||x.end===''||x.end===undefined?null:stepInt(x.end);
    if(start===null||(end!==null&&end<start))continue;
    sessions.push({id:typeof x.id==='string'&&x.id?x.id:'imported-'+index,
      kind:STEP_KINDS.some(k=>k[0]===x.kind)?x.kind:'other',start,end});
   }
  }else{
   const start=stepInt(values.gymIn),end=stepInt(values.gymOut);
   // Migrate previous one-interval representation in memory; do not touch records on page load.
   if(values.gymIn!==undefined&&values.gymIn!==null&&start!==null){
    sessions=[{id:'legacy-gym-1',kind:'gym',start,end:end!==null&&end>=start?end:null}];
   }
  }
  if(sessions.length)clean.sessions=sessions;
  if(Object.keys(clean).length)result[date]=clean;
 }
 return result;
}

function validateStepSessions(sessions){
 if(sessions.length>30)return '每天最多添加 30 段';
 const sorted=[...sessions].sort((a,b)=>a.start-b.start);
 for(let i=0;i<sorted.length;i++){
  const x=sorted[i];
  if(stepInt(x.start)===null||x.end!==null&&(stepInt(x.end)===null||x.end<x.start))return '累计步数必须是非负整数，结束不能小于开始';
  if(i>0&&sorted[i-1].end===null)return '上一段尚未填写结束步数，请先完成';
  if(i>0&&x.start<sorted[i-1].end)return '区间相互重叠，可能重复扣除步数，请调整后保存';
 }
 return '';
}
function stepDeduction(date){
 const sessions=stepSessions(date),invalid=validateStepSessions(sessions);
 if(invalid)return {excluded:0,completed:0,pending:sessions.length,error:invalid};
 const completed=sessions.filter(s=>s.end!==null);
 return {excluded:completed.reduce((sum,s)=>sum+(s.end-s.start),0),
  completed:completed.length,pending:sessions.length-completed.length,error:''};
}
function dailyStepBreakdown(date){
 const entry=state.stepDiary?.[date];
 if(!entry||!Number.isInteger(entry.total)||entry.total<0)return null;
 const deduction=stepDeduction(date);
 if(deduction.error)return null;
 const closed=completeStepSessions(date);
 if(closed.some(s=>s.end>entry.total)||deduction.excluded>entry.total)return null;

  net:entry.total-deduction.excluded,complete:deduction.pending===0,pending:deduction.pending};
}
function walkingPreviewNet(total){

const REST_DAYS_KEY='hermes_fitness_rest_days_v1';
function validRestDate(v){
 if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
 const d=dateFromISO(v);
 return !Number.isNaN(d.getTime())&&localDate(d)===v&&v<=localDate();
}
function readRestDays(){
 try{const a=JSON.parse(localStorage.getItem(REST_DAYS_KEY)||'[]');if(Array.isArray(a))return new Set(a.filter(validRestDate))}catch(e){}
 return new Set();
}
let restDays=readRestDays();
let calendarMonth=localDate().slice(0,7);
let calendarSelected=localDate();
function persistRestDays(next){
 try{localStorage.setItem(REST_DAYS_KEY,JSON.stringify([...next].sort()));return true}
 catch(e){toast('休息打卡保存失败：请检查浏览器存储');return false}
}
function dayKind(date){return recordsOfDate(date).length?'workout':restDays.has(date)?'rest':'none'}
function streakCount(){
 let d=dateFromISO(localDate());
 if(dayKind(localDate(d))==='none')d=addDays(d,-1);
 let count=0;
 while(count<3650&&dayKind(localDate(d))!=='none'){count++;d=addDays(d,-1)}
 return count;
}
function toggleRestDay(){
 const today=localDate();
 if(recordsOfDate(today).length){toast('今天已有训练记录，已自动打卡');return}
 const next=new Set(restDays),existing=next.has(today);
 if(existing)next.delete(today);else next.add(today);
 if(persistRestDays(next)){restDays=next;render();toast(existing?'已撤销今日休息打卡':'今日休息打卡成功（0 kcal）')}
}
function renderRestButton(){
 const today=localDate(),type=dayKind(today);
 if(type==='workout')return '<button type="button" class="rest-check-button" disabled>今日训练已打卡 ✓</button>';
 return '<button type="button" class="rest-check-button" data-rest-toggle="today">'+(type==='rest'?'撤销休息打卡':'今日休息打卡')+'</button>';
}

function renderCalendar(){

 const first=new Date(year,month-1,1,12),offset=(first.getDay()+6)%7;
 const days=new Date(year,month,0).getDate(),names=['一','二','三','四','五','六','日'];
 const monthDates=Array.from({length:days},(_,i)=>calendarMonth+'-'+String(i+1).padStart(2,'0'));
 const count=monthDates.filter(d=>dayKind(d)!=='none').length;
 const workouts=monthDates.filter(d=>dayKind(d)==='workout').length;
 const current=calendarMonth===today.slice(0,7);
 const cells=Array.from({length:offset},()=>'<span class="cal-blank" aria-hidden="true"></span>');
 for(let day=1;day<=days;day++){
  const date=monthDates[day-1],type=dayKind(date),future=date>today;
  cells.push('<button type="button" class="cal-day '+type+(date===today?' today':'')+
   (future?' future':'')+'" data-cal-date="'+date+'" '+(future?'disabled':'')+
   ' aria-label="'+date+' '+(type==='workout'?'已训练':type==='rest'?'休息打卡':'未打卡')+
   '"><span class="cal-date">'+day+'</span><span class="cal-info">'+
   (type==='workout'?'●':type==='rest'?'休':'')+'</span></button>');

  '<div class="cal-header"><div class="cal-month-label">'+year+'年'+month+'月</div>'+
  '<div class="cal-nav"><button type="button" data-cal-month="-1" aria-label="上个月">‹</button>'+

  '<div class="cal-grid">'+names.map(name=>'<span class="cal-weekday">'+name+'</span>').join('')+
  cells.join('')+'</div>'+

  (current&&dayKind(today)!=='workout'?'<div class="cal-rest-inline">'+renderRestButton()+'</div>':'')+
  '</section></div>';
}

function wbSave(q,n){

 wbBusy=true;

  render();toast('已记录 '+q.name+' · '+n+q.unit);return true;
 }catch(err){toast(err.message||'保存失败');return false}
 finally{wbBusy=false}

 }catch(err){toast(err.message||'保存失败')}
});

document.addEventListener('click',e=>{
 const allHistory=e.target.closest('[data-history-all]');if(allHistory){historySelectedDate=null;render();return}
 const newButton=e.target.closest('[data-step-new]');if(newButton){editingStepSessionId=null;render();return}
 const editButton=e.target.closest('[data-step-edit]');if(editButton){editingStepSessionId=editButton.dataset.stepEdit;render();return}
 const deleteButton=e.target.closest('[data-step-delete]');if(deleteButton){deleteStepSession(deleteButton.dataset.stepDelete);return}
 const day=e.target.closest('[data-cal-date]');
 if(day){historySelectedDate=day.dataset.calDate;view='history';render();window.scrollTo({top:0,behavior:'instant'});return}
 const month=e.target.closest('[data-cal-month]');
 if(month){const dir=Number(month.dataset.calMonth);if(dir!==1&&dir!==-1)return;
 const y=Number(calendarMonth.slice(0,4)),m=Number(calendarMonth.slice(5,7));
 const nextDate=new Date(y,m-1+dir,1,12),next=localDate(nextDate).slice(0,7);
 if(next>localDate().slice(0,7))return;
 calendarMonth=next;
 calendarSelected=next===localDate().slice(0,7)?localDate():next+'-01';
 render();return}
 if(e.target.closest('[data-rest-toggle]')){toggleRestDay();return}
});
document.addEventListener('click',e=>{const viewBtn=e.target.closest('[data-view]');if(viewBtn){if(viewBtn.dataset.view==='history')historySelectedDate=null;switchView(viewBtn.dataset.view);return}const categoryBtn=e.target.closest('[data-category]');if(categoryBtn){const next=categoryBtn.dataset.category;if(next===draft.type)return;draft={...emptyDraft(next),id:draft.id,date:draft.date};render();return}const planBtn=e.target.closest('[data-plan]');if(planBtn){const [day,index]=planBtn.dataset.plan.split('-').map(Number);startPlan(day,index);return}const filterBtn=e.target.closest('[data-filter]');if(filterBtn){historyFilter=filterBtn.dataset.filter;render();return}const editBtn=e.target.closest('[data-edit]');if(editBtn){startEdit(editBtn.dataset.edit);return}const delBtn=e.target.closest('[data-delete]');if(delBtn){const item=state.records.find(r=>r.id===delBtn.dataset.delete);if(!item)return;if(confirm(`删除 ${item.date} 的「${recordName(item)}」记录？`)){const previous=state.records;state.records=state.records.filter(r=>r.id!==item.id);if(!persist()){state.records=previous;return}render();toast('记录已删除')}return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case 'reset-draft':draft=emptyDraft();render();break;case 'save-settings':saveSettings();break;case 'save-exercise-config':saveExerciseProfiles();break;case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'import-json':document.getElementById('importFile').click();break;case 'restore-snapshot':restoreFitnessSnapshot();break;case 'export-raw':exportRawFitnessData();break}});
document.addEventListener('input',e=>{const card=e.target.closest('[data-exercise-config]');if(card)updateExercisePreview(card);});
document.addEventListener('input',e=>{if(e.target.closest('#recordForm')){pullForm();updatePreview()}});
document.addEventListener('submit',e=>{if(e.target.id!=='recordForm')return;e.preventDefault();pullForm();try{const rec=newRecord(draft);const index=state.records.findIndex(r=>r.id===rec.id);const previous=state.records.slice();if(index>=0)state.records[index]=rec;else state.records.push(rec);if(!persist()){state.records=previous;return}draft=emptyDraft('strength');switchView('overview');toast(index>=0?'记录修改已保存':'训练已记录，统计已更新')}catch(err){toast(err.message)}});
document.getElementById('importFile').addEventListener('change',e=>{importJSONFile(e.target.files[0]);e.target.value=''});
/* The current day changes at the device's LOCAL 00:00, not at UTC midnight.
   Keep historical records as-is; only refresh the current-day view. */
let displayedLocalDay=localDate();
let localMidnightTimer=null;
function refreshLocalCalendarDay(){
 const today=localDate();
 if(today===displayedLocalDay)return false;
 displayedLocalDay=today;
 wbOpenKey=null;
 if(!draft.id)draft={...emptyDraft(draft.type),date:today};
 if(calendarMonth<today.slice(0,7))calendarMonth=today.slice(0,7);
 render();
 return true;
}
function scheduleLocalMidnightRefresh(){
 if(localMidnightTimer!==null)clearTimeout(localMidnightTimer);
 const now=new Date();
 const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,1,0);
 localMidnightTimer=setTimeout(()=>{
  refreshLocalCalendarDay();
  scheduleLocalMidnightRefresh();
 },Math.max(1000,next.getTime()-now.getTime()));
}
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden){refreshLocalCalendarDay();scheduleLocalMidnightRefresh();}
});
window.addEventListener('pageshow',()=>{refreshLocalCalendarDay();scheduleLocalMidnightRefresh();});
window.addEventListener('focus',()=>{refreshLocalCalendarDay();scheduleLocalMidnightRefresh();});
// iOS PWA suspension can delay timers, so also poll while the page is active.
setInterval(()=>{if(!document.hidden)refreshLocalCalendarDay();},30000);
// Reject an action from a still-visible YESTERDAY screen before it can save on the wrong day.
function guardOldDayAction(e){
 if(refreshLocalCalendarDay()){e.preventDefault();e.stopImmediatePropagation();}
}
document.addEventListener('click',guardOldDayAction,true);
document.addEventListener('submit',guardOldDayAction,true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
scheduleLocalMidnightRefresh();
</script>
