/* Fixed-entry, one-tap home */
.quick-top{position:sticky;top:0;z-index:20;background:#183a30;color:#fff;border-radius:20px;padding:20px 22px 17px;box-shadow:0 9px 26px #133d281c;margin-bottom:22px}
.quick-topline{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.quick-metric-label{font-size:12px;color:#b3dac8;font-weight:650}
.quick-metric-large{font-size:38px;line-height:1.1;font-weight:790;letter-spacing:-1.4px;margin-top:3px;font-variant-numeric:tabular-nums}
.quick-metric-large small{font-size:12px;font-weight:500;color:#b3dac8;margin-left:4px;letter-spacing:0}
.quick-week-meta{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.quick-week-meta strong{font-size:22px;line-height:1.2;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.quick-week-meta small{font-size:11px;color:#b3dac8}
.quick-bar{height:7px;background:#47645a;border-radius:20px;overflow:hidden;margin:14px 0 7px}
.quick-bar-fill{height:100%;background:#b7eacb;border-radius:20px;transition:width .2s}
.quick-barline{display:flex;justify-content:space-between;gap:10px;color:#b3dac8;font-size:11px}
.quick-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 1px 13px}
.quick-section-title h2{font-size:18px;font-weight:780;margin:0;letter-spacing:-.35px}
.quick-section-title span{font-size:11px;color:var(--sub)}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.quick-card{margin:0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 16px 15px;min-width:0;box-shadow:0 4px 16px #163d2308}
.quick-cardhead{display:flex;gap:9px;align-items:center}
.quick-bubble{height:36px;width:36px;flex-shrink:0;background:#e8f3eb;border-radius:11px;color:#257d58;display:grid;place-items:center}
.quick-cardtitle{font-size:16px;font-weight:780;color:#1b3026}
.quick-cardnote{font-size:11px;color:#86968c;margin-top:3px;white-space:nowrap}
.quick-inputline{display:flex;align-items:center;gap:5px;margin-top:16px}
.quick-countbox{display:flex;align-items:center;flex:1;min-width:0;border:1px solid #dce8df;border-radius:11px;overflow:hidden;background:#f8fbf9}
.quick-countbox button{appearance:none;background:none;border:0;height:42px;min-width:30px;padding:0;font-size:20px;font-weight:500;color:#276f51}
.quick-countbox input{width:100%;min-width:0;height:42px;border:0;background:transparent;text-align:center;font-size:17px;font-weight:790;color:#18372c;padding:0;outline:0;font-variant-numeric:tabular-nums}
.quick-countbox input::-webkit-inner-spin-button,.quick-countbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.quick-countbox input[type=number]{-moz-appearance:textfield}
.quick-unit{font-size:12px;color:#698576;width:23px;flex:none}
.quick-save{width:100%;border:0;border-radius:10px;background:#227554;color:#fff;font-size:13px;font-weight:750;padding:12px;min-height:42px;margin-top:12px}
.quick-save:active{background:#154b37}
.quick-estimate{font-size:11px;color:#799286;margin-top:9px;text-align:center}
.quick-estimate strong{color:#236c50}
.quick-recent{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.quick-recent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.quick-recent-head strong{font-size:15px}
.quick-recent-head button{border:0;background:transparent;color:#257859;font-size:12px;font-weight:750}
.quick-recent-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #edf2ee}
.quick-recent-label{min-width:0;flex:1}
.quick-recent-label strong{font-size:13px;display:block}
.quick-recent-label small{font-size:11px;color:#83938a}
.quick-recent-kcal{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.quick-quiet{font-size:11px;color:#82988a;margin:12px 3px 0;line-height:1.6}
@media(max-width:800px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-card{padding:14px 12px 12px}.quick-cardtitle{font-size:15px}.quick-cardnote{font-size:10px;white-space:normal}.quick-bubble{width:31px;height:31px}.quick-top{padding:16px 17px 15px}.quick-metric-large{font-size:34px}.quick-week-meta strong{font-size:21px}}
@media(max-width:390px){.quick-top{border-radius:15px;margin-left:-7px;margin-right:-7px}.quick-week-meta strong{font-size:19px}.quick-bubble{width:29px;height:29px}.quick-card{padding:13px 10px}.quick-countbox button{min-width:27px}.quick-cardhead{gap:6px}}

/* V1.1 calendar and daily rest-day check-ins */
.checkin-strip{border:1px solid var(--line);border-radius:19px;background:#fff;padding:16px 18px;margin:0 0 22px}
.checkin-strip-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.checkin-strip-header strong{font-size:14px}.checkin-strip-header button{border:0;background:none;color:#227554;font-size:12px;font-weight:750}
.checkin-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.checkin-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;border-radius:12px;border:1px solid transparent;background:#f6f9f6;min-width:0}
.checkin-day.today{border-color:#8dc5a9}.checkin-day .weekday{color:#84968c;font-size:10px}
.checkin-day .day-circle{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:750}
.checkin-day.workout .day-circle{background:#24785b;color:#fff}
.checkin-day.rest .day-circle{background:#e5f3e9;color:#24785b}
.checkin-day.none .day-circle{color:#4f6b5c}
.checkin-day .day-signal{font-size:9px;color:#788d7d;white-space:nowrap}
.checkin-footer{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:12px}
.checkin-footer span{color:var(--sub);font-size:11px}
.rest-check-button{background:#e9f5ed;color:#217154;border:1px solid #cee8d5;font-weight:750;font-size:12px;padding:9px 12px;border-radius:10px;min-height:37px;white-space:nowrap}
.rest-check-button:disabled{opacity:.65;cursor:default}
.cal-shell{max-width:880px;margin:0 auto}
.cal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.cal-month-label{font-size:21px;font-weight:800;letter-spacing:-.35px}
.cal-nav{display:flex;align-items:center;gap:8px}

function defaultExerciseProfile(q){
 const w=Number(state.settings.weight)||65;
 if(q.type==='strength')return {perSet:15,rate:q.key==='situps'?0.15*w/68:0.22};
 if(q.type==='hold')return {perSet:45,rate:3*3.5*w/200};
 if(q.key==='elliptical')return {rate:5};
 if(q.type==='walking')return {rate:0.04*w/70*1000};
 return {rate:6*3.5*w/200};
}
function exerciseProfile(q){
 const defaults=defaultExerciseProfile(q);
 const saved=state.settings.exerciseProfiles&&state.settings.exerciseProfiles[q.key];
 if(!saved||typeof saved!=='object')return defaults;
 const perSet=Number(saved.perSet),rate=Number(saved.rate);
 return {
  perSet:Number.isInteger(perSet)&&perSet>=1&&perSet<=600?perSet:defaults.perSet,
  rate:Number.isFinite(rate)&&rate>=0&&rate<=10000?rate:defaults.rate
 };
}
function profileCalories(q,n,p=exerciseProfile(q)){
 if(q.type==='strength')return Math.round(n*p.perSet*p.rate);
 if(q.type==='hold')return Math.round(n*p.perSet/60*p.rate);
 if(q.type==='walking')return Math.round(n/1000*p.rate);
 return Math.round(n*p.rate);
}

const STEP_KINDS=[['gym','健身房'],['bike','骑车'],['transport','乘车'],['other','其他']];
function stepInt(v){const n=Number(v);return Number.isInteger(n)&&n>=0&&n<=1000000?n:null}
function cleanStepDiary(raw){
 const result={};
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
 for(const [date,values] of Object.entries(raw)){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!values||typeof values!=='object'||Array.isArray(values))continue;
  const clean={},total=stepInt(values.total);
  if(values.total!==undefined&&values.total!==''&&values.total!==null&&total!==null)clean.total=total;
  let sessions=[];
  if(Array.isArray(values.sessions)){
   for(let index=0;index<values.sessions.length&&index<50;index++){
    const x=values.sessions[index];if(!x||typeof x!=='object')continue;
    const start=stepInt(x.start),end=x.end===null||x.end===''||x.end===undefined?null:stepInt(x.end);
    if(start===null||(end!==null&&end<start))continue;
    sessions.push({id:typeof x.id==='string'&&x.id?x.id:'imported-'+index,
      kind:STEP_KINDS.some(k=>k[0]===x.kind)?x.kind:'other',start,end});
   }
  }else{
   const start=stepInt(values.gymIn),end=stepInt(values.gymOut);
   // Migrate previous one-interval representation in memory; do not touch records on page load.
   if(values.gymIn!==undefined&&values.gymIn!==null&&start!==null){
    sessions=[{id:'legacy-gym-1',kind:'gym',start,end:end!==null&&end>=start?end:null}];
   }
  }
  if(sessions.length)clean.sessions=sessions;
  if(Object.keys(clean).length)result[date]=clean;
 }
 return result;
}

function todayStepEntry(){return state.stepDiary?.[localDate()]||{}}
function stepSessions(date){return state.stepDiary?.[date]?.sessions||[]}
function completeStepSessions(date){return stepSessions(date).filter(s=>s.end!==null)}
function validateStepSessions(sessions){
 if(sessions.length>30)return '每天最多添加 30 段';
 const sorted=[...sessions].sort((a,b)=>a.start-b.start);
 for(let i=0;i<sorted.length;i++){
  const x=sorted[i];
  if(stepInt(x.start)===null||x.end!==null&&(stepInt(x.end)===null||x.end<x.start))return '累计步数必须是非负整数，结束不能小于开始';
  if(i>0&&sorted[i-1].end===null)return '上一段尚未填写结束步数，请先完成';
  if(i>0&&x.start<sorted[i-1].end)return '区间相互重叠，可能重复扣除步数，请调整后保存';
 }
 return '';
}
function stepDeduction(date){
 const sessions=stepSessions(date),invalid=validateStepSessions(sessions);
 if(invalid)return {excluded:0,completed:0,pending:sessions.length,error:invalid};
 const completed=sessions.filter(s=>s.end!==null);
 return {excluded:completed.reduce((sum,s)=>sum+(s.end-s.start),0),
  completed:completed.length,pending:sessions.length-completed.length,error:''};
}
function dailyStepBreakdown(date){
 const entry=state.stepDiary?.[date];
 if(!entry||!Number.isInteger(entry.total)||entry.total<0)return null;
 const deduction=stepDeduction(date);
 if(deduction.error)return null;
 const closed=completeStepSessions(date);
 if(closed.some(s=>s.end>entry.total)||deduction.excluded>entry.total)return null;
 return {total:entry.total,excluded:deduction.excluded,
  net:entry.total-deduction.excluded,complete:deduction.pending===0,pending:deduction.pending};
}
function walkingPreviewNet(total){
 if(!Number.isInteger(total)||total<0)return null;
 const deduction=stepDeduction(localDate());
 if(deduction.error||completeStepSessions(localDate()).some(s=>s.end>total)||deduction.excluded>total)return null;
 return total-deduction.excluded;
}

 const pending={mode,date:localDate(),when:Date.now()};
 if(mode==='start')pending.kind=STEP_KINDS.some(x=>x[0]===kind)?kind:'other';

function applyHealthShortcutSnapshot(raw,pending){
 const count=Number(raw);
 if(!Number.isInteger(count)||count<0||count>1000000){toast('健康步数格式不正确，请检查快捷指令输出');return false}
 if(!pending||pending.date!==localDate()){toast('快捷取步操作已过期，请重新点击读取');return false}
 const day=localDate(),oldEntry=todayStepEntry(),prevDiary=state.stepDiary||{};
 const prevRecords=state.records.slice(),sessions=[...stepSessions(day)];
 const currentTotal=Number.isInteger(oldEntry.total)?oldEntry.total:0;
 if(count<currentTotal){toast('健康读取值小于本日已保存的累计步数，请确认数据是否已同步');return false}
 if(pending.mode==='start'){
  sessions.push({id:uid(),kind:pending.kind||'other',start:count,end:null});
 }else if(pending.mode==='end'){
  const index=sessions.findIndex(s=>s.id===pending.id&&s.end===null);
  if(index<0){toast('未找到要结束的区间，请重新读取');return false}
  sessions[index]={...sessions[index],end:count};
 }
 const issue=validateStepSessions(sessions);
 if(issue){toast(issue);return false}
 const todayOld=recordsOfDate(day).filter(r=>r.type==='walking'&&r.stepMode!=='daily-net-v1');
 if(!managedWalkingRecord(day)&&todayOld.length&&!confirm('今天已有手动步行记录。自动同步步数可能重复累计。旧记录不会删除，仍继续吗？'))return false;
 state.stepDiary={...prevDiary,[day]:{...oldEntry,total:count,sessions,shortcutReadAt:new Date().toISOString()}};
 try{
  const breakdown=dailyStepBreakdown(day);
  if(!breakdown)throw Error('步数区间不完整或计数超出范围');
  updateManagedWalking(day);
  if(!persist()){state.stepDiary=prevDiary;state.records=prevRecords;return false}
  const label=pending.mode==='start'?'已自动记录开始步数':pending.mode==='end'?'已自动记录结束步数':'已同步今日总步数';
  render();toast(label+'：'+count+' 步，净步数 '+breakdown.net+' 步');
  return true;
 }catch(e){state.stepDiary=prevDiary;state.records=prevRecords;toast(e.message||'读取结果处理失败');return false}
}

}

 '<div class="quick-section-title"><h2>快速记录</h2><span>11 个项目</span></div>'+
 '<div class="quick-grid">'+QUICK_ITEMS.map(q=>{
 const v=q.key==='steps'&&Number.isInteger(todayStepEntry().total)?todayStepEntry().total:quickValues[q.key];
 const net=q.key==='steps'?walkingPreviewNet(v):v;
 const estimate=net===null?'—':quickCalories(q,net);
 return '<form class="quick-card" data-q-form="'+q.key+'">'+
 '<div class="quick-cardhead"><span class="quick-bubble">'+icon(q.iconName,18)+'</span><div><div class="quick-cardtitle">'+q.name+'</div><div class="quick-cardnote">'+q.note+'</div></div></div>'+
 '<div class="quick-inputline"><div class="quick-countbox"><button type="button" data-q-step="'+q.key+'" data-direction="-1" aria-label="'+q.name+'减少">−</button>'+
 '<input type="number" inputmode="numeric" name="q-value" aria-label="'+q.name+q.unit+'" min="1" max="'+q.max+'" step="1" value="'+v+'">'+
 '<button type="button" data-q-step="'+q.key+'" data-direction="1" aria-label="'+q.name+'增加">+</button></div><span class="quick-unit">'+q.unit+'</span></div>'+
 '<button type="submit" class="quick-save" aria-label="打卡'+q.name+'">打卡</button>'+
 '<div class="quick-estimate">本次预计 <strong data-q-est="'+q.key+'">'+estimate+'</strong> kcal</div></form>'
 }).join('')+'</div>'+
 '';
}
function quickUpdateEstimate(form){
 const q=QUICK_ITEMS.find(item=>item.key===form?.dataset.qForm);if(!q)return;
 const input=form.querySelector('[name="q-value"]');
 const val=Number(input?.value);const el=form.querySelector('[data-q-est]');
 if(el){const net=q.key==='steps'?walkingPreviewNet(val):val;el.textContent=Number.isInteger(val)&&val>0&&val<=q.max&&net!==null?quickCalories(q,net):'—'}
}
document.addEventListener('click',e=>{
 const btn=e.target.closest('[data-q-step]');if(!btn)return;
 const q=QUICK_ITEMS.find(x=>x.key===btn.dataset.qStep),form=btn.closest('[data-q-form]');if(!q||!form)return;
 const input=form.querySelector('[name="q-value"]'),current=Number(input.value)||q.value;
 input.value=Math.max(1,Math.min(q.max,current+Number(btn.dataset.direction)*q.step));
 quickUpdateEstimate(form);
});
document.addEventListener('input',e=>{
 const form=e.target.closest('[data-q-form]');if(form)quickUpdateEstimate(form);
});
document.addEventListener('submit',e=>{
 if(e.target.id==='stepTotalForm'){e.preventDefault();const n=Number(e.target.querySelector('[name="dayTotal"]')?.value);saveDailySteps(n);return}
 if(e.target.id==='stepSessionForm'){e.preventDefault();saveStepSession(e.target);return}
 const form=e.target.closest('[data-q-form]');if(!form)return;
 e.preventDefault();
 const q=QUICK_ITEMS.find(x=>x.key===form.dataset.qForm),n=Number(form.querySelector('[name="q-value"]').value);
 if(!q||!Number.isInteger(n)||n<1||n>q.max){toast('请填写有效的'+(q?.unit||'训练数量'));return}
 if(q.key==='steps'){saveDailySteps(n);return}
 try{
   const record=newRecord(quickDraft(q,n));
   state.records.push(record);
   if(!persist()){state.records.pop();return}
   // Return to fixed defaults after saving; the recorded workout remains stored.
   render();
   toast('已记录 '+q.name+' · '+record.calories+' kcal');
 }catch(err){toast(err.message||'保存失败')}
});

document.addEventListener('click',e=>{
 const healthBtn=e.target.closest('[data-health-snapshot]');
 if(healthBtn){const type=healthBtn.dataset.healthSnapshot;
  openHealthShortcut(type==='total'?'total':activeStepInterval()?'end':'start',
   document.getElementById('healthStepKind')?.value||'gym');return}
 const manualButton=e.target.closest('[data-step-manual]');if(manualButton){stepManualOpen=!stepManualOpen;editingStepSessionId=null;render();return}
 const newButton=e.target.closest('[data-step-new]');if(newButton){editingStepSessionId=null;stepManualOpen=true;render();return}
 const editButton=e.target.closest('[data-step-edit]');if(editButton){editingStepSessionId=editButton.dataset.stepEdit;stepManualOpen=true;render();return}
 const deleteButton=e.target.closest('[data-step-delete]');if(deleteButton){deleteStepSession(deleteButton.dataset.stepDelete);return}
 const day=e.target.closest('[data-cal-date]');
 if(day){calendarSelected=day.dataset.calDate;render();return}
 const month=e.target.closest('[data-cal-month]');
 if(month){const dir=Number(month.dataset.calMonth);if(dir!==1&&dir!==-1)return;
 const y=Number(calendarMonth.slice(0,4)),m=Number(calendarMonth.slice(5,7));
 const nextDate=new Date(y,m-1+dir,1,12),next=localDate(nextDate).slice(0,7);
 if(next>localDate().slice(0,7))return;
 calendarMonth=next;
 calendarSelected=next===localDate().slice(0,7)?localDate():next+'-01';
 render();return}
 if(e.target.closest('[data-rest-toggle]')){toggleRestDay();return}
});
document.addEventListener('click',e=>{const viewBtn=e.target.closest('[data-view]');if(viewBtn){switchView(viewBtn.dataset.view);return}const categoryBtn=e.target.closest('[data-category]');if(categoryBtn){const next=categoryBtn.dataset.category;if(next===draft.type)return;draft={...emptyDraft(next),id:draft.id,date:draft.date};render();return}const planBtn=e.target.closest('[data-plan]');if(planBtn){const [day,index]=planBtn.dataset.plan.split('-').map(Number);startPlan(day,index);return}const filterBtn=e.target.closest('[data-filter]');if(filterBtn){historyFilter=filterBtn.dataset.filter;render();return}const editBtn=e.target.closest('[data-edit]');if(editBtn){startEdit(editBtn.dataset.edit);return}const delBtn=e.target.closest('[data-delete]');if(delBtn){const item=state.records.find(r=>r.id===delBtn.dataset.delete);if(!item)return;if(confirm(`删除 ${item.date} 的「${recordName(item)}」记录？`)){state.records=state.records.filter(r=>r.id!==item.id);persist();render();toast('记录已删除')}return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case 'reset-draft':draft=emptyDraft();render();break;case 'save-settings':saveSettings();break;case 'save-exercise-config':saveExerciseProfiles();break;case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'import-json':document.getElementById('importFile').click();break;case 'reset-all':if(confirm('确定清空所有训练记录吗？此操作无法撤销。')){state=initialState();draft=emptyDraft();persist();view='overview';render();toast('已清空记录')}break}});
document.addEventListener('input',e=>{const card=e.target.closest('[data-exercise-config]');if(card)updateExercisePreview(card);});
document.addEventListener('input',e=>{if(e.target.closest('#recordForm')){pullForm();updatePreview()}});
document.addEventListener('submit',e=>{if(e.target.id!=='recordForm')return;e.preventDefault();pullForm();try{const rec=newRecord(draft);const index=state.records.findIndex(r=>r.id===rec.id);if(index>=0)state.records[index]=rec;else state.records.push(rec);persist();draft=emptyDraft('strength');switchView('overview');toast(index>=0?'记录修改已保存':'训练已记录，统计已更新')}catch(err){toast(err.message)}});
document.getElementById('importFile').addEventListener('change',e=>{importJSONFile(e.target.files[0]);e.target.value=''});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
receiveHealthShortcutResult();
window.addEventListener('hashchange',receiveHealthShortcutResult);
</script>
</body>
</html>
