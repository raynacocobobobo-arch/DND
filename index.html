@media(max-width:720px){.journal-actions{grid-column:2;justify-content:flex-start;margin-top:-5px}}
.home-footer{display:flex;justify-content:center;padding:6px 0 35px}

/* Make the actual card-back artwork a secondary accessible action target. */
.ritual-altar .altar-card[role="button"] { pointer-events:auto; cursor:pointer; }
.altar-card[role="button"]:focus-visible, .flip-card[role="button"]:focus-visible { outline:3px solid var(--goldlight); outline-offset:5px; }
.flip-card[role="button"] { cursor:pointer; }
 
/* Fix: the decorative altar halo must never capture taps intended for the draw buttons. */
.ritual-altar, .ritual-altar::before, .ritual-altar .altar-card { pointer-events:none; }
.ritual-stage #shuffleBtn, .ritual-stage #dailyDraw { position:relative; z-index:2; }

/* Visible fallback for ChatGPT/QuickLook viewers that strip JavaScript. */
.viewer-fallback{display:grid;grid-template-columns:1fr minmax(180px,320px);gap:32px;min-height:65vh;align-items:center;padding:48px 0}
.viewer-fallback-copy h1{font-size:clamp(35px,5vw,68px);line-height:1.3;color:#e7d6b0}
.viewer-fallback-copy p{line-height:1.9;color:#becbc7}
.viewer-fallback-warning{padding:14px 16px;border:1px solid #b08d56;color:#f0d8ac!important;background:#5b472623}
.viewer-fallback-art{display:block;max-width:100%;max-height:65vh;object-fit:contain;border:2px solid #b08d56;border-radius:8px}
@media(max-width:720px){.viewer-fallback{display:flex;flex-direction:column;gap:8px;padding:36px 0 85px;min-height:auto}.viewer-fallback-copy h1{font-size:38px}.viewer-fallback-art{max-width:190px;max-height:340px}}

/* === EDITORIAL REDESIGN / V2.0 ==========================================
   Quiet literary visual system: antique paper, marine ink, brass, story rhythm.
   Applied to existing ritual controls and new codex / reading content.
========================================================================= */
:root{--bg:#08151a;--panel:#0d2025;--panel2:#122830;--line:rgba(195,166,117,.25);--gold:#d4b67d;--goldlight:#f3dfb2;--cream:#f4ead8;--soft:#b1b7b3;--green:#9ebdb1;--serif:"Noto Serif SC","Songti SC","STSong",Georgia,serif}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{background:#08151a;background-image:radial-gradient(ellipse 900px 520px at 80% 0%,rgba(47,79,75,.26),transparent),radial-gradient(ellipse 1100px 720px at 5% 90%,rgba(38,69,74,.19),transparent);font-size:15px;line-height:1.7}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:linear-gradient(90deg,transparent 98.5%,rgba(224,193,139,.1) 100%);background-size:96px 100%}
.site-header{height:82px;max-width:none;width:100%;padding:0 max(5.3vw,calc((100vw - 1360px)/2));background:rgba(7,19,24,.93);border-bottom:1px solid rgba(203,176,123,.2);position:sticky;top:0;z-index:50;backdrop-filter:blur(22px)}
.site-header .brand strong{font-size:19px;font-weight:500;letter-spacing:.21em}
.site-header .brand small{letter-spacing:.21em;color:#a88b60}
.brand-mark{font-size:25px}.top-nav{gap:34px}.top-nav a{font-size:12px;letter-spacing:.12em}
.top-nav a.active{color:#f7dfac;border-bottom:1px solid #d4b67d;padding-bottom:7px}
.header-side{font-size:10px;color:#a99369}
#app{max-width:1390px;padding:0 5.3% 130px}
h1,h2,h3{letter-spacing:.015em}
h1{line-height:1.3}
p{line-height:1.95}
a,button{-webkit-tap-highlight-color:transparent}
a:hover,button:hover{transition-duration:.22s}
.btn,.outline-btn{min-height:49px;padding:13px 24px;letter-spacing:.065em;font-size:13px;border-radius:2px}
.btn{background:linear-gradient(120deg,#e1c995,#b9975f);border-color:#dbb973;color:#0a1b20;box-shadow:0 13px 36px rgba(0,0,0,.16)}
.btn:hover{background:linear-gradient(120deg,#f5e1b7,#c9a66a)}
.outline-btn{border:1px solid rgba(215,180,121,.58);color:#e7d1a5;background:rgba(12,26,30,.6)}
.overline,.story-label{color:#d3b47b;font:11px/1.5 Georgia,serif;letter-spacing:.25em;text-transform:uppercase}
.smallcap{letter-spacing:.12em;color:#b7aa92}
.hairline{background:rgba(195,166,117,.17)}
/* First impression */
.editorial-hero{min-height:690px;display:grid;grid-template-columns:1.13fr .87fr;align-items:center;gap:4vw;position:relative;padding:72px 0 66px;border-bottom:1px solid rgba(200,178,140,.2)}
.editorial-hero:before{content:"";position:absolute;inset:0 -3vw;pointer-events:none;background:radial-gradient(ellipse at 75% 48%,rgba(50,82,84,.16),transparent 45%)}
.hero-text{position:relative;z-index:3;padding:0 0 7px}
.hero-text .overline{margin:0 0 39px;color:#b6aa91;font-size:10px;letter-spacing:.21em}
.hero-edition{letter-spacing:.2em;margin-bottom:12px}
.editorial-hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(54px,5.8vw,92px);letter-spacing:.07em;line-height:1.36;margin-bottom:29px;color:#f4e7cf}
.editorial-hero h1 em{font-style:normal;color:#dcbf88}
.hero-lead{font-size:16px;line-height:2.25;color:#bfc5c0;max-width:530px;letter-spacing:.02em}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin:30px 0 38px}
.hero-actions .btn{min-width:200px;display:inline-flex;align-items:center;justify-content:space-between;gap:20px}
.hero-actions .outline-btn{min-width:190px;display:inline-flex;align-items:center;justify-content:center}
.hero-caption{display:flex;flex-wrap:wrap;gap:18px;font:10px Georgia,serif;letter-spacing:.14em;color:#8c9b96}
.hero-caption span+span{border-left:1px solid #6e7b73;padding-left:18px}
.hero-art{height:620px;position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate}
.hero-art-halo{position:absolute;width:90%;aspect-ratio:1;border:1px solid rgba(198,165,107,.15);border-radius:50%;box-shadow:0 0 100px rgba(58,116,109,.12),inset 0 0 80px rgba(54,110,110,.06);pointer-events:none}
.hero-art-halo:before,.hero-art-halo:after{content:"";position:absolute;inset:10%;border:1px solid rgba(217,187,135,.11);border-radius:50%}
.hero-art-halo:after{inset:23%;border-style:dashed}
.hero-art img{position:absolute;object-fit:cover;aspect-ratio:9/16;border:1px solid #a68f64;border-radius:6px;box-shadow:0 25px 65px rgba(0,0,0,.65)}
.hero-art-main{width:min(53%,258px);transform:translateY(-22px);z-index:4}
.hero-art-side{width:min(45%,210px);filter:brightness(.68) saturate(.8);z-index:2}
.side-one{transform:translate(-64%,15px) rotate(-15deg)}
.side-two{transform:translate(66%,15px) rotate(15deg)}
.hero-art-caption{position:absolute;bottom:2px;z-index:5;display:flex;flex-direction:column;text-align:center;color:#e8d4ac;background:linear-gradient(transparent,#08151ae8);padding:24px 60px 9px;gap:5px}
.hero-art-caption b{font:11px Georgia,serif;letter-spacing:.3em}
.hero-art-caption span{font-size:11px;color:#b1bbb4;letter-spacing:.12em}
.editorial-intro{padding:95px 0 90px}.chapter-head{display:flex;justify-content:space-between;gap:72px;align-items:end;margin-bottom:42px}
.chapter-head h2{max-width:620px;font-size:clamp(30px,3.3vw,47px);line-height:1.45}
.chapter-head>p{max-width:360px;font-size:14px;color:#aab9b3;line-height:2.15;margin:0}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid rgba(203,174,122,.3)}
.feature-item{display:flex;flex-direction:column;align-items:flex-start;padding:42px 35px 36px;min-height:310px;border-right:1px solid rgba(203,174,122,.25);background:linear-gradient(150deg,rgba(22,44,47,.45),rgba(9,25,31,.2))}
.feature-item:last-child{border:0}.feature-item:hover{background:rgba(32,57,57,.65);transform:none}
.feature-item>span:first-child{color:#c6ae7f;font:10px Georgia,serif;letter-spacing:.22em}
.feature-item h3{font-size:29px;margin:24px 0 9px}
.feature-item p{color:#b4bfb9;line-height:2;font-size:13px}
.feature-link{font-size:12px!important;color:#d6bd8d!important;margin-top:auto;border-bottom:1px solid #99805b;padding-bottom:3px}
.editorial-quote{text-align:center;padding:58px 18px 100px;max-width:900px;margin:auto}
.editorial-quote>span{font:80px Georgia,serif;color:#977850;line-height:1}
.editorial-quote p{font:clamp(20px,2.8vw,30px)/1.9 var(--serif);color:#dbcdb6}
.editorial-quote small{font-size:12px;color:#869c97;letter-spacing:.13em}
/* Main library */
.new-page-head{padding:90px 0 65px;border-bottom:1px solid rgba(203,174,122,.28);position:relative}
.new-page-head:after{content:"✦";position:absolute;right:1%;top:92px;color:rgba(220,190,134,.16);font:80px Georgia,serif}
.new-page-head h1{font-size:clamp(55px,7vw,94px);font-weight:500;letter-spacing:.1em;margin:12px 0}
.new-page-head h1 span{color:#d6b782}
.new-page-head>p:last-child{max-width:730px;line-height:2.1;color:#bdc5be;font-size:15px;margin-top:24px}
.library-toolbar{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:31px 0 15px}
.library-toolbar .smallcap{font:11px Georgia,serif;letter-spacing:.22em;color:#d6bc88}
.library-toolbar p{margin:3px 0;color:#aab7b1;font-size:13px}
.library-toolbar strong{color:#ead3a9}
.library-search{display:flex;align-items:center;gap:14px;font-size:12px;color:#d7c7a7}
.library-search input{width:300px;max-width:100%;padding:12px 15px;background:#0f2328;border:1px solid #49574d;border-radius:2px;color:#f6e6c9;font-size:13px}
.new-codex-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:43px 25px;padding:24px 0 80px}
.codex-card:hover{transform:translateY(-5px)}
.codex-card .art-shell{border:1px solid rgba(205,171,115,.6);border-radius:3px;background:#0d262a;box-shadow:0 18px 34px #0006}
.codex-card img{aspect-ratio:9/16}
.codex-card .under{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:15px;color:var(--cream)}
.codex-card .under .codex-card-no{font:10px Georgia,serif;letter-spacing:.19em;color:#a89c82}
.codex-card .under .name{font-family:var(--serif);font-size:23px;color:#f3e4cb}
.codex-card .under .codex-card-line{font-size:12px;color:#c8b78f}
.codex-card .under .codex-card-desc{font-size:12px;color:#9fb0ab;line-height:1.85;margin-top:6px;min-height:44px}
.codex-card .under .codex-card-open{font-size:11px;color:#dfc28a;margin-top:7px;letter-spacing:.08em}
.library-end{text-align:center;padding:0 0 60px;font:10px Georgia,serif;color:#748985;letter-spacing:.19em}
/* Story reading: two columns, persistent art, clear editorial hierarchy */
.story-crumb{display:flex;justify-content:space-between;gap:20px;margin:36px 0 39px;padding-bottom:20px;border-bottom:1px solid rgba(206,173,120,.2);font-size:12px;color:#b6a983}
.story-crumb a{color:#dfc28e}.story-crumb span{font:10px Georgia,serif;letter-spacing:.22em}
.story-layout{display:grid;grid-template-columns:minmax(260px,39%) minmax(0,1fr);gap:clamp(35px,6vw,100px);align-items:start;padding-bottom:80px}
.story-art-column{position:sticky;top:114px;min-width:0}
.story-art-frame{max-width:475px;border:1px solid rgba(206,171,115,.45);background:#10262c;padding:10px;box-shadow:0 24px 55px #0007}
.story-art-image{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:cover}
.story-art-foot{display:flex;justify-content:space-between;gap:10px;margin:17px 0 10px;font:10px Georgia,serif;letter-spacing:.14em;color:#bca97f}
.story-art-note{color:#82958e;font-size:11px;line-height:1.9}
.story-prose{max-width:730px}.story-kicker{font:11px Georgia,serif;letter-spacing:.23em;color:#ceb17e;margin:6px 0 23px}.story-kicker span{opacity:.5}
.story-prose>h1{font-size:clamp(47px,5.5vw,72px);margin:0 0 7px;letter-spacing:.1em}
.story-entity{font-size:14px;letter-spacing:.07em;color:#d7bb89;margin:0 0 27px}
.story-rule{height:1px;background:linear-gradient(90deg,#ad8c55,transparent);margin:20px 0 35px}
.story-prose .story-label{margin:30px 0 13px;font-size:11px}
.story-prose>p:not(.story-label):not(.story-entity){font-family:var(--serif);font-size:16px;line-height:2.15;color:#d5d5c9}
.story-prose .story-maintext{font-family:var(--serif);font-size:19px!important;color:#e5d7bd!important;line-height:2.13!important;letter-spacing:.025em}
.interpretation-duo{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:38px 0}
.interpretation-duo section{border:1px solid rgba(204,173,122,.26);padding:26px 22px 22px;background:linear-gradient(155deg,rgba(27,55,53,.55),rgba(13,31,38,.75))}
.interpretation-duo .meaning-down{background:linear-gradient(155deg,rgba(43,45,52,.56),rgba(18,30,37,.8))}
.meaning-header{display:flex;gap:10px;align-items:center;margin-bottom:16px;font:11px Georgia,serif;color:#e1c493;letter-spacing:.05em}
.meaning-header span{color:#8a826d}.interpretation-duo p{font-size:13px;line-height:2.05;color:#c8d0c9;margin:0 0 17px}
.interpretation-duo .keyrow{display:flex;gap:7px;flex-wrap:wrap}.interpretation-duo .tag{font-size:10px;color:#e1cda6;border-color:rgba(210,180,124,.33);padding:5px 8px;letter-spacing:0}
.story-question{border-left:2px solid #b69a69;padding:15px 25px;margin:30px 0 46px;background:rgba(181,153,107,.065)}
.story-question span{font:11px Georgia,serif;letter-spacing:.16em;color:#c7a971}.story-question p{font:21px/1.8 var(--serif);color:#f2e0c0;margin:10px 0 0}
.source-pane{border-top:1px solid rgba(205,171,114,.23);padding:14px 0 0}
.source-pane p{font-size:12px;color:#9aa9a4;line-height:2.0}
.source-pane p strong{color:#c5bb9e;font-weight:500}
.story-pager{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0 40px}
.story-pager a{padding:25px 8px;display:flex;flex-direction:column;gap:11px;color:#dfc38d}
.story-pager a+ a{text-align:right;border-left:1px solid var(--line)}
.story-pager small{font:10px Georgia,serif;letter-spacing:.16em;color:#829b94}
.story-pager strong{font:23px var(--serif)}
/* Ritual clean-up: readable, touchable, concise vertical rhythm */
.page-intro{padding:62px 0 21px}.page-intro h1{font-size:clamp(43px,5.5vw,70px)}
.page-intro .subtext{color:#aebcb5}
.ritual-screen{max-width:1080px}
.ritual-stage{margin:12px auto 30px;min-height:310px}
.ritual-stage .stage-heading{font-size:clamp(28px,3.6vw,42px);line-height:1.5;margin:0 0 9px}
.ritual-stage .stage-desc{font-size:13px;line-height:1.9;max-width:650px;margin:0 auto 10px}
.progress-track{gap:7px;margin:7px 0 24px}.progress-track span{padding:6px 10px;font-size:10px}
.ritual-altar{min-height:245px;margin-top:8px}.ritual-altar:before{width:min(310px,62vw);pointer-events:none}
.altar-card{width:133px;max-width:42vw}.ritual-altar .altar-card[role=button]{cursor:pointer;pointer-events:auto}
.reveal-area{min-height:284px;margin-top:6px}.flip-card{width:156px}
.ritual-stage .btn.wide{margin-top:10px}.ritual-stage .btn,.ritual-stage .outline-btn{min-height:49px}
.ritual-modes{gap:14px}.mode-card{min-height:170px;border-radius:2px;padding:24px 16px;background:rgba(17,39,42,.7)}.mode-card.chosen{background:rgba(35,69,66,.58)}
.mode-card strong{font-size:20px}
.cut-cards{margin:28px auto;gap:20px}.fan-scroll{padding-top:29px;padding-bottom:30px}
.reading-top{padding:65px 0 45px}.reading-top h1{font-size:clamp(48px,6vw,78px)}
/* Offline interpretation is a first-class, always visible reading */
.reading-spread{margin:20px auto 0;max-width:1000px;padding:30px 0 42px;border-bottom:1px solid var(--line)}
.reading-spread .reading-cards{max-width:850px;justify-content:center;gap:26px;margin:10px auto}
.reading-spread .reading-card img{max-width:190px;border:1px solid #b59c70;border-radius:4px}
.reading-spread .reading-card h3{font-size:18px;line-height:1.4;margin:13px 0 5px}
.reading-spread .reading-card p{font-size:11px}
.offline-reading{max-width:1080px;margin:0 auto;padding:65px 0 10px}
.offline-heading{display:flex;gap:25px;justify-content:space-between;align-items:end;padding-bottom:29px;border-bottom:1px solid var(--line)}
.offline-heading .overline{margin-bottom:8px}
.offline-heading h3{font-size:clamp(30px,3.6vw,46px);margin:0}
.offline-seal{display:inline-block;font-size:11px;border:1px solid #728d7d;color:#bed4bd;border-radius:99px;padding:7px 15px;white-space:nowrap}
.offline-prompt{font:16px/2 var(--serif);padding:20px;color:#ead5ad;background:rgba(209,178,124,.07);margin:25px 0 0}
.offline-story-list{display:grid;gap:0}
.offline-card-story{padding:38px 0 40px;border-bottom:1px solid rgba(201,165,114,.22)}
.offline-card-index{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px;color:#c3b08d;font:10px Georgia,serif;letter-spacing:.15em}
.offline-card-index span+span{color:#9ca9a1}
.offline-card-body{display:grid;grid-template-columns:114px minmax(0,1fr);gap:30px}
.offline-card-body img{width:100%;height:auto;border:1px solid rgba(211,179,122,.5);border-radius:3px;align-self:start}
.offline-card-body h4{font:30px/1.3 var(--serif);color:#f1e0c2;margin:0 0 17px}
.offline-card-body h4 span{font:12px/1.7 var(--sans);color:#c2ae85}
.offline-card-body p{font-size:14px;color:#c3d0c8;line-height:2.08;margin:0 0 14px}
.offline-card-body p strong{color:#ead3a8;font-weight:600}
.offline-card-body .offline-legend{font-family:var(--serif);color:#dcd2c1}
.offline-card-body .offline-position{color:#a8c2b7}
.offline-card-body .offline-question{font-family:var(--serif);color:#e6c68d;border-left:2px solid #b99b66;padding-left:15px}
.offline-synthesis{margin-top:46px;padding:38px 45px;background:linear-gradient(120deg,rgba(37,69,64,.66),rgba(21,42,47,.69));border:1px solid rgba(208,180,125,.34)}
.offline-synthesis h4{font:29px/1.5 var(--serif);margin:11px 0 20px}
.offline-synthesis p:not(.story-label){font-size:15px;line-height:2.2;color:#d5dfd4}
.offline-synthesis b{color:#f2d5a4}
.offline-synthesis .offline-final{color:#f1d2a1!important;font-family:var(--serif);border-top:1px solid rgba(215,181,128,.25);padding-top:15px;margin-top:20px}
.offline-disclaimer{font-size:11px;line-height:2;color:#879b95;margin:23px 0}
.reading-end{max-width:1080px;margin:20px auto 70px;padding-top:20px;border-top:1px solid rgba(199,171,117,.18)}
.reading-end .ai-offline{border:1px solid rgba(167,190,172,.2);background:rgba(12,29,31,.65);margin-bottom:28px;padding:23px}
.reading-end .ai-offline strong{font-size:15px;color:#ddc38d}.reading-end .ai-offline p{font-size:12px;color:#acb8b0}
.reading-actions{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin:28px auto}
.save-warning{color:#e2b4a2}
.journal-list{gap:12px}.journal-item{border-radius:2px;background:#10252a7a}
.setting-item{background:rgba(17,41,45,.7);border:1px solid var(--line);padding:27px}
/* Full responsiveness */
@media(max-width:1100px){
 .editorial-hero{grid-template-columns:1fr .78fr;gap:20px;min-height:620px}

}

 #app{padding:0 20px 105px}
 .bottom-nav{z-index:60;bottom:0;background:rgba(8,23,27,.96);border-top:1px solid rgba(199,168,109,.28)}
 .editorial-hero{padding:47px 0 40px;display:flex;flex-direction:column;min-height:auto;align-items:stretch;gap:20px}
 .hero-text .overline{font-size:9px;letter-spacing:.12em;margin-bottom:27px}
 .editorial-hero h1{font-size:clamp(48px,11vw,72px);line-height:1.35;margin-bottom:18px}
 .hero-lead{font-size:14px;line-height:2.05}
 .hero-actions{margin:22px 0 19px;gap:10px}
 .hero-actions .btn,.hero-actions .outline-btn{width:100%;min-width:0;min-height:51px}
 .hero-caption{gap:8px;font-size:8px;justify-content:space-between;letter-spacing:.06em}
 .hero-caption span+span{border:0;padding-left:0}
 .hero-art{height:420px;max-width:510px;width:100%;margin:0 auto}
 .hero-art-main{width:46%;max-width:185px;transform:translateY(-15px)}
 .hero-art-side{width:39%;max-width:157px}

const ARCANA_IDS = Object.freeze(Array.from({length:22},(_,i)=>i));
function validRandom(random){const n=random();if(!Number.isFinite(n)||n<0||n>=1)throw Error('Invalid random number');return n;}
function shuffledIds(ids=ARCANA_IDS,random=Math.random){
  if(!Array.isArray(ids)||new Set(ids).size!==ids.length)throw Error('Invalid deck');
  const deck=[...ids];
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(validRandom(random)*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  return deck;
}
function drawFromSlots(shuffledDeck,slots,random=Math.random){
  if(new Set(slots).size!==slots.length)throw Error('Duplicate slot');
  return slots.map(slot=>{
    if(!Number.isInteger(slot)||slot<0||slot>=shuffledDeck.length)throw Error('Invalid slot');
    return {id:shuffledDeck[slot],orientation:validRandom(random)<0.5?'upright':'reversed'};
  });
}
function dateKeyLocal(date=new Date()){

  return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}`;
}

}

function loadJournal(storage){
  try{const raw=storage.getItem(JOURNAL_KEY);if(!raw)return {entries:[]};const data=JSON.parse(raw);
    if(data.version!==1||!Array.isArray(data.entries)||!data.entries.every(canBeEntry))return {entries:[],warning:'旧记录格式无法识别；数据未被覆盖。'};
    return {entries:data.entries.slice(0,100)};
  }catch{return {entries:[],warning:'无法读取本地调查日志（浏览器可能限制了存储）。'};}
}
function write(storage,entries){
  try{storage.setItem(JOURNAL_KEY,JSON.stringify({version:1,entries}));return {ok:true};}
  catch{return {ok:false,warning:'无法写入本地存储，请检查隐私模式或存储空间。本次结果仍可在当前页面查看。'};}
}
function saveEntry(storage,entry){
  if(!canBeEntry(entry))return {ok:false,warning:'记录字段无效，未保存。'};
  const previous=loadJournal(storage);if(previous.warning)return {ok:false,warning:previous.warning};
  return write(storage,[entry,...previous.entries.filter(e=>e.entryId!==entry.entryId)].slice(0,100));
}
function deleteEntry(storage,id){const previous=loadJournal(storage);return previous.warning?{ok:false,warning:previous.warning}:write(storage,previous.entries.filter(e=>e.entryId!==id));}
function clearJournal(storage){return write(storage,[]);}

const LORE=Object.freeze([{"story":"伦道夫·卡特渐渐失去做梦的能力。现实的街道依旧熟悉，却再没有通往奇异国度的入口。直到祖传的银钥匙回到手中，他才重新面对童年曾经相信的世界。出发意味着放下安全的解释，也意味着承认自己仍有未走过的道路。","visual":"把银钥匙理解为跨越门槛的许可；前方不是已经绘好的地图，而是光线无法完全照亮的未知之路。这里的异界入城画面是对小说精神的视觉改编。","upright":"你正处在一次尚未被旧经验定义的开端。好奇心比完整计划更有力量，但它不是盲目乐观：可以先带着有限行装迈出第一步，在行进中修正方向。","reversed":"危险不是未知本身，而是把冒险当作逃避。也许你跳过了必要的准备，或因为惧怕失败而始终站在门口。先确认底线，再决定是否启程。","question":"真正阻止你出发的，是风险，还是熟悉感？"},{"story":"一位名叫奈亚拉托提普的讲演者带来不可思议的机器与电光展示。观众起初以为自己在观看科学奇观，随后才意识到台上那人并不只是传授知识。他知道如何让人看见奇迹，也知道如何借奇迹夺走判断。","visual":"台上的手势、器具与帷幕对应传统魔术师的‘将想法化为现实’，但这里最值得看的是权力与表演之间那条模糊的界线。四种塔罗法器属于艺术组合。","upright":"手中的条件已经比你想象的充分。把分散的工具、信息和人组织起来，清楚说明意图，并通过可验证的小成果证明能力，而不是只依靠气势。","reversed":"警惕华丽说辞替代事实，也警惕为了达到目的而操纵他人。能力越强，越需要回答：我是创造真实价值，还是只制造令人信服的幻象？","question":"你正在使用能力解决问题，还是展示能力本身？"},{"story":"《女巫屋中之梦》里，吉尔曼察觉房间的倾斜角度似乎不服从熟悉的几何。凯夏·梅森与布朗·詹金像某种不愿被解释的秘密，躲在墙角、梦境与知识的断层之间。门并不总在眼前，有时它藏在被忽略的细节里。","visual":"双柱象征已知与未知的边界；居中的女祭司不急于揭露秘密，而是守着它。端坐姿态和神秘装饰来自塔罗语言，并非小说中的固定仪式。","upright":"有些答案尚不适合在喧闹中得出。收集微弱但重复出现的线索，承认自己的直觉，同时保留求证；把观察写下来，等待它们形成清晰的结构。","reversed":"沉默可能变成自我封闭。不要因为一种强烈感觉就忽略事实，也不要为了维持神秘感而拒绝必要沟通。秘密必须有边界，而不是吞噬你。","question":"最近哪一个小细节反复出现，却始终没有被认真对待？"},{"story":"林中黑山羊的名号在低语中出现，像一种古老而不可估量的繁殖力量。它许诺生长，却不关心被生长之物是否仍拥有自己的形状。想象森林深处，根系把所有生命连成一体：丰饶与窒息只隔着一层薄土。","visual":"根系、花冠和幼兽是‘皇后’滋养主题的美术隐喻，不能误认作洛夫克拉夫特给莎布·尼古拉丝规定的确切形貌。","upright":"你有让人或项目成长的能力。给出资源、时间和稳定环境，允许成果自然成熟。真正的丰饶不是占有每一片叶子，而是帮助它们向各自的方向生长。","reversed":"照料可能变成控制，付出也可能把你掏空。检查那些以爱与责任为名的牺牲，试着恢复互惠与边界，让双方都能呼吸。","question":"你在帮助什么成长，又是否允许它独立？"},{"story":"拉莱耶从海中升起，非人的建筑令水手无法再相信直角与距离。沉睡的克苏鲁不需要朝廷，也不需要命令；他的存在本身就构成另一套秩序。人类以为自己掌握世界，却在古城的门前认出尺度的差异。","visual":"把拉莱耶的台阶与巨石塑造成王座，是对传统皇帝牌权威、规则与结构的反向书写，不是小说原本的场景配置。","upright":"局面需要清晰而可靠的结构。做决定、明确责任、建立边界，并承担执行后果。稳定来自你能解释的规则，而不是令人畏惧的姿态。","reversed":"当秩序只靠压迫维持，就会像错位的石阶一样使人迷失。质疑过时的制度和你自己不愿放开的控制欲，别把强硬当成领导力。","question":"你建立的规则是在保护人，还是要求人服从规则？"},{"story":"印斯茅斯的街道上，陌生人注意到一种难以言明的共识。大衮密教并非只教人祈祷，它掌握贸易、秘密与归属，也许还掌握进入另一种生活的代价。加入共同体看似能解除孤独，却可能要求交出质疑的权利。","visual":"巨型祭坛、权杖与成对信徒借用了传统教皇牌的师承象征。这里讨论的是信仰、仪式与群体规则，不宣称它们是小说中的一幕精确复原。","upright":"向可信赖的导师和成熟的方法学习，在长期传统中寻找经验。你不必独自发明一切；重要的是理解规则为何存在，而不仅仅照抄结果。","reversed":"习惯可能被误当作真理。审视圈子的禁忌、权威和不容讨论的标准：如果某个原则不能接受提问，它是否仍值得追随？","question":"你尊重某种传统，是理解了它，还是害怕离开它？"},{"story":"爱德华·德比曾把婚姻想象成精神上的亲密，然而与阿塞纳丝相处之后，亲密变成一场逐渐失去边界的恐惧。记忆、声音和身体都不再能确保‘我是谁’。当相爱被混同为彻底占有，选择就从承诺变成了陷阱。","visual":"两个人与镜中不一致的倒影，把‘恋人’的二择一与价值契合转化为身份恐怖。镜像互换是为这张牌设计的视觉压缩。","upright":"真正的联结建立在清醒的选择上。看见彼此的价值观、自由和边界，选择既能亲近也能保留自己的关系，不必把自我交出去换取确认。","reversed":"留意控制、依赖和对冲突的回避。若你必须不断缩小自己才能维持关系，那么问题不只是情感强度，而是决定权已经失衡。","question":"在你最看重的关系里，你是否仍能说出自己的意愿？"},{"story":"南极探险队越过冰雪，眼前是远比人类历史古老的山脉。研究者用仪器记录路线，却无法保证目的地会接纳自己的解释。每向前一步，都同时接近发现与危险；最重要的不是冲得最快，而是在惊惧中保持方向。","visual":"雪橇与被风雪吞没的遗迹象征战车前进时的意志和阻力。它是探索精神的视觉凝结，不意味着原著仅以这一个动作完成考察。","upright":"给目标一个明确方向，把激情转换为纪律。设立可检查的里程碑，协调彼此相反的冲动；推进并不要求绝对安全，而是要求你知道何时该加速。","reversed":"可能同时追逐太多目标，或把逞强误认作勇敢。若路线已经失控，先调整补给和判断，再继续推进；停下校准也是驾驶的一部分。","question":"你究竟在驶向目标，还是只是害怕停下来？"},{"story":"敦威治的山谷里，学者阿米蒂奇面对的威胁并不总有可供辨认的外形。庞大的知识未必能消除恐惧，但他仍要理解线索、采取行动。力量并非把怪物打倒的夸张姿态，而是在看不清时保持理智。","visual":"人物与天空中异形之间的尺度对比，是‘力量’牌真正的张力。怪物可见的形象属于为画面做出的视觉化处理，并不代表原著全程如此。","upright":"勇气正在表现为克制。面对压力，不必提高声量；先稳定节奏、分辨可以控制的部分，温和而坚定地执行下一步。","reversed":"长期紧绷可能让你的力量耗散，愤怒和自我怀疑轮流接管。允许求助与休息，别以为只有独自承受才算坚强。","question":"此刻最需要你控制的，是局势，还是自己的反应？"},{"story":"佛蒙特乡间的阿克利寄来信件，记录那些不该存在于山林里的痕迹。通信越深入，证据越多，世界也越难以解释。独处使他能够观察细微异常，却也让每一声响动都成为可能的威胁。","visual":"孤灯、书信与窗外不可知的影子，让传统隐者的灯不再只是智慧，也照出探索的孤独。画面的空间关系是作品氛围的重新编排。","upright":"把注意力从外部喧嚣收回，给自己一段独立思考的时间。阅读、整理证据、追问核心问题；好的独处会令判断更清澈。","reversed":"如果所有信号都只允许一种解释，独处就可能变成回音室。让可靠的人验证你的发现，不要把不被理解当作自身正确的证明。","question":"你是在独立寻找答案，还是逐渐拒绝所有不同意见？"},{"story":"在梦境的宇宙边缘，阿撒托斯与难以理解的混沌、笛声相连。人类习惯给事件寻找原因，仿佛命运由一只可见的手推动；但旋转的轮盘并不承诺公平，只揭示任何位置都可能改变。","visual":"黄铜轮、环绕的轨道和失衡的尺度，来自传统命运之轮的图像语法，是对无常的象征设计。","upright":"你或许正处在周期转换的节点。留意环境变化中的机会，在能够调整的时候保留弹性；幸运值得欢迎，但不必把它当作全部策略。","reversed":"当外部因素失控，最容易发生的是过度归咎于命运。分清偶然和选择：承认不可控的部分，然后保住仍可行动的一小块空间。","question":"如果局势明天改变，你最需要保留哪一种能力？"},{"story":"威利特医生沿着查尔斯·瓦德留下的痕迹，逐渐靠近约瑟夫·柯文的秘密。最可怕的不是幽暗密室，而是一个人可以借知识与身份逃避过去，令证词和真相变得难以区分。调查要求他不因恐惧而停止求证。","visual":"天平与指向真相的器具呼应正义牌，却不应被理解为原著真的出现审判法庭。画面聚焦证据与裁决之间的距离。","upright":"不要急于选边站。把事实、感受和假设分开，检视每个人承担了什么责任。公平往往意味着接受并不方便的结果。","reversed":"你可能只看见支持自己的一半证据，或让情绪替代判断。尝试重新审视因果，特别是自己在其中扮演的角色。","question":"如果只依据证据而不依据立场，你会如何判断？"},{"story":"纳撒尼尔·温盖特·皮斯利醒来后，发现生命中有一段时间仿佛被另一种意识借用。随着调查深入，过去、现在与未来的顺序开始失去稳定意义。视角被夺走之后，他才发现熟悉的自我并不是观察世界的唯一方式。","visual":"倒悬姿态让观者的视线与人物一样翻转；光环是传统吊人牌的顿悟符号，和伊斯种族的具体身体外观需要分开理解。","upright":"一味向前未必是当前的答案。暂停、让渡一部分控制，从他人的坐标重新看问题。暂时没有成果，不代表观察与等待没有价值。","reversed":"牺牲可能没有真正目的，也可能只是害怕承担选择。确认这段停顿是否正在带来新认识；若没有，就需要改变方法，而不是无限拖延。","question":"换一个位置看同一件事，哪一条结论会首先改变？"},{"story":"《印斯茅斯之影》的叙述者原本试图逃离那座衰败的海滨小镇，后来却发现自己与海有着无法割裂的联系。可怕的转变逐渐成为另一种归属。故事的尽头不是简单死亡，而是旧身份的消失与新的自我认知。","visual":"人形与深海形体交错的岸边身影，把死神牌的‘结束即转化’化为肉身隐喻。它是结尾主题的艺术化呈现。","upright":"某个阶段已经完成使命。结束会伴随失落，但放下过时的身份、承诺或模式，才给下一种生活留下空间。让告别发生，而不是不断补救已经改变的事。","reversed":"你可能明知一段旧局面无法复原，仍继续拖延告别。先允许自己哀悼，再决定携带哪些经验前进；抗拒转变不等于能阻止它。","question":"你正在守护的，是仍然重要的东西，还是已经结束的版本？"},{"story":"灯塔守望者登上白船，远海的国度一个比一个迷人。旅途既有平静又有诱惑，而选择何时停下，比继续向更遥远的幻想航行更难。每一片海域都有自己的节奏，航行者必须懂得辨认。","visual":"互相映照的两片海面、明暗与航迹，替代传统天使手中的两只水杯，讨论的是调和、时机与限度。画面不是小说场景的逐字复原。","upright":"你正适合调和两种看似冲突的需要。给事情合适的比例和节奏，把极端选择变成可以持续的过程；耐心不等于犹豫。","reversed":"过度、透支或急于抵达可能破坏平衡。检查时间、情绪和资源的分配，避免用一次冲动补偿长期的不满足。","question":"有什么事不必再多做，只要做到恰到好处？"},{"story":"威尔伯·沃特雷在敦威治长大，家族的秘密比村庄的流言更加沉重。禁忌书籍与不可告人的计划，既提供了力量，也把他锁在无法轻易退出的路径上。诱惑真正可怕之处，是它会让锁链看起来像通往自由的钥匙。","visual":"桌面仪式物、门外巨影与人物的不安，连成‘束缚是如何被选择的’这一视觉问题；具体构图属于故事元素的综合改编。","upright":"此牌在正位并不是赞美欲望，而是要求你看清束缚。承认正在控制你的习惯、资源或关系，才能开始决定如何与它相处。","reversed":"看见枷锁后，挣脱的机会正在出现。先采取一个能持续的小行动，减少依赖，重新协商边界；避免把解脱变成另一种极端。","question":"哪一种诱惑总以‘这是唯一办法’的面目出现？"},{"story":"联邦山的废弃教堂藏着闪耀的偏方三八面体。光与黑暗交替时，人们以为建筑能够把不可理解之物关在里面，但真正危险的东西并不遵守砖墙的承诺。自以为稳固的结构，可能只是一种暂时的错觉。","visual":"风暴中的高塔碎裂，是塔罗传统的突变象征。原著并无这场按图发生的坍塌；这张牌借它表达人对虚假安全感的依赖。","upright":"突发变化迫使旧结构接受检验。承认已经失效的部分，迅速保护最核心的人和资源；废墟固然令人不安，也让重建不必再依赖谎言。","reversed":"危机可能尚未爆发，却已在细节里显现。越早修补根本问题，越不必用更大的代价维持外观。","question":"哪一处看似坚固的安排，其实已经不再可靠？"},{"story":"库拉内斯在梦中一次次接近塞勒菲斯，那座有海港、穹顶与光彩的城市。他醒来后仍眷恋那里，因为梦境给了现实难以提供的完整感。星光并没有抹去失落，却证明仍有值得向往的方向。","visual":"明亮庭园、星辉与象征希望的白花，是为这组阴郁大阿卡纳安排的一次呼吸。它把原著的梦境向往转译成星星牌的疗愈象征。","upright":"经历波折之后，你开始看见微弱但真实的方向。允许希望来自小的恢复：一次诚实对话、一次休息、一次持续尝试。希望不要求保证成功。","reversed":"失望可能让你误以为未来已经关闭。不要逼迫自己马上乐观，先恢复联系、睡眠和节奏；微光往往不是在最焦急时出现的。","question":"有什么微小的证据说明，你仍在向想要的生活靠近？"},{"story":"孤独的水手在海中见到不可思议的陆地与石碑，碑上的图像预示远古之物。一个巨大的存在出现，他再也无法确定自己眼见的事实能否被旁人相信。《大衮》留下的恐惧，来自证据与理解之间的裂缝。","visual":"深海、碑石与黑暗中的庞大身影，把月亮牌的不确定和潜意识具体化。原著没有明确确认所见巨物就是大衮；这是一种借用相关意象的创作。","upright":"信息仍在迷雾里。承认不确定，倾听直觉，但把恐惧与证据分别记录。此时适合观察模式，不宜强迫自己立即得出唯一结论。","reversed":"原本困扰你的疑团可能出现解释，也可能被放大的恐惧扭曲。减少无证据的推测，寻找真正可核实的线索。","question":"如果暂时不需要确定答案，你会如何描述眼前事实？"},{"story":"伦道夫·卡特追逐过无数梦中的美丽城市，直到漫长旅程使他重新认出家乡真实的记忆。曾经遥不可及的光辉，在某一刻与自己已有的人生重叠。太阳照亮的不是新的神迹，而是眼前一直存在的珍贵事物。","visual":"金色城市和开阔的光线，与月亮牌的迷雾形成有意的反差。这里象征清晰与生命力，并非对某一段原文场景的机械复刻。","upright":"事情正变得清楚，成果可以被看见。欢迎喜悦，把复杂问题化成简单可执行的步骤，也让与你同行的人分享这份光亮。","reversed":"阳光被云遮住，并不代表它不存在。留意过高期待、炫耀或疲惫；回到那些能真实带来满足感的细节。","question":"你一直追寻的东西，有没有一部分已经存在于生活中？"},{"story":"世界各地的人在不相干的夜晚梦见相似的恐怖。雕像、航海记录与疯狂的低语，最终指向沉睡的拉莱耶。分散的证据汇合时，个人不得不重新认识自己所处的宇宙。这是一场意识的召唤，也是一场判断的考验。","visual":"向海上抬头的人群、远处巨大形体与觉醒的瞬间，把审判牌的‘回应呼唤’转换为宇宙尺度。画面人物聚集是象征性安排。","upright":"某个反复出现的问题需要你正式回应。回望已发生的事，接受新证据，对长期回避的决定作出清醒判断。觉醒不一定轻松，但能结束拖延。","reversed":"你可能已经听见改变的信号，却担心回应后失去熟悉的身份。先辨认内心的恐惧与外界的要求，允许自己循序渐进。","question":"哪一个决定已经被你推迟太久？"},{"story":"关于犹格·索托斯的传说把门、时间和存在的边界缠绕在一起。看似彼此隔绝的世界，可能只是同一个结构的不同切面。当人走到旅途的尽头，才发现所谓终点并非封闭圆圈，而是一扇从未真正关闭的门。","visual":"无数光球与环形空间不是神祇的标准外形，而是把不可见的整体性翻译为图像。传统世界牌的圆环在这里扩展为多重时空的象征。","upright":"一段旅程正在趋于完整。把零散收获纳入更大的框架，确认哪些目标已经完成，并为新的循环腾出空间；成熟意味着知道怎样收尾。","reversed":"离完成也许只差一项被忽略的工作，或你仍不愿承认自己已经走到下一阶段。找出缺口，形成真正的闭环，而不是反复重新开始。","question":"要给这一阶段一个完整句号，还需要做哪一件事？"}]);
const SYMBOLISM=Object.freeze(["银钥匙并不告诉卡特门后有什么，却让他有勇气重新跨过门槛。人物面前的深暗空间，是未知也是自由。愚者的力量从来不是知道答案，而是仍然愿意出发。","灯光与演示吸引观众的视线，讲演者却知道他们没有看见的部分。向上指的手与台上器具象征意志、技巧和表达；阴影提醒你，掌控与操纵往往只差一个动机。","倾斜的房间暗示规则已经改变；紧闭的门、沉默的人影和难以确认的目光，要求观察者依靠内在感觉，也在感觉之外寻找可靠的证据。","盘根错节的生命从一个源头不断延伸。花与幼兽代表滋养，幽暗的根系则问：关怀究竟是在赋予生命空间，还是把生命永远留在自己的怀抱中？","古城的台阶像王座，也像没有出口的律令。高耸的体量压过人的尺度，提醒权威可以带来秩序，失去约束时也能成为让一切噤声的力量。","信徒的对称位置暗示集体秩序，祭坛像通往未知海域的门。礼仪赋予人归属，但当神圣性凌驾于质疑之上，依附就可能变为束缚。","镜中的影子无法与眼前人重合，亲密因此转化为关于身份的疑问。两个人之间真正珍贵的，并非彼此占有，而是仍能相互选择。","冰封的山脉把目的地推向远方。狭窄的前路与庞大的遗迹构成一种对峙：推进需要意志，但真正决定旅程的是方向、纪律与对危险的尊重。","微小人物面对难以估量的恐怖，画面并不试图把恐惧消除。真正的力量存在于呼吸、判断与沉着之中，是人不向恐惧交出行动权的瞬间。","桌上的灯只照亮有限的信件，其余房间仍沉在黑暗中。隐者的光不是全知的太阳，而是耐心求索时能够守住的那一点清明。","转动的圆轮让每个位置都显得暂时。巨大的尺度提醒人并不是所有变故都有意义；能够掌握的，是转机到来时如何回应，而不是替宇宙安排规则。","天平并不象征容易得到的判决。调查者站在真相与恐惧之间，必须让证据先于喜恶，让责任不因为知识与身份的伪装而消失。","颠倒的身体改变了观察世界的方向。看似无力的停顿可以成为新的视角；是否真的有所领悟，取决于人能否停止原有的执念。","海岸是旧身份和新命运的分界线。正在变化的身影没有彻底告别过去，也无法恢复原状。结束在这里不是惩罚，而是不可逆的转化。","白船横跨两片气质不同的海域。海面的明暗与航路让节制有了重量：人在无尽的可能中懂得取舍，才不会把追寻变成迷失。","书卷与身后的阴影彼此呼应，知识既是钥匙又是锁链。人物越接近渴望的力量，就越要问自己：代价由谁承担？","风暴照出高塔的裂痕，崩塌不是凭空而来，而是长期隐藏的不稳定终于显形。剥落的石块迫使人分辨什么值得保存，什么必须重建。","梦境里的光很远，却足够让脚下的路出现轮廓。星星并不承诺每个人都会抵达那座城；它只提醒人，希望可以微弱而真实。","碑石在幽暗海面浮现，庞大身影仍难以辨认。月光照亮形状，却不能验证解释。它是直觉、梦与疑惧交会的地方。","金色的光让城市的轮廓清晰，遮蔽暂时退去。太阳不是无止境的狂喜，而是让人认出眼前的真实、成果与可以分享的温暖。","不同地点的人同时抬头，仿佛听到同一阵呼唤。审判的核心不是被别人宣判，而是面对已经知道的事实，决定是否改变自己的生活。","环形空间似乎同时包含入口与出口。曾经分散的片段在更大的秩序里相连，旅途的完成不是终止，而是终于理解自己站在怎样的整体之中。"]);

function codex(){root.innerHTML=`<section class="new-page-head library-head"><p class="overline">THE FORBIDDEN CODEX / VOLUME I</p><span class="smallcap">密斯卡托尼克大学 · 禁忌卷宗</span><h1>禁忌<span>图鉴</span></h1><p>有人在梦里找到一把钥匙，有人听见海底的呼唤。每一张牌，都是另一段命运。</p></section><section class="library-toolbar"><div><span class="smallcap">ARCHIVE INDEX</span><p><strong id="codexCount">22</strong> / 22</p></div><label class="library-search"><span>寻找一张牌</span><input type="search" id="codexSearch" class="search-input" placeholder="名字、故事或神祇" value="${escapeHtml(searchQuery)}" aria-label="检索卡牌故事"></label></section><section id="codexGrid" class="codex-grid new-codex-grid"></section><div class="library-end">THE DOOR IS NEVER FULLY CLOSED</div>`;updateSearch(searchQuery);root.querySelector('#codexSearch').addEventListener('input',e=>updateSearch(e.target.value));}

<section class="story-crumb"><a href="#/codex">← 返回图鉴</a><span>ARCANUM ${escapeHtml(card.roman)} · ${escapeHtml(card.titleEn)}</span></section>
<section class="story-layout story-immersive">

    <div class="story-art-frame">${cardImg(card,{loading:'loading="eager"',className:'story-art-image'})}</div>

function journal(){const result=loadJournal(storage());const list=result.entries;root.innerHTML=sectionIntro('INVESTIGATION LOG / PERSONAL ARCHIVE','调查日志','每一次翻牌都留下一份卷宗。所有记录仅保存在你当前浏览器的本地存储中。')+`<div class="stats-strip"><span>已收录 <b>${list.length}</b> 条</span><span>不云端同步 · 可随时删除</span></div><div class="hairline"></div>${result.warning?`<div class="ai-offline">${escapeHtml(result.warning)}</div>`:''}<div class="journal-list">${list.length?list.map(entry=>`<article class="journal-item"><img src="${getCard(entry.cards[0].id).artFile}" alt="${getCard(entry.cards[0].id).titleZh}"/><div><span class="date">${new Date(entry.createdAt).toLocaleString('zh-CN')}</span><h3>${SPREAD_LABELS[entry.spreadType]}</h3><p>${escapeHtml(entry.question||'自由探索')}</p><p>${entry.cards.map(p=>`${getCard(p.id).titleZh} · ${p.orientation==='upright'?'正位':'逆位'}`).join(' / ')}</p></div><div class="journal-actions"><button class="outline-btn small open-entry" data-id="${escapeHtml(entry.entryId)}">打开卷宗</button><button class="text-btn small delete-entry" data-id="${escapeHtml(entry.entryId)}">删除</button></div></article>`).join(''):empty('暂无调查记录。打开“开始占卜”，完成一次翻牌后将在这里看到记录。')}</div>${list.length?'<button id="clearAll" class="outline-btn small">清空所有记录</button>':''}`;
  root.querySelectorAll('.open-entry').forEach(b=>b.addEventListener('click',()=>{location.hash=`#/journal/${encodeURIComponent(b.dataset.id)}`;}));
  root.querySelectorAll('.delete-entry').forEach(b=>b.addEventListener('click',()=>{const res=deleteEntry(storage(),b.dataset.id);res.ok?journal():toast(res.warning);}));
  root.querySelector('#clearAll')?.addEventListener('click',()=>{if(window.confirm('确定删除本机全部占卜记录吗？此操作不可撤销。')){const res=clearJournal(storage());res.ok?journal():toast(res.warning);}});
}

function journalDetail(id){
 const result=loadJournal(storage()),entry=result.entries.find(e=>e.entryId===id);
 if(!entry){root.innerHTML=sectionIntro('INVESTIGATION LOG','卷宗不存在','这份本地记录可能已经清除。')+'<a href="#/journal" class="outline-btn">返回调查日志</a>';return;}
 root.innerHTML=`<section class="story-crumb"><a href="#/journal">← 返回调查日志</a><span>SAVED READING / ${escapeHtml(entry.createdAt.slice(0,10))}</span></section>
 <section class="new-page-head reading-top"><p class="overline">INVESTIGATION JOURNAL</p><h1>重读<span>命运</span></h1><p>${escapeHtml(SPREAD_LABELS[entry.spreadType])} · ${escapeHtml(entry.question||'自由探索')}</p></section>
 <section class="reading-spread"><div class="reading-cards" style="--n:${entry.cards.length}">${entry.cards.map(p=>{const c=getCard(p.id);return `<article class="reading-card">${cardImg(c,{className:p.orientation==='reversed'?'reversed':''})}<h3>${escapeHtml(p.position)} · ${escapeHtml(c.titleZh)}</h3><p>${p.orientation==='upright'?'正位':'逆位'}</p></article>`;}).join('')}</div></section>
 ${readingBody(entry.spreadType,entry.cards,entry.question)}
 <div class="reading-end"><p class="note">这份卷宗保存在当前浏览器的本地存储中。</p><a href="#/journal" class="outline-btn">返回调查日志</a></div>`;
}
function settings(){const s=prefs();root.innerHTML=sectionIntro('CONFIGURATION / YOUR DEVICE','设置与隐私','整个私人预览版不需要账号，尚未与AI服务器连接。你的问题只在当前设备参与抽牌和日志记录。')+`<div class="settings-list"><div class="setting-item"><div><h3>减少动态效果</h3><p>减少翻牌和洗牌动画；系统“减少动态效果”设置优先。</p></div><input class="toggle" id="reduceMotion" type="checkbox" aria-label="减少动态效果" ${s.reducedMotion?'checked':''}></div><div class="setting-item"><div><h3>声音</h3><p>默认关闭；音效功能在后续版本提供。</p></div><span class="tag">后续支持</span></div><div class="setting-item"><div><h3>智能解读</h3><p>DeepSeek API 尚未配置。将来通过服务端安全连接，不会要求把密钥输入网页。</p></div><div style="min-width:230px;max-width:260px"><input id="aiEndpointField" class="search-input" aria-label="安全AI接口HTTPS网址，不是密钥" placeholder="https://your-worker.workers.dev" value="${escapeHtml(getAiEndpoint())}"><button class="outline-btn small" id="saveAiEndpoint" style="margin-top:8px">保存接口地址</button></div></div><div class="panel soft"><h3>隐私与使用声明</h3><p class="note">本预览版没有账户、广告跟踪或自动上传个人问题的功能；牌面与日志存在本机浏览器，清理数据时可能永久丢失。塔罗内容仅用于娱乐、文化欣赏和自我反思，不应被当作医疗、法律、财务或确定性预测依据。</p></div><div class="btn-row"><a class="outline-btn" href="#/">← 返回首页</a></div></div>`;
  root.querySelector('#saveAiEndpoint')?.addEventListener('click',()=>{const raw=root.querySelector('#aiEndpointField').value.trim();if(raw&&!/^https:\/\/[a-z0-9.-]+(?:\:[0-9]+)?(?:\/[^\s]*)?$/i.test(raw)){toast('必须输入 HTTPS 服务端接口网址，不能填 API Key');return;}try{storage().setItem('cthulhu-tarot:api-endpoint',raw);toast('已保存安全后端网址。注意：这里不能填写密钥。');}catch{toast('浏览器未允许保存地址。');}});
  root.querySelector('#reduceMotion').addEventListener('change',e=>{sessionPreferences={...s,reducedMotion:e.target.checked};const saved=savePreferences(storage(),sessionPreferences);applyMotion();toast(saved?'偏好已保存在本设备':'已在当前会话生效；浏览器未允许保存此偏好。');});
}
function showWelcome(){let seen=false;try{seen=storage().getItem('cthulhu-tarot:welcome-seen:v1')==='yes';}catch{}if(seen)return;
  overlay.innerHTML=`<div class="welcome-shade" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><div class="welcome-box"><div class="symbol">✦ ◇ ✦</div><p class="eyebrow">A NOTICE FROM THE ARCHIVES</p><h2 id="welcomeTitle">踏入门槛之前</h2><p>这里收藏22张以洛夫克拉夫特作品为灵感的大阿卡纳。抽牌属于文学娱乐与自我反思，不是对未来的确定性预测。</p><p>基础解读和图鉴都可以离线阅读；首次打开需联网缓存完整卡牌。AI 扩展是可选功能，你的问题和日志默认保存在本设备。</p><button class="btn" id="agreeWelcome">同意并进入 →</button></div></div>`;
  overlay.querySelector('#agreeWelcome').addEventListener('click',()=>{try{storage().setItem('cthulhu-tarot:welcome-seen:v1','yes');}catch{}overlay.replaceChildren();});
}
function route(){applyMotion();const parts=(location.hash||'#/').replace(/^#\/?/,'').split('/');const view=parts[0]||'home';linksActive();if(view==='codex'){parts.length>1?detail(parts[1]):codex();}else if(view==='ritual'){ritual?renderRitual():ritualStart();}else if(view==='journal'){parts.length>1?journalDetail(decodeURIComponent(parts[1])):journal();}else if(view==='settings'){settings();}else{home();}window.scrollTo({top:0,behavior:'instant'});}
window.addEventListener('hashchange',route);
root.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement&&e.target.getAttribute('src')?.includes('/cards/')){e.target.outerHTML='<div class="missing-art" role="img" aria-label="图片暂时不可用">卡面加载失败<br>可重新打开档案</div>';}} ,true);
route();showWelcome();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(error => {
      console.warn('Offline cache unavailable:', error);
    });
  });
}
</script></body></html>
