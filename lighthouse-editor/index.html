<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灯塔世界 · 游戏地图编辑器 V5.0.1 | DND</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e6eee9;background:#0c1920;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}button,input,select{font:inherit}
#app{display:grid;grid-template-columns:260px minmax(0,1fr)270px;grid-template-rows:58px minmax(0,1fr) 29px;height:100dvh;min-height:480px}
header{grid-column:1/4;background:#152731;border-bottom:1px solid #324b52;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px}
.brand{font-weight:700;font-size:16px}.muted{font-size:11px;color:#93afb5}.hdr-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
button,.filelabel{background:#25414c;color:#e8f3f0;border:1px solid #3e626a;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
button:hover,.filelabel:hover{background:#385d66}button.active{background:#347e7a;border-color:#8bc6b9;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #afdbc9}
button.primary{background:#4b8078;border-color:#8abcae}button:disabled{opacity:.4;cursor:not-allowed}
aside{background:#14252d;overflow-y:auto;padding:16px;min-width:0}#left{border-right:1px solid #334950}#right{border-left:1px solid #334950}
h2{font-size:13px;font-weight:650;margin:0 0 12px;color:#f2f5ef}h3{font-size:12px;margin:15px 0 8px;color:#a8c4c7}
.section{padding-bottom:14px;border-bottom:1px solid #355059;margin-bottom:14px}
.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.toolgrid button{text-align:left;white-space:normal;min-height:42px}
label{display:block;font-size:12px;color:#bdd0d1;margin:10px 0 5px}
input[type=range]{width:100%;accent-color:#86c9b5}input[type=number],input[type=text],select{width:100%;background:#0e2028;color:#e9f2eb;border:1px solid #43616a;padding:8px;border-radius:6px;font-size:12px}
#view{position:relative;min-width:0;overflow:hidden;background:#173d50;touch-action:none}
#view canvas{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:13px;top:13px;padding:9px 12px;border-radius:7px;background:#0d2331c7;border:1px solid #6b9ca25e;font-size:11px;pointer-events:none}
#toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#173a42de;border:1px solid #7bada7a0;border-radius:8px;padding:10px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.stats{padding:9px 10px;background:#1e3740;border-radius:8px;border:1px solid #35565c;font-size:12px;line-height:1.9}
.value{color:#e5dcac;font-variant-numeric:tabular-nums}
#assets{display:flex;flex-direction:column;gap:15px}
.asset-category{min-width:0}
.asset-category h3{margin:0 0 8px;display:flex;justify-content:space-between;font-size:12px;color:#d6e7e5;border-bottom:1px solid #446169;padding-bottom:6px}
.asset-category h3 span{font-weight:400;color:#8ba8ad}
.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.asset-card{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:5px!important;white-space:normal!important;text-align:left!important;position:relative}
.asset-card .asset-preview{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;border:1px solid #345562;background:radial-gradient(circle at 42% 38%,#2f5260,#142630);border-radius:4px}
.asset-card .asset-label{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:10px;line-height:1.35;min-height:27px;word-break:break-word;padding:0 2px}
.asset-card.active{outline:2px solid #8ed1c2;border-color:#b5e9d6}
#assets button .asset-label{font-size:10px;margin:0}
#scene-search{margin:0 0 9px}
#scene-list{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px}
.scene-group-toggle{width:100%;display:block;text-align:left;border:0;border-radius:6px;padding:9px;background:#203842;color:#d0e5e2;position:sticky;top:0;z-index:2;font-size:12px;white-space:normal}
.scene-group-toggle:hover{background:#2d5159}
.asset-overridden{position:absolute;top:7px;right:7px;border-radius:4px;background:#2c7769;color:#fff;padding:2px 5px;font-size:10px}
.section[hidden]{display:none!important}
.scene-heading{font-size:11px;color:#8fbbc1;position:sticky;top:0;background:#14252d;padding:7px 0 4px;z-index:2}
.scene-row{display:flex;align-items:center;gap:3px;border:1px solid #34515b;border-radius:6px;padding:3px;background:#1a3039}
.scene-row.selected{outline:1px solid #aad5ae;border-color:#83c6b3}
.scene-row.hidden-item .scene-pick{opacity:.51;text-decoration:line-through}
.scene-row.locked-item{border-style:dashed}
.scene-pick{min-width:0;flex:1;text-align:left;padding:5px 3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;cursor:pointer}
.scene-action{flex:0 0 26px;width:26px;height:27px;display:grid;place-items:center;padding:0;border:1px solid transparent;background:transparent;font-size:12px}
.scene-action:hover{border-color:#51747b;background:#35515a}
.scene-bulk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.scene-bulk button{font-size:11px;padding:7px 4px}
#transform-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#transform-tools button{font-size:11px;padding:8px 2px}
#multi-hint{font-size:11px;color:#aad9c3;margin:8px 0}
.props{display:grid;grid-template-columns:1fr 1fr;gap:8px}.props label{margin-top:0}
footer{grid-column:1/4;background:#0d2028;border-top:1px solid #38525a;padding:7px 14px;font-size:11px;color:#9bb6b9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
a{color:#b2d8cf}
#input-json{display:none}
@media(max-width:1020px){#app{grid-template-columns:205px minmax(0,1fr)225px}aside{padding:11px}header{padding:8px}}


/* Compact editor with non-blocking minimap and mobile panels */
#minimap{position:absolute;left:14px;bottom:16px;z-index:10;width:202px;padding:7px;background:#10252de8;border:1px solid #527178;border-radius:10px;box-shadow:0 5px 16px #08191d9e;user-select:none}
#minimap .minimap-title{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:#c9e0dd;padding:0 4px 6px}
#minimap canvas{display:block;width:100%;height:auto;aspect-ratio:5/4;border-radius:6px;touch-action:none;cursor:crosshair;background:#204858}
#minimap .minimap-title button{padding:2px 5px;font-size:11px;border:0;background:transparent}
#asset-section,#glb-section,#backup-section,#size-section,#transform-section,#inspector-section{min-width:0}
#backup-list{margin-top:6px}
#backup-name{margin-top:6px}
#mobile-top-actions,#mobile-bar,#mobile-view-controls,#mobile-scrim,#mobile-project-actions{display:none}
@media(max-width:740px), (pointer:coarse) and (max-width:1020px){
 html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
 #app{display:block;height:100dvh;min-height:0;overflow:hidden}
 header{position:fixed;top:0;left:0;right:0;height:calc(54px + env(safe-area-inset-top));padding:calc(6px + env(safe-area-inset-top)) 10px 6px;z-index:80;flex-wrap:nowrap}
 header .brand{font-size:14px}header .brand+.muted,header .hdr-actions{display:none}
 #mobile-top-actions{display:flex;gap:5px;align-items:center}
 #mobile-top-actions button{min-height:36px;padding:6px 8px;font-size:11px}
 #view{position:fixed;left:0;right:0;top:calc(54px + env(safe-area-inset-top));bottom:calc(64px + env(safe-area-inset-bottom));height:auto;min-height:0;z-index:1}
 #hint{display:none}
 #mobile-view-controls{display:flex;gap:5px;position:absolute;right:8px;top:8px;z-index:8}
 #mobile-view-controls button{font-size:11px;padding:8px;min-height:38px;background:#142f3be6}
 #minimap{left:8px;bottom:9px;width:min(39vw,170px);padding:5px}
 #minimap .minimap-title{font-size:10px;padding-bottom:3px}
 #minimap canvas{width:100%}
 #toast{bottom:16px;max-width:85vw}
 #mobile-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:100;background:#11232b;border-top:1px solid #526c74;height:calc(64px + env(safe-area-inset-bottom));padding:6px 5px calc(5px + env(safe-area-inset-bottom));gap:5px}
 #mobile-bar button{padding:4px;font-size:12px;min-width:0;background:transparent;border-color:transparent}
 #mobile-bar button.active{background:#2a6157;border-color:#6fa99b}
 #left,#right{display:none;position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-height:min(62dvh,560px);height:auto;width:100%;overflow-y:auto;overscroll-behavior:contain;z-index:60;padding:14px 15px 18px;background:#13272f;border:1px solid #46636b;border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -10px 26px #06171d99}
 #left:before,#right:before{content:'';display:block;width:36px;height:4px;background:#5d8081;border-radius:3px;margin:-6px auto 12px}
 body[data-mobile-panel="assets"] #left,body[data-mobile-panel="backup"] #left,body[data-mobile-panel="more"] #left,body[data-mobile-panel="inspector"] #right{display:block}
 body[data-mobile-panel="assets"] #left>.section:not(#asset-section),
 body[data-mobile-panel="backup"] #left>.section:not(#backup-section),
 body[data-mobile-panel="more"] #left>.section:not(#glb-section):not(#size-section):not(#mobile-project-actions){display:none}
 body[data-mobile-panel="more"] #mobile-project-actions{display:block}
 body[data-mobile-panel="inspector"] #right>.section{display:block}
 #mobile-scrim{position:fixed;left:0;right:0;top:calc(54px + env(safe-area-inset-top));bottom:calc(64px + env(safe-area-inset-bottom));background:#06121636;z-index:50}
 body[data-mobile-panel]:not([data-mobile-panel="none"]) #mobile-scrim{display:block}
 .toolgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .toolgrid button,.filelabel{min-height:44px}
 .asset-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 input[type=number],input[type=text],select{font-size:16px;min-height:42px}
 input[type=range]{min-height:32px}
 footer{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body>
<div id="app">
<header>
 <div><div class="brand">灯塔世界 <span style="font-weight:400;color:#bbd6d1">/ 地图编辑器</span></div><div class="muted">Map Editor V5.1.0 · DND</div></div>
 <div class="hdr-actions">
  <button id="undo">撤销</button><button id="redo">重做</button><button id="quick-backup" class="primary">快速备份</button>
  <button id="toggle-original" aria-pressed="true">隐藏原版岛屿</button><button id="camera">切换俯视</button><button id="reset-view">重置视角</button>
  <button id="play-map" class="primary">试玩地图</button><button id="open-game">原版游戏</button>
  <button id="save">导出 JSON</button><label for="input-json" class="filelabel">导入地图</label>
  <input id="input-json" type="file" accept=".json,application/json">
 </div>
 <div id="mobile-top-actions"><button id="mobile-undo">撤销</button><button id="mobile-backup" class="primary">备份</button><button id="mobile-play">试玩</button></div>
</header>
<aside id="left">
 <div class="section" id="asset-section">
  <h2>素材资源库</h2><input id="asset-search" type="text" placeholder="搜索模型">
  <select id="asset-filter"><option value="complete" selected>完整元件</option><option value="">全部素材</option><option value="parts">细节零件</option></select>
  <div class="stats" style="margin:8px 0"><span id="selected-asset" class="value">无</span><div id="asset-result" class="muted">加载中…</div></div>
  <div id="assets"></div>
 </div>
 <div class="section" id="glb-section">
  <h2>导入 GLB</h2>
  <label for="import-glb" class="filelabel" style="display:block;text-align:center">选择 GLB 文件</label>
  <input id="import-glb" type="file" accept=".glb,model/gltf-binary" multiple hidden>
  <div id="glb-status" class="muted" style="margin:8px 0"></div>
  <div class="toolgrid"><button id="export-portable">导出完整工程</button><button id="snap-neighbor">模型外框贴边</button></div>
 </div>
 <div class="section" id="backup-section">
  <h2>地图备份</h2>
  <button id="backup-create" class="primary" style="width:100%">快速备份</button>
  <label for="backup-list">选择备份</label>
  <select id="backup-list"><option value="">暂无备份</option></select>
  <div class="toolgrid" style="margin-top:8px">
   <button id="backup-restore">恢复所选备份</button><button id="backup-delete">删除所选备份</button>
  </div>
  <div class="muted" id="backup-status" style="margin-top:7px"></div>
 </div>
 <div class="section" id="size-section">
  <h2>海域尺寸</h2>
  <div class="props"><div><label for="map-width">宽度 X</label><input id="map-width" type="number" min="34" max="430" step=".5" value="146"></div>
  <div><label for="map-depth">深度 Z</label><input id="map-depth" type="number" min="30" max="430" step=".5" value="129"></div></div>
  <div class="toolgrid" style="margin-top:8px"><button id="apply-map-size">应用尺寸</button><button id="frame-world">显示整幅地图</button></div>
 </div>
 <div class="section" id="mobile-project-actions">
  <h2>工程操作</h2>
  <div class="toolgrid">
   <button id="mobile-redo">重做</button><button id="mobile-camera">切换俯视</button><button id="mobile-reset-view">复位视角</button><button id="mobile-original">显示 / 隐藏原版岛</button>
   <button id="mobile-open-game">原版游戏</button><button id="mobile-export">导出 JSON</button>
   <button id="mobile-import-json">导入地图 JSON</button><button id="mobile-full">导出完整工程</button>
  </div>
 </div>
</aside>
<main id="view">
 <div id="mobile-view-controls"><button id="mobile-touch-nav" class="active">浏览视角</button><button id="mobile-touch-edit">编辑模型</button><button id="mobile-view-home">复位</button></div>
 <div id="minimap"><div class="minimap-title"><span>小地图</span><button id="minimap-center" title="回到原点">中心</button></div>
  <canvas id="minimap-canvas" width="250" height="200" aria-label="点击或拖动小地图定位摄像机" role="button" tabindex="0"></canvas>
 </div>
 <div id="toast" role="status"></div>
</main>
<aside id="right">
 <div class="section" id="transform-section">
  <h2>模型变换</h2>
  <div id="transform-tools"><button id="gizmo-move" class="active">移动 G</button><button id="gizmo-rotate">旋转 R</button><button id="gizmo-scale">缩放 S</button></div>
  <div id="transform-numeric" style="margin-top:12px">
   <label for="rot">旋转角度 · <output id="rot-val">0°</output></label>
   <div class="props" style="grid-template-columns:minmax(0,1fr) 85px;align-items:end">
    <input id="rot" type="range" min="0" max="359" step="1" value="0">
    <input id="rot-deg" type="number" min="-360" max="360" step="1" value="0"></div>
   <label for="scale">缩放 · <output id="scale-val">100%</output></label>
   <div class="props" style="grid-template-columns:minmax(0,1fr) 85px;align-items:end">
    <input id="scale" type="range" min=".001" max="2" step=".001" value="1">
    <input id="scale-pct" type="number" min=".1" max="200" step=".1" value="100"></div>
  </div>
  <label style="display:flex;align-items:center;gap:7px"><input id="gizmo-snap" type="checkbox" style="width:auto">网格吸附</label>
 </div>
 <div class="section" id="inspector-section">
  <h2>选中对象</h2><div id="none" class="muted">未选中</div>
  <div id="inspector" hidden>
   <div id="multi-hint" hidden></div>
   <label for="selected-name">模型名称</label><input id="selected-name" type="text">
   <div class="props" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:5px">
    <div><label for="posx">X</label><input id="posx" type="number" step=".1"></div>
    <div><label for="posy">Y</label><input id="posy" type="number" min="-50" max="100" step=".1"></div>
    <div><label for="posz">Z</label><input id="posz" type="number" step=".1"></div>
   </div>
   <h3>模型颜色调整</h3>
   <label for="appearance-brightness">明度 · <output id="appearance-brightness-value">100%</output></label><input id="appearance-brightness" type="range" min="0" max="200" step="1" value="100">
   <label for="appearance-hue">色相 · <output id="appearance-hue-value">0°</output></label><input id="appearance-hue" type="range" min="-180" max="180" step="1" value="0">
   <label for="appearance-saturation">饱和度 · <output id="appearance-saturation-value">100%</output></label><input id="appearance-saturation" type="range" min="0" max="200" step="1" value="100">
   <button id="appearance-reset" type="button" style="width:100%">恢复原始颜色</button>
   <h3>素材默认设置</h3><div class="muted" id="asset-default-status"></div>
   <div class="toolgrid"><button id="overwrite-asset" class="primary">覆盖原素材元件</button><button id="restore-asset-defaults">恢复素材默认值</button></div>
   <div class="toolgrid" style="margin-top:12px"><button id="duplicate">复制</button><button id="delete">删除</button></div>
   <button id="restore-native" hidden style="margin-top:8px;width:100%">复位原模型</button>
  </div>
 </div>
</aside>
<div id="internal-status" hidden aria-hidden="true"><span id="size"></span><span id="grid-size"></span><span id="object-count"></span><span id="tool-name"></span><span id="cursor"></span><span id="dirty"></span></div>
<div id="mobile-scrim" aria-hidden="true"></div>
<nav id="mobile-bar" aria-label="编辑工具"><button data-mobile-tab="assets">素材库</button><button data-mobile-tab="inspector">属性</button><button data-mobile-tab="backup">备份</button><button data-mobile-tab="more">更多</button></nav>
<footer>地图编辑器 V5.1.0</footer>
</div><script type="module" src="./editor.js?v=minimap-backups-v510"></script>
</body></html>
