<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>灯塔世界 · 本地素材管理器 V5.5.5</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e6f0ee;background:#0d1820;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #45616c;background:#203740;border-radius:9px;padding:9px 12px}
button:hover:not(:disabled){background:#31505b}button:disabled{opacity:.42;cursor:not-allowed}
a{color:#a6d6cf;text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:#12252eef;border-bottom:1px solid #35515c;backdrop-filter:blur(12px);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px}.sub{font-size:12px;color:#93afb6;margin-top:3px}.toplinks{display:flex;gap:9px;align-items:center}
main{padding:18px 22px 92px;max-width:1800px;margin:auto}
.summary{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.count{font-size:12px;color:#a6bfbe;padding:7px 11px;border-radius:7px;background:#1c3039;border:1px solid #34525e}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:#142831;border:1px solid #48616a;color:#ecf5f2;padding:10px 12px;border-radius:9px;min-height:40px}
.toolbar input{flex:1;min-width:220px}.toolbar select{min-width:160px}
.primary{background:#276d69;border-color:#4b9990}.danger{background:#822d3a;border-color:#b74e59}
.status{margin:8px 0 14px;color:#bcd5d5;line-height:1.5;font-size:12px}.status.error{color:#ffb8b8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.asset{position:relative;border:1px solid #35515b;background:#152932;border-radius:11px;overflow:hidden;min-width:0}
.asset.selected{outline:2px solid #b4ded1;border-color:#b4ded1}
.preview{position:relative;width:100%;aspect-ratio:4/3;background:radial-gradient(circle at 45% 35%,#32505b,#13242e);display:flex;justify-content:center;align-items:center;overflow:hidden}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.preview .placeholder{font-size:12px;color:#8ca6b1;text-align:center}
.select-item{position:absolute;left:9px;top:9px;width:23px;height:23px;accent-color:#4aa7a0;z-index:3}
.used-tag{position:absolute;right:8px;top:8px;padding:4px 7px;border-radius:6px;background:#6b5232e8;border:1px solid #d3b987;color:#ffe6ac;font-size:10px}
.meta{padding:10px 11px 12px}.name{font-size:13px;line-height:1.4;font-weight:650;word-break:break-word;min-height:19px}
.category{font-size:11px;color:#a6d6cf;margin-top:4px}.details{font-size:10px;color:#a1b6ba;margin-top:5px;line-height:1.5}
.actions{display:flex;gap:6px;margin-top:9px}.actions button{flex:1;font-size:11px;padding:7px 5px}
.empty{grid-column:1/-1;text-align:center;color:#a4b8be;padding:64px 18px;border:1px dashed #46616a;border-radius:14px;background:#12242d}
.empty-icon{font-size:34px;color:#8bc9b9;margin-bottom:8px}.empty p{font-size:12px;line-height:1.6}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#10242ff2;border-top:1px solid #46616a;padding:11px 22px;z-index:30;flex-wrap:wrap}
.bottom .info{font-size:12px;color:#b5caca}#frame{display:none}
@media(max-width:650px){header{padding:12px}main{padding:13px 12px 100px}.toolbar{gap:7px}.toolbar input{min-width:100%;}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.asset .meta{padding:8px}.bottom{padding:10px 12px}}
</style></head><body>
<header>
 <div><div class="brand">灯塔世界 / 全屏素材管理器</div><div class="sub">本地 GLB 资产库 · 与地图编辑器共用同一份 IndexedDB</div></div>
 <nav class="toplinks"><a href="./">返回地图编辑器</a><button id="reload" type="button">刷新本地素材</button></nav>
</header>
<main>
 <div class="summary">
  <span id="total" class="count">读取中…</span><span id="visible" class="count">当前显示 —</span>
  <span id="used" class="count">被地图引用 —</span><span id="storage" class="count">本地数据库连接中…</span>
 </div>
 <div class="toolbar">
  <input id="search" placeholder="搜索模型名称或 ID" aria-label="搜索模型">
  <select id="category" aria-label="素材分类"><option value="all">全部分类</option></select>
  <button id="select-all" type="button">全选可删除项</button><button id="clear-selection" type="button">清空选择</button>
  <input id="files" type="file" accept=".glb,model/gltf-binary" multiple hidden>
  <button id="import" class="primary" type="button">导入 GLB</button>
 </div>
 <div id="status" class="status" role="status">正在连接本地素材库…</div>
 <div id="grid" class="grid"></div>
</main>
<div class="bottom"><span id="selection-info" class="info">已选 0 项</span><button id="delete-selected" class="danger" type="button" disabled>删除所选本地素材</button></div>
<iframe id="frame" sandbox="allow-scripts" src="./asset-preview-frame.html" title="本地模型预览"></iframe>
<script type="module" src="./asset-manager-page-local.js?v=555-local-db"></script>
</body></html>
