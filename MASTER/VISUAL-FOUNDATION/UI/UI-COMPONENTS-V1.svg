<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2926"/>
      <stop offset="1" stop-color="#1f1c1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#d8d0c2"/>
  <text x="64" y="70" font-family="Arial, sans-serif" font-size="28" fill="#312b26" font-weight="700">D&amp;D Hidden-Object UI Component Board V1</text>
  <text x="64" y="106" font-family="Arial, sans-serif" font-size="18" fill="#665f58">Deterministic source: SVG + UI-TOKENS-V1.json · Scene art stays UI-free through Gate 5</text>

  <g id="level-title" transform="translate(64,145)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="96" rx="18" fill="url(#panelFill)" stroke="#b18a4f" stroke-width="3"/>
    <rect x="14" y="14" width="392" height="68" rx="12" fill="#f0e4c8" stroke="#5e4c34" stroke-width="2"/>
    <text x="36" y="53" font-family="Georgia, serif" font-size="28" fill="#302820" font-weight="700">CANDLEKEEP</text>
    <text x="36" y="77" font-family="Arial, sans-serif" font-size="15" fill="#6a5c4c" letter-spacing="1.5">COURT OF AIR</text>
  </g>

  <g id="clue-panel" transform="translate(560,145)" filter="url(#shadow)">
    <rect x="0" y="0" width="700" height="96" rx="18" fill="url(#panelFill)" stroke="#b18a4f" stroke-width="3"/>
    <rect x="14" y="14" width="672" height="68" rx="12" fill="#f6edd8" stroke="#5e4c34" stroke-width="2"/>
    <text x="38" y="56" font-family="Arial, sans-serif" font-size="22" fill="#3c342b">Clue: Find the item used to record a new Seeker.</text>
  </g>

  <g transform="translate(64,305)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#3a342e" font-weight="700">Target slot states</text>

    <g id="target-slot" transform="translate(0,28)" filter="url(#shadow)">
      <rect width="176" height="176" rx="18" fill="url(#panelFill)" stroke="#b18a4f" stroke-width="3"/>
      <rect x="14" y="14" width="148" height="116" rx="12" fill="#eee3cc" stroke="#5e4c34" stroke-width="2"/>
      <circle cx="88" cy="72" r="34" fill="#c9b48d" stroke="#66553f" stroke-width="3"/>
      <rect x="46" y="144" width="84" height="8" rx="4" fill="#8f7d66"/>
      <text x="88" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d7c7aa">TARGET</text>
    </g>

    <g id="state-selected" transform="translate(210,28)" filter="url(#shadow)">
      <rect width="176" height="176" rx="18" fill="#31271d" stroke="#d0a761" stroke-width="6"/>
      <rect x="14" y="14" width="148" height="116" rx="12" fill="#f2e7ce" stroke="#d0a761" stroke-width="3"/>
      <circle cx="88" cy="72" r="34" fill="#c9b48d" stroke="#66553f" stroke-width="3"/>
      <text x="88" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f0d59f" font-weight="700">SELECTED</text>
    </g>

    <g id="state-found" transform="translate(420,28)" filter="url(#shadow)">
      <rect width="176" height="176" rx="18" fill="#252522" stroke="#87936f" stroke-width="4"/>
      <rect x="14" y="14" width="148" height="116" rx="12" fill="#d9d5c7" stroke="#87936f" stroke-width="2"/>
      <circle cx="88" cy="72" r="34" fill="#b8b4a8" stroke="#6c7461" stroke-width="3"/>
      <path d="M62 72 l18 18 l36 -42" fill="none" stroke="#647153" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b6c09f" font-weight="700">FOUND</text>
    </g>
  </g>

  <g id="target-bar" transform="translate(64,570)" filter="url(#shadow)">
    <rect x="0" y="0" width="1472" height="248" rx="24" fill="url(#panelFill)" stroke="#b18a4f" stroke-width="4"/>
    <rect x="20" y="20" width="1432" height="208" rx="18" fill="#282421" stroke="#5e4c34" stroke-width="2"/>
    <text x="42" y="54" font-family="Georgia, serif" font-size="24" fill="#e5d2ac" font-weight="700">FIND THESE</text>
    <text x="1405" y="52" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="#aa9a83">3 / 8 found</text>

    <g transform="translate(42,72)">
      <g transform="translate(0,0)"><rect width="176" height="132" rx="14" fill="#efe4cd" stroke="#b18a4f" stroke-width="3"/><circle cx="88" cy="54" r="31" fill="#c5b18b"/><text x="88" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="#554838">Ledger</text></g>
      <g transform="translate(218,0)"><rect width="176" height="132" rx="14" fill="#efe4cd" stroke="#b18a4f" stroke-width="3"/><rect x="60" y="24" width="56" height="56" rx="8" fill="#a58559"/><text x="88" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="#554838">Seal</text></g>
      <g transform="translate(436,0)"><rect width="176" height="132" rx="14" fill="#efe4cd" stroke="#b18a4f" stroke-width="3"/><path d="M60 72 q28 -62 56 0 q-28 24 -56 0" fill="#72839a"/><text x="88" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="#554838">Quill</text></g>
      <g transform="translate(654,0)"><rect width="176" height="132" rx="14" fill="#efe4cd" stroke="#b18a4f" stroke-width="3"/><circle cx="88" cy="54" r="30" fill="#8d7656"/><text x="88" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="#554838">Satchel</text></g>
      <g transform="translate(872,0)"><rect width="176" height="132" rx="14" fill="#d6d2c6" stroke="#87936f" stroke-width="3"/><path d="M61 56 l18 18 l36 -42" fill="none" stroke="#647153" stroke-width="11" stroke-linecap="round"/><text x="88" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7162">Found</text></g>
      <g transform="translate(1090,0)"><rect width="176" height="132" rx="14" fill="#efe4cd" stroke="#d0a761" stroke-width="5"/><circle cx="88" cy="54" r="30" fill="#c3a67b"/><text x="88" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="#554838">Selected</text></g>
    </g>
  </g>
</svg>
