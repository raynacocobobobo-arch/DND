services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/hermestodo.sqlite
      BACKUP_DIRECTORY: /app/backups
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - "./data:/app/data"
      - "./backups:/app/backups"
    healthcheck:
      test: ["CMD", "node", "scripts/smoke.mjs", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
