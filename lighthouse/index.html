<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1926">
<title>灯塔岛 · 3D 场景预览 | DND</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1b29;color:#f0e8dc;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#viewport{position:fixed;inset:0;touch-action:none;background:radial-gradient(ellipse at 48% 27%,#314d63 0%,#1d3448 38%,#091925 100%)}
#viewport canvas{display:block;width:100%;height:100%}
header{pointer-events:none;position:fixed;left:clamp(18px,3.5vw,48px);top:clamp(18px,3.5vw,40px);text-shadow:0 2px 12px #03101880}
.kicker{font-size:11px;font-weight:600;letter-spacing:.26em;color:#a8c4d3}h1{font-family:Georgia,"Noto Serif SC",serif;font-weight:400;font-size:clamp(25px,3.5vw,42px);margin:9px 0 8px}
header p{margin:0;color:#c4d2d9;font-size:13px;line-height:1.7;max-width:390px}
nav{position:fixed;right:clamp(12px,2vw,28px);top:clamp(14px,2vw,28px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
button{cursor:pointer;appearance:none;background:#0a1926c9;backdrop-filter:blur(15px);border:1px solid #ffffff35;border-radius:8px;color:#f4eadc;padding:10px 13px;font:12px system-ui,sans-serif;transition:background .15s,border .15s}
button:hover,button[aria-pressed=true]{background:#386476d9;border-color:#bcd6df77}
#hud{position:fixed;left:clamp(18px,3.5vw,48px);bottom:clamp(18px,3vw,36px);pointer-events:none;color:#b6c7ce;font-size:12px;line-height:1.8}
#status{position:fixed;right:20px;bottom:22px;color:#e8dfc8;background:#101f2bd9;border:1px solid #b4c7d03c;border-radius:8px;padding:10px 14px;font-size:12px}
#status[hidden]{display:none}
a{color:inherit}
@media(max-width:680px){header{top:16px}header p{max-width:240px;font-size:11px}h1{font-size:24px}nav{top:auto;bottom:18px;right:10px;left:10px;max-width:none;justify-content:center}nav button{padding:11px}#hud{bottom:86px;font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head>
<body>
<div id="viewport"></div>
<header><div class="kicker">DND / INTERACTIVE DIORAMA</div><h1>灯塔岛屿</h1><p>STYLIZED B · V7g 结构修正 · 方形地形切块<br>重新制作的灯塔、小屋、岩体、沉船与海岸；可自由旋转</p></header>
<nav aria-label="三维场景控制">
<button id="reset" type="button">重置视角</button>
<button id="topview" type="button">顶部俯视</button>
<button id="rotate" type="button" aria-pressed="false">自动旋转</button>
<button id="shadows" type="button" aria-pressed="true">柔和阴影</button>
<button id="capture" type="button">保存画面</button>
<button id="fullscreen" type="button">全屏</button>
</nav>
<div id="hud">鼠标拖动：旋转视角 · 滚轮：缩放 · 右键拖动：平移<br>触屏：单指旋转 · 双指缩放</div>
<div id="status" role="status">正在加载 V7 三维场景…</div>
<script type="module" src="./scene-v2.js?v=20261101-v7g"></script>
<script>window.addEventListener('error',function(e){let s=document.getElementById('status'); if(s){s.hidden=false;s.textContent='无法加载三维场景，请确认网络能访问 jsDelivr。'+(e.message||'')}});</script>
</body></html>
