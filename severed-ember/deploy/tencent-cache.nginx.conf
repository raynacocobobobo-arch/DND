# Standalone static virtual host for /srv/www/severed-ember.
# Apply only after stopping the old Python listener on port 18088.
# Bind to loopback: an existing HTTPS reverse proxy should provide public access.
server {
    listen 127.0.0.1:18088;
    server_name _;
    root /srv/www/severed-ember;
    index index.html;
    server_tokens off;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /assets/rules-fragment.html {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|json|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
